<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Ultimate - V10</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#2563EB">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #F3F4F6; padding-bottom: 100px; user-select: none; }
        .page { display: none; } .page.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 20px; border-radius: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .input-f { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #E5E7EB; margin-bottom: 10px; font-size: 16px; outline: none; }
        .btn-blue { background: #2563EB; color: white; padding: 18px; border-radius: 18px; font-weight: 800; width: 100%; active:scale-95; transition: 0.2s; border: none; }
        .locked { filter: blur(12px); pointer-events: none; opacity: 0.5; }
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #E5E7EB; z-index: 1000; }
        nav button { color: #9CA3AF; font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 5px; background: none; border: none; }
        nav button.active { color: #2563EB; }
        .badge-exp { px-3; py-1; rounded-full; text-[10px]; font-black; }
    </style>
</head>
<body>

    <header class="p-5 bg-white border-b flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 class="font-black text-xl text-blue-600 tracking-tighter">ComptaPro <span class="text-orange-500">ULTIMATE</span></h1>
            <p id="licence-text" class="text-[9px] font-bold text-gray-400 uppercase tracking-widest"></p>
        </div>
        <div id="days-badge" class="px-3 py-1 rounded-full text-[10px] font-black"></div>
    </header>

    <main class="p-4">
        
        <div id="page-home" class="page active">
            <div class="bg-blue-600 p-8 rounded-[35px] text-white shadow-2xl mb-6 relative overflow-hidden">
                <p class="text-xs opacity-70 uppercase font-black">Bénéfice Net (Charges déduites)</p>
                <h2 class="text-4xl font-black mt-1"><span id="valP">0</span> <small class="cur"></small></h2>
                <div class="mt-4 grid grid-cols-3 gap-2 text-[10px] font-bold text-blue-100">
                    <div class="bg-blue-500/30 p-2 rounded-xl text-center">JOUR<br><span id="repJ">0</span></div>
                    <div class="bg-blue-500/30 p-2 rounded-xl text-center">SEM.<br><span id="repS">0</span></div>
                    <div class="bg-blue-500/30 p-2 rounded-xl text-center">MOIS<br><span id="repM">0</span></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center p-4 text-blue-600"><i data-lucide="shopping-cart"></i><span class="text-[10px] font-black mt-2">VENTE</span></button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center p-4 text-red-500"><i data-lucide="trending-down"></i><span class="text-[10px] font-black mt-2">CHARGE</span></button>
            </div>

            <h3 class="text-xs font-black text-gray-400 mb-3 uppercase flex items-center gap-2"><i data-lucide="activity"></i> Flux de trésorerie</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Encaisser</h2>
                <div class="card border-t-4 border-blue-600">
                    <input type="text" id="vendeur" placeholder="Nom du Vendeur" class="input-f bg-gray-50">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    <div class="flex gap-2">
                        <select id="sel_p" class="input-f flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0">
                        <button onclick="addCart()" class="bg-blue-600 text-white px-4 rounded-xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="mt-4 space-y-2 border-t border-dashed pt-4"></div>
                    <div class="mt-6 flex justify-between items-center font-black">
                        <span class="text-xl">Total: <span id="cartT">0</span> <small class="cur"></small></span>
                        <button onclick="doSale()" class="bg-green-600 text-white px-8 py-4 rounded-2xl shadow-lg">VENDRE</button>
                    </div>
                </div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-black mb-6">Nouvelle Charge</h2>
                <div class="card border-t-4 border-red-500">
                    <input type="text" id="exp_name" placeholder="Motif (Loyer, Transport...)" class="input-f">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-f">
                    <button onclick="addExpense()" class="btn-blue bg-red-500">DÉDUIRE DU BÉNÉFICE</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white p-3 rounded-full"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card bg-blue-50 border-2 border-blue-100">
                    <input type="text" id="p_name" placeholder="Désignation" class="input-f">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-f">
                    <button onclick="addStock()" class="btn-blue">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Administration</h2>
            <div class="card bg-gray-900 text-white">
                <p class="text-[10px] font-black opacity-50 uppercase">ID Licence</p>
                <h3 id="displayID" class="text-2xl font-mono font-black mt-1 text-blue-400"></h3>
            </div>
            <div class="card border-2 border-green-200 mt-4">
                <h3 class="font-black text-sm mb-2">Renouveler Licence (30j)</h3>
                <input type="text" id="activation-key" placeholder="Code PRO-XXXX" class="input-f text-center font-mono uppercase">
                <button onclick="checkKey()" class="btn-blue bg-green-600 mb-3">ACTIVER</button>
                <button onclick="contactWA()" class="w-full text-[10px] font-black text-green-600">CONTACTER (+226 66566140)</button>
            </div>
            <div class="card mt-4">
                <button onclick="exportAudit()" class="btn-blue bg-black mb-3">EXPORTER L'AUDIT (.JSON)</button>
                <button onclick="resetProfitAudit()" class="w-full p-4 rounded-2xl bg-red-50 text-red-600 font-black text-xs uppercase border border-red-100">Remise à zéro Tracée</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vente</button>
        <button onclick="nav('expense')" id="n-expense"><i data-lucide="trending-down"></i>Charge</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="shield-check"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V10_ULTIMATE')) || { 
            p:{name:"Mon Business", cur:"FCFA"}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V10_ULTIMATE', JSON.stringify(db)); }

        // --- LICENCE (ID*7+42+MOIS) ---
        function checkLicense() {
            const now = new Date().getTime();
            const badge = document.getElementById('days-badge');
            const statusText = document.getElementById('licence-text');
            const isOk = db.expiryDate && now < db.expiryDate;
            
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if (!isOk) {
                badge.innerText = "EXPIRÉ"; badge.className = "px-3 py-1 rounded-full text-[10px] font-black bg-red-100 text-red-600";
                statusText.innerText = "Accès Restreint";
            } else {
                const days = Math.ceil((db.expiryDate - now) / 86400000);
                badge.innerText = days + " JOURS"; badge.className = "px-3 py-1 rounded-full text-[10px] font-black bg-green-100 text-green-600";
                statusText.innerText = "Licence Active";
            }
            return isOk;
        }

        function checkKey() {
            const input = document.getElementById('activation-key').value.trim().toUpperCase();
            const formula = (parseInt(db.licenseID.replace(/\D/g, '')) * 7) + 42 + (new Date().getMonth() + 1);
            if (input === "PRO-" + formula) {
                const base = (db.expiryDate && db.expiryDate > Date.now()) ? db.expiryDate : Date.now();
                db.expiryDate = base + (30 * 86400000);
                save(); alert("✅ ACTIVÉ !"); location.reload();
            } else { alert("❌ Code incorrect"); }
        }

        // --- GESTION DES CHARGES ---
        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a;
            db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now()});
            save(); render(); nav('home');
            alert("Charge enregistrée !");
        }

        // --- VENTES ET RAPPORTS ---
        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant");
            cart.push({...it, sq:q, st:it.s*q}); renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map(i => { t+=i.st; return `<div class="flex justify-between text-xs font-bold bg-gray-50 p-2 rounded-lg"><span>${i.n} x${i.sq}</span><span>${i.st}</span></div>`}).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
        }

        function doSale() {
            if(!checkLicense()) return alert("Activez la licence !");
            let ven = document.getElementById('vendeur').value || "Inconnu";
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s - c.c) * c.sq; });
            db.prof += tP;
            const sale = {id:Date.now(), ven, cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()};
            db.sales.push(sale); genPDF(sale);
            save(); cart=[]; render(); nav('home');
        }

        function genPDF(s) {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('p', 'mm', [80, 150]);
            doc.setFontSize(14).text(db.p.name, 10, 10);
            doc.setFontSize(8).text("Vendeur: "+s.ven + " | Client: "+s.cli, 10, 18);
            doc.text("Date: "+s.d, 10, 22);
            doc.autoTable({ startY: 25, head: [['Art.', 'Qté', 'T.']], body: s.items.map(i => [i.n, i.sq, i.st]), styles: {fontSize: 7}, theme: 'plain' });
            doc.text("TOTAL: " + s.tot + " " + db.p.cur, 10, doc.lastAutoTable.finalY + 10);
            doc.text("Merci de votre visite !", 10, doc.lastAutoTable.finalY + 15);
            doc.save(`Ticket_${Date.now()}.pdf`);
        }

        // --- RAPPORTS TEMPORELS ---
        function updateReports() {
            const now = Date.now();
            const oneDay = 86400000, oneWeek = oneDay * 7, oneMonth = oneDay * 30;
            const calc = (time) => db.sales.filter(s => (now - s.t) < time).reduce((a,b) => a + b.tot, 0);
            document.getElementById('repJ').innerText = calc(oneDay).toLocaleString();
            document.getElementById('repS').innerText = calc(oneWeek).toLocaleString();
            document.getElementById('repM').innerText = calc(oneMonth).toLocaleString();
        }

        function render() {
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.p.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            const histHtml = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 20).map(item => {
                const isExp = item.a !== undefined; const isReset = item.montant !== undefined;
                return `<div class="card flex justify-between items-center ${isReset?'bg-red-50 border-l-4 border-red-500':''}">
                    <div><b class="${isExp?'text-red-500':isReset?'text-red-700':''}">${item.n || item.cli}</b><br><small class="text-[9px] text-gray-400">${item.d} ${item.ven ? '• '+item.ven : ''}</small></div>
                    <b class="${isExp?'text-red-500':isReset?'text-red-700':'text-blue-600'}">${(item.tot || -item.a || -item.montant).toLocaleString()}</b>
                </div>`;
            }).join('');
            
            document.getElementById('hist').innerHTML = histHtml;
            document.getElementById('stkList').innerHTML = db.stk.map(i => `<div class="card flex justify-between text-xs"><span><b>${i.n}</b> (Qté: ${i.q})</span><b>${i.s}</b></div>`).join('');
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            checkLicense(); updateReports(); lucide.createIcons();
        }

        function resetProfitAudit() {
            if(confirm("Confirmer la remise à zéro ?")){
                db.resets.push({id:Date.now(), n:"🛠 AUDIT RESET", montant:db.prof, d:new Date().toLocaleString()});
                db.prof = 0; save(); render();
            }
        }

        function exportAudit() {
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `ComptaPro_Audit.json`; a.click();
        }

        function nav(id) { 
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active'); 
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        window.onload = () => { render(); };
    </script>
</body>
</html>
