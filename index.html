<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Cloud Ready</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226,232,240,0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; background: #FDFDFD; box-sizing: border-box; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
        .btn-blue { background: linear-gradient(135deg,#2563EB 0%,#1D4ED8 100%); color: white; padding: 18px; border-radius: 20px; font-weight: 700; width: 100%; border: none; cursor: pointer; }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; border: none; background: none; cursor: pointer; }
        nav button.active { color: #2563EB; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 40px 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 12px; text-transform: uppercase; }
        #toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 20px; font-size: 12px; font-weight: 700; z-index: 9999; opacity: 0; transition: 0.4s; pointer-events: none; }
        #toast.show { opacity: 1; }
        #toast.success { background: #0f172a; color: white; }
        #toast.error { background: #ef4444; color: white; }
        #debug-panel { background: #0f172a; color: #94a3b8; font-family: monospace; font-size: 10px; padding: 12px 16px; border-radius: 16px; max-height: 120px; overflow-y: auto; margin-top: 8px; }
        .ok { color: #4ade80; } .err { color: #f87171; } .inf { color: #60a5fa; }
        .spin { animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div id="toast"></div>

<div id="overlay-screen">
  <div class="max-w-md mx-auto">
    <h2 id="setup-title" class="text-3xl font-extrabold text-slate-900 mb-2">Configuration</h2>
    <div class="space-y-4 mt-6">
      <input type="text" id="setup-user" placeholder="Votre Nom" class="input-f">
      <input type="text" id="setup-biz" placeholder="Nom Boutique" class="input-f">
      <input type="text" id="setup-phone" placeholder="Téléphone" class="input-f">
      <select id="setup-cur" class="input-f"><option value="FCFA">FCFA</option><option value="GNF">GNF</option><option value="$">$</option></select>
      
      <div class="bg-blue-50 p-5 rounded-[24px] border-2 border-blue-100">
        <div class="flex items-center justify-center gap-2 mb-2">
          <span id="cloud-dot" class="w-2.5 h-2.5 bg-slate-300 rounded-full"></span>
          <label class="text-[10px] font-extrabold text-blue-600 uppercase tracking-widest">Cloud Firebase</label>
        </div>
        <input type="email" id="setup-email" placeholder="Email" class="input-f">
        <input type="password" id="setup-pass" placeholder="Mot de passe" class="input-f !mb-3">
        <button id="cloud-connect-btn" onclick="connectCloud()" class="w-full bg-blue-600 text-white py-3 rounded-2xl font-bold text-xs border-none cursor-pointer">
          <span id="cloud-btn-text">ACTIVER LA SYNCHRONISATION</span>
        </button>
        <div id="debug-panel"><p class="inf">▶ Prêt pour connexion...</p></div>
      </div>

      <button onclick="saveSetup()" class="btn-blue mt-4">SAUVEGARDER</button>
      <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm hidden py-2 border-none bg-transparent cursor-pointer">IGNORER</button>
    </div>
  </div>
</div>

<header class="p-6 bg-white/80 backdrop-blur-md border-b flex justify-between items-center sticky top-0 z-[1100]">
  <h1 id="header-biz" class="font-extrabold text-xl uppercase">ComptaPro</h1>
  <div class="flex items-center gap-2">
    <button onclick="manualSync()" class="w-9 h-9 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 border-none cursor-pointer">
      <i data-lucide="cloud-upload" id="sync-icon" class="w-4 h-4"></i>
    </button>
    <div id="days-badge" class="badge-status"></div>
  </div>
</header>

<main class="p-5 max-w-xl mx-auto">
  <div id="page-home" class="page active">
    <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8">
      <p class="text-xs opacity-60 uppercase font-extrabold mb-1">Bénéfice Net</p>
      <h2 class="text-4xl font-extrabold tracking-tighter"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <button onclick="goPage('sale')" class="card flex flex-col items-center gap-3 p-6 text-blue-600 border-none bg-white cursor-pointer"><i data-lucide="shopping-cart"></i><span>Vendre</span></button>
      <button onclick="goPage('pro')" class="card flex flex-col items-center gap-3 p-6 text-slate-600 border-none bg-white cursor-pointer"><i data-lucide="user"></i><span>Admin</span></button>
    </div>
  </div>

  <div id="page-sale" class="page">
    <h2 class="text-2xl font-extrabold mb-6">Nouvelle Vente</h2>
    <div class="card border-t-8 border-blue-600">
        <p class="text-center text-slate-400 text-sm">Contenu de vente ici...</p>
        <button onclick="goPage('home')" class="btn-blue mt-4">Retour</button>
    </div>
  </div>

  <div id="page-pro" class="page">
    <h2 class="text-2xl font-extrabold mb-6">Administration</h2>
    <div class="card bg-blue-50 border-blue-100">
        <p class="text-sm font-bold" id="cloud-user-admin">Non connecté</p>
        <button onclick="openSetup(true)" class="text-blue-600 font-bold text-xs border-none bg-transparent cursor-pointer mt-2">Paramètres Cloud →</button>
    </div>
    <button onclick="logout()" class="w-full py-8 text-red-300 font-bold text-xs uppercase border-none bg-transparent cursor-pointer">Réinitialiser l'application</button>
  </div>
</main>

<nav>
  <button onclick="goPage('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
  <button onclick="goPage('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
  <button onclick="goPage('pro')" id="n-pro"><i data-lucide="user"></i>Admin</button>
</nav>

<script>
// --- CONFIGURATION FIREBASE ---
let fbAuth = null, fbDB = null, currentUser = null, firebaseReady = false;

async function initFirebase() {
    log("⏳ Chargement SDK...", "inf");
    const scripts = [
        "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
        "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js",
        "https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"
    ];

    try {
        for (const s of scripts) {
            await new Promise((res, rej) => {
                const sc = document.createElement('script');
                sc.src = s; sc.onload = res; sc.onerror = rej;
                document.head.appendChild(sc);
            });
        }

        const config = {
            apiKey: "AIzaSyCPtymnAB2eO26TjGiSzzxZpA89WwqYeiI",
            authDomain: "compta-pro-1b8bb.firebaseapp.com",
            databaseURL: "https://compta-pro-1b8bb-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "compta-pro-1b8bb"
        };

        if (!firebase.apps.length) firebase.initializeApp(config);
        fbAuth = firebase.auth();
        fbDB = firebase.database();
        firebaseReady = true;
        log("✅ Firebase Prêt", "ok");

        fbAuth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                log("✅ Connecté: " + user.email, "ok");
                updateUICloud(true, user.email);
            } else {
                updateUICloud(false);
            }
        });

    } catch(e) { log("❌ Erreur SDK: " + e.message, "err"); }
}

async function connectCloud() {
    if (!firebaseReady) return showToast("Firebase charge...", "error");
    
    const email = document.getElementById('setup-email').value.trim();
    const pass = document.getElementById('setup-pass').value.trim();
    
    if (!email || pass.length < 6) return showToast("Email/Pass (6 car.) requis", "error");

    document.getElementById('cloud-btn-text').innerText = "⏳ CONNEXION...";
    
    try {
        await fbAuth.signInWithEmailAndPassword(email, pass);
    } catch (err) {
        if (err.code === 'auth/operation-not-allowed') {
            log("❌ ACTION REQUISE: Activez 'Email/Mot de passe' dans Firebase Console !", "err");
            showToast("Erreur: Authentification non activée sur le serveur", "error");
        } else if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
            log("⏳ Création de compte...", "inf");
            try { 
                await fbAuth.createUserWithEmailAndPassword(email, pass);
                showToast("Compte créé !", "success");
            } catch(e2) { log("❌ " + e2.message, "err"); }
        } else {
            log("❌ " + err.message, "err");
            showToast(err.message, "error");
        }
    }
    document.getElementById('cloud-btn-text').innerText = "ACTIVER LA SYNCHRONISATION";
}

// --- UTILITAIRES ---
let db = JSON.parse(localStorage.getItem('CP_V13')) || { biz:{}, prof:0 };

function log(m, t) {
    const p = document.getElementById('debug-panel');
    if(p) { p.innerHTML += `<p class="${t}">${m}</p>`; p.scrollTop = p.scrollHeight; }
}

function showToast(m, t) {
    const el = document.getElementById('toast');
    el.innerText = m; el.className = "show " + t;
    setTimeout(() => el.className = "", 3000);
}

function updateUICloud(connected, email = "") {
    document.getElementById('cloud-dot').style.background = connected ? "#4ade80" : "#cbd5e1";
    document.getElementById('cloud-user-admin').innerText = connected ? "Cloud: " + email : "Cloud non connecté";
}

function goPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-'+id).classList.add('active');
    lucide.createIcons();
}

function openSetup(isEdit) { 
    document.getElementById('overlay-screen').style.display = 'block'; 
    if(isEdit) document.getElementById('cancel-setup').classList.remove('hidden');
}

function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

function saveSetup() {
    db.biz.name = document.getElementById('setup-biz').value;
    localStorage.setItem('CP_V13', JSON.stringify(db));
    showToast("Sauvegardé", "success");
    closeSetup();
}

function logout() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }

window.onload = () => {
    initFirebase();
    if(!db.biz.name) openSetup(false);
    lucide.createIcons();
};
</script>
</body>
</html>
