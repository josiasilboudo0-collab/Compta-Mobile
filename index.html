<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Cloud</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; transition: transform 0.2s; }
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; transition: all 0.2s; background: #FDFDFD; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); background: white; }
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 18px; border-radius: 20px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        nav button.active { color: #2563EB; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 40px 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 12px; text-transform: uppercase; }
        .low-stock-alert { color: #ef4444 !important; animation: pulse-red 1s infinite; font-weight: 800; }
        @keyframes pulse-red { 50% { opacity: 0.5; } }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <h2 id="setup-title" class="text-4xl font-extrabold text-slate-900 mb-2 tracking-tight">Configuration Cloud</h2>
        <p class="text-slate-500 mb-10 font-medium">Vos données seront sauvegardées en sécurité.</p>
        <div class="space-y-2">
            <div class="bg-blue-50/50 p-4 rounded-3xl border border-dashed border-blue-200 text-center mb-4">
                <input type="file" id="setup-logo" accept="image/*" class="text-xs">
            </div>
            <input type="email" id="setup-email" placeholder="Email (Compte Cloud)" class="input-f font-bold text-blue-600">
            <input type="password" id="setup-pass" placeholder="Mot de passe" class="input-f">
            <hr class="my-4">
            <input type="text" id="setup-user" placeholder="Votre Nom" class="input-f">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-f">
            <input type="text" id="setup-addr" placeholder="Adresse Physique" class="input-f">
            <input type="text" id="setup-phone" placeholder="Contact Téléphone" class="input-f">
            <select id="setup-cur" class="input-f">
                <option value="FCFA">Devise : FCFA</option>
                <option value="GNF">Devise : GNF</option>
                <option value="$">Devise : Dollar ($)</option>
                <option value="€">Devise : Euro (€)</option>
            </select>
            <button id="btn-save-setup" onclick="saveSetup()" class="btn-blue text-lg mt-4">SAUVEGARDER & SYNCHRONISER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm mt-4 hidden">ANNULER</button>
        </div>
    </div>

    <header class="p-6 bg-white/80 backdrop-blur-md border-b border-slate-100 flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 tracking-tighter uppercase">ComptaPro</h1>
            <p id="cloud-status" class="text-[8px] font-bold text-green-500 uppercase">Cloud Connecté</p>
        </div>
        <div id="days-badge" class="badge-status"></div>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600 rounded-full blur-[60px] opacity-40"></div>
                <p class="text-xs opacity-60 uppercase font-extrabold tracking-widest mb-1">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">JOUR</span>
                        <span id="repJ" class="font-extrabold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">SEM.</span>
                        <span id="repS" class="font-extrabold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">MOIS</span>
                        <span id="repM" class="font-extrabold text-sm">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-3 p-6 text-blue-600">
                    <div class="w-12 h-12 bg-blue-50 rounded-2xl flex items-center justify-center"><i data-lucide="shopping-cart"></i></div>
                    <span class="text-xs font-extrabold uppercase text-slate-700">Vendre</span>
                </button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-3 p-6 text-red-500">
                    <div class="w-12 h-12 bg-red-50 rounded-2xl flex items-center justify-center"><i data-lucide="arrow-down-circle"></i></div>
                    <span class="text-xs font-extrabold uppercase text-slate-700">Dépense</span>
                </button>
            </div>
            <h3 class="text-xs font-extrabold text-slate-400 mb-4 uppercase tracking-widest px-1">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Nouvelle Vente</h2>
                <div class="card border-t-8 border-blue-600">
                    <input type="text" id="vendeur" placeholder="Vendeur" class="input-f bg-slate-50">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-slate-900 text-white px-5 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="mt-4 space-y-2 border-t border-dashed pt-5"></div>
                    <div id="money-calc" class="mt-6 p-4 bg-slate-50 rounded-2xl hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400">REÇU</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-32 p-2 rounded-lg border font-bold text-right" placeholder="0">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400">MONNAIE</span>
                            <span id="change-due" class="font-extrabold text-green-600">0</span>
                        </div>
                    </div>
                    <div class="mt-8 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Total Net</p>
                            <span class="font-extrabold text-3xl tracking-tighter"><span id="cartT">0</span> <small class="cur text-lg text-slate-400"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-extrabold shadow-lg">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Enregistrer une Charge</h2>
                <div class="card border-t-8 border-red-500">
                    <input type="text" id="exp_name" placeholder="Motif de la dépense" class="input-f">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-f">
                    <button onclick="addExpense()" class="w-full bg-red-500 text-white p-5 rounded-2xl font-extrabold">ENREGISTRER</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-5 py-2.5 rounded-2xl font-bold flex items-center gap-2 shadow-lg"><i data-lucide="plus" class="w-4 h-4"></i> Produit</button>
                </div>
                <div id="stk-form" class="hidden card bg-blue-50/50 border-blue-100">
                    <input type="text" id="p_name" placeholder="Nom de l'article" class="input-f">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité Initiale" class="input-f">
                    <button onclick="addStock()" class="btn-blue mt-2">AJOUTER AU STOCK</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6">Administration</h2>
            <div class="bg-slate-900 rounded-[30px] p-6 text-white mb-6 flex justify-between items-center">
                <div>
                    <p class="text-[10px] font-bold opacity-50 uppercase tracking-widest mb-1">ID Licence</p>
                    <h3 id="displayID" class="text-xl font-mono font-bold text-blue-400"></h3>
                </div>
                <button onclick="copyID()" class="bg-white/10 p-3 rounded-2xl"><i data-lucide="copy"></i></button>
            </div>

            <button onclick="openSetup(true)" class="card w-full flex items-center justify-between p-5 font-bold text-slate-700 mb-4">
                <div class="flex items-center gap-4"><i data-lucide="settings-2" class="text-blue-600"></i> Modifier Profil Cloud</div>
                <i data-lucide="chevron-right" class="w-4 h-4 opacity-30"></i>
            </button>

            <div class="card space-y-3">
                <h3 class="font-extrabold text-[10px] text-slate-400 uppercase tracking-widest px-1">Maintenance</h3>
                <button onclick="exportAudit()" class="w-full flex items-center justify-between p-4 bg-slate-50 rounded-2xl font-bold text-sm text-slate-600">Exporter les données <i data-lucide="download"></i></button>
                <button onclick="resetProfitAudit()" class="w-full p-4 text-red-500 font-extrabold text-[10px] uppercase border border-red-50 rounded-2xl">Remise à zéro caisse</button>
            </div>

            <button onclick="logout()" class="w-full py-8 text-slate-300 font-bold text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                <i data-lucide="log-out"></i> Déconnexion & Effacer Local
            </button>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user"></i>Admin</button>
    </nav>

    <script>
        // --- CONFIGURATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "TON_API_KEY",
            authDomain: "TON_PROJET.firebaseapp.com",
            projectId: "TON_PROJET",
            storageBucket: "TON_PROJET.appspot.com",
            messagingSenderId: "TON_ID",
            appId: "TON_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const fdb = firebase.firestore();

        let db = JSON.parse(localStorage.getItem('CP_V13_ULTIMATE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            expiryDate: null, 
            installDate: Date.now() 
        };
        let cart = [];

        // --- SAUVEGARDE LOCALE + CLOUD ---
        async function save() { 
            localStorage.setItem('CP_V13_ULTIMATE', JSON.stringify(db));
            if (auth.currentUser) {
                try {
                    await fdb.collection("users").doc(auth.currentUser.uid).set(db);
                    document.getElementById('cloud-status').innerText = "Cloud Sync: OK";
                    document.getElementById('cloud-status').className = "text-[8px] font-bold text-green-500 uppercase";
                } catch (e) {
                    document.getElementById('cloud-status').innerText = "Cloud Sync: Erreur";
                    document.getElementById('cloud-status').className = "text-[8px] font-bold text-red-500 uppercase";
                }
            }
        }

        window.onload = () => {
            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const snap = await fdb.collection("users").doc(user.uid).get();
                    if (snap.exists) {
                        db = snap.data();
                        render();
                    }
                } else if (!db.biz.name) {
                    openSetup(false);
                }
                render();
            });
        };

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-title').innerText = "Modifier Profil";
                document.getElementById('setup-email').value = db.biz.email || "";
                document.getElementById('setup-pass').value = db.biz.pass || "";
                document.getElementById('setup-user').value = db.biz.user;
                document.getElementById('setup-biz').value = db.biz.name;
                document.getElementById('setup-addr').value = db.biz.addr;
                document.getElementById('setup-phone').value = db.biz.phone;
                document.getElementById('setup-cur').value = db.biz.cur;
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

        async function saveSetup() {
            const email = document.getElementById('setup-email').value;
            const pass = document.getElementById('setup-pass').value;
            const bizName = document.getElementById('setup-biz').value;
            
            if(!email || !pass || !bizName) return alert("Email, Password et Nom requis");
            
            const btn = document.getElementById('btn-save-setup');
            btn.innerText = "CONNEXION CLOUD...";
            btn.disabled = true;

            try {
                // Auth Firebase
                let userCredential;
                try {
                    userCredential = await auth.createUserWithEmailAndPassword(email, pass);
                } catch (e) {
                    userCredential = await auth.signInWithEmailAndPassword(email, pass);
                }
                
                const logoFile = document.getElementById('setup-logo').files[0];
                const reader = new FileReader();

                const finalize = (logoData) => {
                    db.biz = {
                        uid: userCredential.user.uid,
                        email: email, pass: pass,
                        user: document.getElementById('setup-user').value,
                        name: bizName, addr: document.getElementById('setup-addr').value,
                        phone: document.getElementById('setup-phone').value,
                        cur: document.getElementById('setup-cur').value,
                        logo: logoData || db.biz.logo || ""
                    };
                    save().then(() => location.reload());
                };

                if (logoFile) {
                    reader.onloadend = () => finalize(reader.result);
                    reader.readAsDataURL(logoFile);
                } else finalize();

            } catch (error) {
                alert("Erreur Cloud: " + error.message);
                btn.disabled = false;
                btn.innerText = "SAUVEGARDER & SYNCHRONISER";
            }
        }

        // --- RESTE DU CODE (FONCTIONS MÉTIER) INCHANGÉ ---
        function checkLicense() {
            const now = Date.now();
            const badge = document.getElementById('days-badge');
            const trialEnd = db.installDate + (7 * 86400000);
            const currentExpiry = db.expiryDate || trialEnd;
            const isOk = currentExpiry > now;
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if(!isOk) {
                badge.innerText = "LICENCE EXPIRÉE"; 
                badge.className = "badge-status bg-red-100 text-red-600";
                if(document.querySelector('.page.active').id !== 'page-pro') nav('pro');
            } else {
                const days = Math.ceil((currentExpiry - now)/86400000);
                badge.innerText = days + (db.expiryDate ? " JOURS VALIDES" : " JOURS D'ESSAI");
                badge.className = "badge-status bg-green-100 text-green-600";
            }
            return isOk;
        }

        function genPDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            if (db.biz.logo) doc.addImage(db.biz.logo, 'PNG', 15, 10, 25, 25);
            doc.setFont(undefined, 'bold').setFontSize(20).setTextColor(37, 99, 235).text(db.biz.name.toUpperCase(), 45, 20);
            doc.setFont(undefined, 'normal').setFontSize(9).setTextColor(100).text(`${db.biz.addr} | Tel: ${db.biz.phone}`, 45, 27);
            doc.autoTable({ startY: 70, head: [['ARTICLE', 'QTÉ', 'TOTAL']], body: sale.items.map(i => [i.n, i.sq, i.st.toLocaleString()]), headStyles:{fillColor:[37, 99, 235]} });
            doc.save(`Facture_${sale.cli}.pdf`);
        }

        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            const sale = {id:Date.now(), ven:document.getElementById('vendeur').value || "Gérant", cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()};
            db.sales.push(sale); save(); genPDF(sale);
            cart=[]; render(); nav('home');
        }

        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a; db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now(), isExp:true});
            save(); render(); nav('home');
        }

        function updateChange() {
            const received = +document.getElementById('cash-in').value || 0;
            const total = cart.reduce((a,b) => a + b.st, 0);
            const change = received - total;
            document.getElementById('change-due').innerText = (change > 0 ? change.toLocaleString() : 0) + " " + db.biz.cur;
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 12);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card flex justify-between items-center p-4 border-l-4 ${i.isExp?'border-red-500':'border-blue-500'}">
                    <div><b class="text-slate-800">${i.cli || i.n}</b><br><small class="text-[9px] text-slate-400 font-bold">${i.d}</small></div>
                    <b class="${i.isExp?'text-red-500':'text-blue-600'}">${(i.tot || -i.a || -i.montant).toLocaleString()}</b>
                </div>`).join('');
            
            document.getElementById('stkList').innerHTML = db.stk.map((i, idx) => `
                <div class="card flex justify-between items-center p-4">
                    <div class="flex-1"><b class="text-sm">${i.n}</b><br><span class="text-blue-600 font-bold text-[10px]">${i.s} ${db.biz.cur}</span></div>
                    <div class="flex items-center gap-3 bg-slate-100 p-2 rounded-2xl">
                        <button onclick="updateQty(${idx},-1)" class="w-8 h-8 rounded-xl bg-white text-red-500">-</button>
                        <span class="font-black text-sm w-6 text-center ${i.q<=5?'low-stock-alert':''}">${i.q}</span>
                        <button onclick="updateQty(${idx},1)" class="w-8 h-8 rounded-xl bg-white text-green-600">+</button>
                    </div>
                </div>`).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.t) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            checkLicense(); lucide.createIcons();
        }

        function updateQty(idx, val) {
            let n = db.stk[idx].q + val;
            if(n >= 0) { db.stk[idx].q = n; save(); render(); }
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || q < 0) return;
            db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant");
            cart.push({...it, sq:q, st:it.s*q}); renderCart();
        }

        function renderCart() {
            let t = 0;
            const moneyCalc = document.getElementById('money-calc');
            if(cart.length > 0) moneyCalc.classList.remove('hidden'); else moneyCalc.classList.add('hidden');
            document.getElementById('cart').innerHTML = cart.map((i, idx) => { 
                t+=i.st; 
                return `<div class="flex justify-between p-4 bg-slate-50 rounded-2xl mb-2"><b class="text-sm">${i.n} (x${i.sq})</b><b class="text-blue-600">${i.st.toLocaleString()}</b></div>`
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            updateChange();
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons(); checkLicense();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié !"); }
        function logout() { if(confirm("Déconnexion ?")) { auth.signOut(); localStorage.clear(); location.reload(); } }
        function resetProfitAudit() { if(confirm("Remise à zéro ?")) { db.resets.push({id:Date.now(), n:"CLÔTURE", montant:db.prof, d:new Date().toLocaleString()}); db.prof=0; save(); render(); } }
        function exportAudit() { const b = new Blob([JSON.stringify(db)], {type:"application/json"}); const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`Backup.json`; a.click(); }
    </script>
</body>
</html>
