<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { --primary: #2563eb; --accent: #f97316; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        
        .page { display: none; transition: all 0.4s ease; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-premium { background: white; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 24px; transition: transform 0.2s; }
        
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .btn-secondary { background: #f1f5f9; color: #475569; border-radius: 18px; padding: 14px; font-weight: 600; width: 100%; border: 1px solid #e2e8f0; }
        
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; font-size: 15px; transition: all 0.3s; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; transition: 0.3s; }
        .nav-pro button.active { color: white; transform: translateY(-5px); }
        .nav-pro button.active i { color: var(--primary); }

        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="mb-8">
            <h2 id="setup-title" class="text-4xl font-extrabold tracking-tight text-slate-900">Profil Business</h2>
            <p class="text-slate-500 mt-2">Configurez votre identité visuelle.</p>
        </div>
        
        <div class="space-y-4">
            <div class="bg-slate-50 p-6 rounded-3xl border-2 border-dashed border-slate-200 text-center">
                <label class="text-xs font-bold text-slate-400 uppercase mb-2 block">Modifier le Logo</label>
                <input type="file" id="setup-logo" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700">
            </div>
            <input type="text" id="setup-user" placeholder="Nom du Gérant" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">USD ($)</option>
                <option value="€">EUR (€)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main text-lg mt-6">ENREGISTRER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="glass-header p-4 sticky top-0 z-[1100] flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div id="logo-placeholder" class="w-10 h-10 rounded-lg bg-slate-100 flex items-center justify-center overflow-hidden">
                <i data-lucide="briefcase" class="w-5 text-slate-400"></i>
            </div>
            <div>
                <h1 id="header-biz" class="font-extrabold text-sm text-slate-900 tracking-tight uppercase">ComptaPro</h1>
                <p id="licence-status" class="text-[8px] font-bold text-slate-400 uppercase tracking-widest">Chargement...</p>
            </div>
        </div>
        <div id="days-badge" class="px-3 py-1 rounded-full text-[9px] font-black tracking-wider"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net</p>
                    <h2 class="text-4xl font-extrabold mt-2 tracking-tighter"><span id="valP">0</span> <small class="text-lg cur font-normal opacity-80"></small></h2>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i data-lucide="shopping-cart"></i></div>
                    <span class="text-xs font-bold text-slate-600 uppercase">Vente</span>
                </button>
                <button onclick="nav('stock')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center"><i data-lucide="package"></i></div>
                    <span class="text-xs font-bold text-slate-600 uppercase">Stock</span>
                </button>
            </div>
            
            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Activités</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium mb-6">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center m-0">
                    </div>
                    <button onclick="addCart()" class="btn-secondary mb-6">+ Ajouter l'article</button>

                    <div id="cart" class="space-y-2 mb-6 border-t pt-4"></div>
                    
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total</p>
                            <h3 class="text-xl font-black"><span id="cartT">0</span> <small class="cur"></small></h3>
                        </div>
                        <button onclick="doSale()" class="btn-main !w-auto px-8">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="openStockForm()" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>

                <div id="stk-form" class="hidden card-premium border-2 border-blue-100 mb-6">
                    <h3 id="stk-form-title" class="font-bold mb-4">Nouvel Article</h3>
                    <input type="hidden" id="edit-id">
                    <input type="text" id="p_name" placeholder="Désignation" class="input-pro">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité en stock" class="input-pro">
                    <div class="flex gap-2">
                        <button onclick="saveStock()" class="btn-main">ENREGISTRER</button>
                        <button onclick="toggleF('stk-form')" class="btn-secondary !w-auto">X</button>
                    </div>
                </div>

                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Paramètres</h2>
            <button onclick="openSetup(true)" class="card-premium w-full flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="settings"></i></div>
                    <span class="font-bold text-slate-700">Infos Entreprise & Logo</span>
                </div>
                <i data-lucide="chevron-right"></i>
            </button>
            <button onclick="exportAudit()" class="btn-secondary mb-4">Sauvegarder les données</button>
            <button onclick="logout()" class="w-full text-red-400 text-xs font-bold underline">Déconnexion</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Dashboard</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user-cog"></i>Compte</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_ELITE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: Date.now() + (2*86400000) 
        };
        let cart = [];

        window.onload = () => { render(); if (!db.biz.name) openSetup(false); };

        function save() { localStorage.setItem('CP_V14_ELITE', JSON.stringify(db)); }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
        }

        // --- GESTION LOGO ---
        function openSetup(isEdit) {
            document.getElementById('setup-screen').style.display = 'block';
            if(isEdit) {
                const b = db.biz;
                document.getElementById('setup-user').value = b.user || "";
                document.getElementById('setup-biz').value = b.name || "";
                document.getElementById('setup-addr').value = b.addr || "";
                document.getElementById('setup-phone').value = b.phone || "";
                document.getElementById('setup-cur').value = b.cur || "FCFA";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }
        function closeSetup() { document.getElementById('setup-screen').style.display = 'none'; }
        
        async function saveSetup() {
            const logoFile = document.getElementById('setup-logo').files[0];
            const finalize = (logoData) => {
                db.biz = {
                    user: document.getElementById('setup-user').value,
                    name: document.getElementById('setup-biz').value,
                    addr: document.getElementById('setup-addr').value,
                    phone: document.getElementById('setup-phone').value,
                    cur: document.getElementById('setup-cur').value,
                    logo: logoData || db.biz.logo || ""
                };
                save(); location.reload();
            };
            if(logoFile) {
                const reader = new FileReader();
                reader.onloadend = () => finalize(reader.result);
                reader.readAsDataURL(logoFile);
            } else finalize();
        }

        // --- GESTION STOCK (MODIFICATION) ---
        function openStockForm(id = null) {
            const form = document.getElementById('stk-form');
            form.classList.remove('hidden');
            if(id) {
                const item = db.stk.find(x => x.id == id);
                document.getElementById('stk-form-title').innerText = "Modifier Article";
                document.getElementById('edit-id').value = item.id;
                document.getElementById('p_name').value = item.n;
                document.getElementById('p_cost').value = item.c;
                document.getElementById('p_sell').value = item.s;
                document.getElementById('p_qty').value = item.q;
            } else {
                document.getElementById('stk-form-title').innerText = "Nouvel Article";
                document.getElementById('edit-id').value = "";
                document.querySelectorAll('#stk-form input').forEach(i => i.value = "");
            }
        }

        function saveStock() {
            let id = document.getElementById('edit-id').value;
            let n = document.getElementById('p_name').value;
            let c = +document.getElementById('p_cost').value;
            let s = +document.getElementById('p_sell').value;
            let q = +document.getElementById('p_qty').value;

            if(!n || !s) return;

            if(id) {
                let index = db.stk.findIndex(x => x.id == id);
                db.stk[index] = { ...db.stk[index], n, c, s, q };
            } else {
                db.stk.push({ id: Date.now(), n, c, s, q });
            }
            save(); render(); document.getElementById('stk-form').classList.add('hidden');
        }

        // --- CAISSE (MODIFIER/SUPPRIMER) ---
        function addCart() {
            let id = document.getElementById('sel_p').value;
            let q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant");
            
            let existing = cart.find(x => x.id == id);
            if(existing) {
                if(existing.sq + q > it.q) return alert("Limite de stock atteinte");
                existing.sq += q;
                existing.st = existing.sq * existing.s;
            } else {
                cart.push({...it, sq:q, st:it.s*q});
            }
            renderCart();
        }

        function updateCartQty(index, delta) {
            let item = cart[index];
            let stockItem = db.stk.find(x => x.id == item.id);
            if(item.sq + delta <= 0) return removeCart(index);
            if(item.sq + delta > stockItem.q) return alert("Stock max atteint");
            
            item.sq += delta;
            item.st = item.sq * item.s;
            renderCart();
        }

        function removeCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map((i, idx) => { 
                t += i.st; 
                return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border">
                    <div class="flex-1">
                        <b class="text-xs block">${i.n}</b>
                        <span class="text-[10px] text-slate-500">${i.s.toLocaleString()} x ${i.sq}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateCartQty(${idx}, -1)" class="w-6 h-6 bg-white border rounded flex items-center justify-center">-</button>
                        <span class="text-xs font-bold w-4 text-center">${i.sq}</span>
                        <button onclick="updateCartQty(${idx}, 1)" class="w-6 h-6 bg-white border rounded flex items-center justify-center">+</button>
                        <button onclick="removeCart(${idx})" class="ml-2 text-red-400"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                s.q -= c.sq; tV += c.st; tP += (c.s - c.c) * c.sq; 
            });
            db.prof += tP;
            db.sales.push({id:Date.now(), cli:"Client", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()});
            cart=[]; save(); render(); nav('home');
        }

        function render() {
            // Header & Logo
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            if(db.biz.logo) {
                document.getElementById('logo-placeholder').innerHTML = `<img src="${db.biz.logo}" class="w-full h-full object-cover">`;
            }
            
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur || "FCFA");
            
            // Liste Stock
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center py-4">
                    <div>
                        <b class="text-slate-800">${i.n}</b>
                        <p class="text-[10px] font-bold ${i.q < 5 ? 'text-red-500' : 'text-slate-400'}">STOCK: ${i.q}</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="text-right font-black">${i.s.toLocaleString()}</div>
                        <button onclick="openStockForm(${i.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="edit-3" class="w-4"></i></button>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            // Historique
            const hist = [...db.sales].sort((a,b) => b.id - a.id).slice(0, 5);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center !py-3 !px-5">
                    <span class="text-xs font-bold">${i.d.split(' ')[0]} - Vente</span>
                    <b class="text-blue-600">+${i.tot.toLocaleString()}</b>
                </div>
            `).join('');

            checkLicense();
            lucide.createIcons();
        }

        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const status = document.getElementById('licence-status');
            const days = Math.ceil((db.expiryDate - Date.now()) / 86400000);
            if(days <= 0) {
                badge.innerText = "EXPIRÉ"; badge.className = "px-3 py-1 rounded-full text-[9px] font-black bg-red-100 text-red-600";
                status.innerText = "Mode Consultation";
            } else {
                badge.innerText = days + " JOURS"; badge.className = "px-3 py-1 rounded-full text-[9px] font-black bg-green-100 text-green-600";
                status.innerText = "Licence Pro Active";
            }
        }

        function exportAudit() {
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Compta_Backup.json`; a.click();
        }

        function logout() { if(confirm("Effacer les données locales ?")) { localStorage.clear(); location.reload(); } }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
    </script>
</body>
</html>
