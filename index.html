<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro | Business Suite</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; -webkit-tap-highlight-color: transparent; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; padding: 20px; border-radius: 24px; border: 1px solid rgba(226, 232, 240, 0.7); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02), 0 2px 4px -1px rgba(0,0,0,0.02); margin-bottom: 16px; }
        .input-f { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; transition: all 0.2s; background: #FDFDFD; font-size: 15px; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.05); background: white; }
        
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 16px; border-radius: 18px; font-weight: 700; width: 100%; border: none; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2); transition: all 0.2s; cursor: pointer; }
        .btn-blue:active { transform: scale(0.97); opacity: 0.9; }
        
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 10px 25px rgba(0,0,0,0.08); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.2s; width: 25%; }
        nav button.active { color: #2563EB; }
        nav button i { transition: 0.2s; }
        nav button.active i { transform: translateY(-2px); }

        #toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 3000; pointer-events: none; }
        .toast { background: #1E293B; color: white; padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 600; margin-bottom: 8px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); animation: toastIn 0.3s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .logo-preview-container { width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 22px; border: 2px dashed #CBD5E1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #F1F5F9; cursor: pointer; }
        #logo-preview { width: 100%; height: 100%; object-fit: cover; }
        .locked { filter: blur(8px); pointer-events: none; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="overlay-screen" class="fixed inset-0 bg-[#F8FAFC] z-[2000] hidden overflow-y-auto p-8">
        <div class="max-w-md mx-auto">
            <h2 id="setup-title" class="text-2xl font-extrabold text-slate-900 mb-2">Configuration</h2>
            <p class="text-slate-500 mb-8 text-sm font-medium">Paramètres de votre boutique.</p>
            
            <div class="space-y-2">
                <div class="logo-preview-container" onclick="document.getElementById('setup-logo').click()">
                    <img id="logo-preview" src="" class="hidden">
                    <div id="logo-icon" class="text-slate-400 text-center">
                        <i data-lucide="camera" class="mx-auto mb-1"></i>
                        <span class="text-[9px] font-bold uppercase">Logo</span>
                    </div>
                </div>
                <input type="file" id="setup-logo" accept="image/*" class="hidden" onchange="previewImage(this)">

                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Nom de la Boutique</label>
                <input type="text" id="setup-biz" placeholder="Ma Boutique" class="input-f">
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Contact</label>
                        <input type="text" id="setup-phone" placeholder="Tél" class="input-f">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Devise</label>
                        <select id="setup-cur" class="input-f">
                            <option value="FCFA">FCFA</option>
                            <option value="GNF">GNF</option>
                            <option value="$">USD ($)</option>
                            <option value="€">EUR (€)</option>
                        </select>
                    </div>
                </div>

                <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Adresse</label>
                <input type="text" id="setup-addr" placeholder="Localisation" class="input-f">

                <div class="pt-4">
                    <button onclick="saveSetup()" class="btn-blue">VALIDER</button>
                    <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm mt-4 hidden">ANNULER</button>
                </div>
            </div>
        </div>
    </div>

    <header class="p-6 bg-white/70 backdrop-blur-md border-b border-slate-100 flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-lg text-slate-900 tracking-tight uppercase">ComptaPro</h1>
            <div id="days-badge" class="text-[9px] font-bold px-2 py-0.5 rounded-full inline-block mt-1"></div>
        </div>
        <button onclick="nav('pro')" class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 border border-slate-100">
            <i data-lucide="user" class="w-5"></i>
        </button>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[32px] text-white shadow-xl mb-6 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-600/20 rounded-full blur-3xl"></div>
                <p class="text-[10px] opacity-60 uppercase font-bold tracking-widest mb-1">Bénéfice Net Actuel</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                        <span class="text-[8px] font-bold opacity-40 block mb-1">CE JOUR</span>
                        <span id="repJ" class="font-bold text-sm">0</span>
                    </div>
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                        <span class="text-[8px] font-bold opacity-40 block mb-1">SEMAINE</span>
                        <span id="repS" class="font-bold text-sm">0</span>
                    </div>
                    <div class="bg-white/5 p-3 rounded-2xl border border-white/5">
                        <span class="text-[8px] font-bold opacity-40 block mb-1">MOIS</span>
                        <span id="repM" class="font-bold text-sm">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-2 p-5 text-blue-600 border-b-4 border-b-blue-600">
                    <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                    <span class="text-xs font-bold text-slate-600">Vendre</span>
                </button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-2 p-5 text-red-500 border-b-4 border-b-red-500">
                    <i data-lucide="arrow-down-right" class="w-6 h-6"></i>
                    <span class="text-xs font-bold text-slate-600">Dépense</span>
                </button>
            </div>

            <h3 class="text-[11px] font-bold text-slate-400 mb-4 uppercase tracking-widest px-1">Historique Récent</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-xl font-extrabold mb-5 flex items-center gap-2"><i data-lucide="shopping-cart" class="text-blue-600"></i> Nouvelle Vente</h2>
                <div class="card">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold"></select>
                        <input type="number" id="sel_q" value="1" min="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-blue-600 text-white px-4 rounded-xl active:scale-90 transition-all"><i data-lucide="plus"></i></button>
                    </div>

                    <div id="cart" class="space-y-2 mb-6"></div>
                    
                    <div id="money-calc" class="p-4 bg-slate-50 rounded-2xl border border-slate-100 hidden mb-6">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Reçu</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-24 p-2 rounded-lg border border-slate-200 text-right font-bold" placeholder="0">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Rendu</span>
                            <span id="change-due" class="font-extrabold text-green-600 text-sm">0</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-end border-t pt-4">
                        <div>
                            <p class="text-[9px] font-bold text-slate-400 uppercase">Total à payer</p>
                            <span class="font-extrabold text-2xl text-slate-900"><span id="cartT">0</span> <small class="cur text-slate-400"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold text-sm shadow-lg active:scale-95 transition-all uppercase">Valider</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-extrabold">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-slate-900 text-white px-4 py-2 rounded-xl font-bold text-[11px] flex items-center gap-2"><i data-lucide="plus" class="w-3"></i> NOUVEAU</button>
                </div>

                <div id="stk-form" class="hidden card bg-blue-50/50 border-blue-100 mb-6">
                    <input type="text" id="p_name" placeholder="Désignation" class="input-f">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Stock Initial" class="input-f">
                    <button onclick="addStock()" class="btn-blue">AJOUTER</button>
                </div>

                <div class="relative mb-4">
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="searchStock" oninput="render()" placeholder="Rechercher un produit..." class="input-f pl-12 mb-0">
                </div>

                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-xl font-extrabold mb-6">Administration</h2>
            
            <div class="card space-y-4">
                <button onclick="openSetup(true)" class="w-full flex items-center justify-between p-2 font-bold text-slate-700">
                    <div class="flex items-center gap-3"><i data-lucide="store" class="text-blue-600"></i> Profil Boutique</div>
                    <i data-lucide="chevron-right" class="w-4 opacity-30"></i>
                </button>
                <div class="h-px bg-slate-100"></div>
                <button onclick="exportAudit()" class="w-full flex items-center justify-between p-2 font-bold text-slate-700">
                    <div class="flex items-center gap-3"><i data-lucide="download" class="text-green-600"></i> Sauvegarder</div>
                </button>
                <button onclick="document.getElementById('restore-file').click()" class="w-full flex items-center justify-between p-2 font-bold text-slate-700">
                    <div class="flex items-center gap-3"><i data-lucide="upload" class="text-orange-600"></i> Restaurer</div>
                </button>
                <input type="file" id="restore-file" class="hidden" accept=".json" onchange="restoreData(this)">
            </div>

            <div class="card border-2 border-red-50 bg-red-50/10">
                <h3 class="text-[10px] font-bold text-red-400 uppercase mb-4 tracking-widest">Zone de Danger</h3>
                <button onclick="resetProfitAudit()" class="w-full text-left p-2 font-bold text-red-600 flex items-center gap-3"><i data-lucide="refresh-ccw" class="w-4"></i> Clôturer & Remise à zéro</button>
                <button onclick="logout()" class="w-full text-left p-2 font-bold text-slate-400 mt-2 flex items-center gap-3"><i data-lucide="trash" class="w-4"></i> Tout effacer</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="settings"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_PRO')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            expiryDate: null, 
            installDate: Date.now() 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V14_PRO', JSON.stringify(db)); }
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = 'toast'; t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function nav(p) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
            document.getElementById('n-'+p)?.classList.add('active');
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById('logo-preview');
                    img.src = e.target.result; img.classList.remove('hidden');
                    document.getElementById('logo-icon').classList.add('hidden');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').classList.remove('hidden');
            if(isEdit) {
                document.getElementById('setup-biz').value = db.biz.name || "";
                document.getElementById('setup-addr').value = db.biz.addr || "";
                document.getElementById('setup-phone').value = db.biz.phone || "";
                document.getElementById('setup-cur').value = db.biz.cur || "FCFA";
                if(db.biz.logo) {
                    document.getElementById('logo-preview').src = db.biz.logo;
                    document.getElementById('logo-preview').classList.remove('hidden');
                    document.getElementById('logo-icon').classList.add('hidden');
                }
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function saveSetup() {
            const name = document.getElementById('setup-biz').value;
            if(!name) return showToast("Nom boutique requis !");
            db.biz = {
                name, addr: document.getElementById('setup-addr').value,
                phone: document.getElementById('setup-phone').value,
                cur: document.getElementById('setup-cur').value,
                logo: document.getElementById('logo-preview').src || ""
            };
            save(); location.reload();
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            
            // Stock avec recherche
            const search = document.getElementById('searchStock').value.toLowerCase();
            const filteredStk = db.stk.filter(p => p.n.toLowerCase().includes(search));
            
            document.getElementById('stkList').innerHTML = filteredStk.map((i, idx) => `
                <div class="card flex justify-between items-center p-4">
                    <div class="flex-1">
                        <b class="text-sm block">${i.n}</b>
                        <span class="text-blue-600 font-bold text-[10px]">${i.s} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border">
                        <button onclick="updateQty(${idx}, -1)" class="w-7 h-7 bg-white rounded-lg shadow-sm font-bold">-</button>
                        <span class="text-xs font-bold w-5 text-center ${i.q <= 5 ? 'text-red-500 animate-pulse' : ''}">${i.q}</span>
                        <button onclick="updateQty(${idx}, 1)" class="w-7 h-7 bg-white rounded-lg shadow-sm font-bold">+</button>
                    </div>
                </div>`).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');

            // Historique
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card flex justify-between items-center p-3.5 border-l-4 ${i.isExp?'border-red-400':'border-blue-400'}">
                    <div>
                        <b class="text-xs">${i.cli || i.n}</b>
                        <br><span class="text-[8px] text-slate-400 font-bold uppercase">${new Date(i.id).toLocaleDateString()}</span>
                    </div>
                    <b class="text-xs ${i.isExp?'text-red-500':'text-blue-600'}">${(i.tot || -i.a || -i.montant).toLocaleString()}</b>
                </div>`).join('');
            
            lucide.createIcons();
            checkLicense();
        }

        function updateQty(idx, val) {
            if(db.stk[idx].q + val >= 0) { db.stk[idx].q += val; save(); render(); }
        }

        function addStock() {
            let n = document.getElementById('p_name').value, c = +document.getElementById('p_cost').value, s = +document.getElementById('p_sell').value, q = +document.getElementById('p_qty').value;
            if(!n || q < 0) return showToast("Données invalides !");
            db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
            showToast("Produit ajouté !");
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return showToast("Stock insuffisant !");
            cart.push({...it, sq:q, st:it.s*q, cid: Date.now()});
            renderCart();
        }

        function renderCart() {
            const total = cart.reduce((a,b) => a + b.st, 0);
            document.getElementById('cartT').innerText = total.toLocaleString();
            document.getElementById('cart').innerHTML = cart.map((i, idx) => `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <span class="text-xs font-bold">${i.n} (x${i.sq})</span>
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold">${i.st.toLocaleString()}</span>
                        <button onclick="removeFromCart(${idx})" class="text-red-400"><i data-lucide="x-circle" class="w-4"></i></button>
                    </div>
                </div>`).join('');
            document.getElementById('money-calc').classList.toggle('hidden', cart.length === 0);
            lucide.createIcons();
        }

        function removeFromCart(idx) { cart.splice(idx, 1); renderCart(); }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; 
            });
            db.prof += tP;
            db.sales.push({id:Date.now(), cli:"Vente Directe", tot:tV, items:[...cart], t:Date.now()});
            cart=[]; save(); render(); nav('home'); renderCart();
            showToast("Vente enregistrée !");
        }

        function updateChange() {
            const rec = +document.getElementById('cash-in').value || 0;
            const tot = cart.reduce((a,b) => a + b.st, 0);
            document.getElementById('change-due').innerText = Math.max(0, rec-tot).toLocaleString() + " " + db.biz.cur;
        }

        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const trialEnd = db.installDate + (7 * 86400000);
            const isOk = trialEnd > Date.now();
            badge.innerText = isOk ? "VERSION D'ESSAI" : "EXPIRE";
            badge.className = `text-[9px] font-bold px-2 py-0.5 rounded-full inline-block mt-1 ${isOk ? 'bg-blue-100 text-blue-600':'bg-red-100 text-red-600'}`;
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
        }

        function exportAudit() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:"application/json"}));
            a.download = `Backup_${db.biz.name || 'Compta'}.json`; a.click();
            showToast("Fichier généré !");
        }

        function restoreData(input) {
            const r = new FileReader();
            r.onload = e => { db = JSON.parse(e.target.result); save(); location.reload(); };
            r.readAsText(input.files[0]);
        }

        function resetProfitAudit() {
            if(confirm("Confirmer la clôture de caisse ?")) {
                db.resets.push({id:Date.now(), n:"CLÔTURE", montant:db.prof});
                db.prof = 0; save(); render(); showToast("Caisse remise à zéro");
            }
        }

        function logout() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
