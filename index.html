<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Cloud</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; background: #FDFDFD; }
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 18px; border-radius: 20px; font-weight: 700; width: 100%; border: none; }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        nav button.active { color: #2563EB; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 40px 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 12px; text-transform: uppercase; }
        .sync-indicator { font-size: 9px; font-weight: bold; position: fixed; top: 80px; right: 20px; padding: 4px 8px; border-radius: 8px; z-index: 1000; display: none; }
    </style>
</head>
<body>

    <div id="sync-status" class="sync-indicator bg-slate-800 text-white">Cloud Sync...</div>

    <div id="overlay-screen">
        <h2 id="setup-title" class="text-4xl font-extrabold text-slate-900 mb-2">Bienvenue !</h2>
        <p class="text-slate-500 mb-8 font-medium">Configurez votre identité et la sauvegarde cloud.</p>
        <div class="space-y-4">
            <input type="text" id="setup-user" placeholder="Votre Nom" class="input-f">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-f">
            <input type="email" id="setup-email" placeholder="Email Cloud" class="input-f">
            <input type="password" id="setup-pass" placeholder="Mot de passe Cloud" class="input-f">
            <select id="setup-cur" class="input-f">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">$</option>
                <option value="€">€</option>
            </select>
            <button onclick="saveSetup()" class="btn-blue text-lg">ENREGISTRER & SYNC</button>
            <button onclick="loadFromCloud()" class="w-full text-blue-600 font-bold text-sm mt-2">RESTAURER DEPUIS LE CLOUD</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm mt-2 hidden">ANNULER</button>
        </div>
    </div>

    <header class="p-6 bg-white border-b border-slate-100 flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-extrabold text-blue-500 tracking-widest"></p>
        </div>
        <div id="days-badge" class="badge-status"></div>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <p class="text-xs opacity-60 uppercase font-extrabold mb-1">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                <div class="grid grid-cols-3 gap-3 text-center">
                    <div class="bg-white/10 p-3 rounded-2xl"><span class="text-[9px] block">JOUR</span><span id="repJ" class="font-bold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl"><span class="text-[9px] block">SEM.</span><span id="repS" class="font-bold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl"><span class="text-[9px] block">MOIS</span><span id="repM" class="font-bold">0</span></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-2 p-6 text-blue-600"><i data-lucide="shopping-cart"></i><span class="text-xs font-bold text-slate-700">Vendre</span></button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-2 p-6 text-red-500"><i data-lucide="arrow-down-circle"></i><span class="text-xs font-bold text-slate-700">Dépense</span></button>
            </div>
            <h3 class="text-xs font-bold text-slate-400 mb-4 uppercase">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Nouvelle Vente</h2>
                <div class="card border-t-8 border-blue-600">
                    <input type="text" id="vendeur" placeholder="Vendeur" class="input-f bg-slate-50 border-transparent">
                    <input type="text" id="cl_name" placeholder="Client" class="input-f">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold text-slate-700"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-slate-900 text-white px-5 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="space-y-2 border-t border-dashed border-slate-200 pt-5"></div>
                    <div class="mt-8 flex justify-between items-end">
                        <div><span class="font-extrabold text-3xl"><span id="cartT">0</span> <small class="cur text-slate-400 text-lg"></small></span></div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-bold uppercase text-sm">Valider</button>
                    </div>
                </div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Enregistrer une Charge</h2>
                <div class="card border-t-8 border-red-500">
                    <input type="text" id="exp_name" placeholder="Motif" class="input-f">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-f">
                    <button onclick="addExpense()" class="w-full bg-red-500 text-white p-5 rounded-2xl font-extrabold">ENREGISTRER</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-5 py-2 rounded-2xl text-sm font-bold">+ Produit</button>
                </div>
                <div id="stk-form" class="hidden card bg-blue-50/50">
                    <input type="text" id="p_name" placeholder="Article" class="input-f">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-f">
                    <button onclick="addStock()" class="btn-blue">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6">Administration</h2>
            <div class="card bg-slate-900 text-white flex justify-between items-center">
                <div><p class="text-[10px] opacity-50 uppercase">ID Licence</p><h3 id="displayID" class="text-xl font-mono text-blue-400"></h3></div>
                <button onclick="copyID()" class="bg-white/10 p-3 rounded-2xl"><i data-lucide="copy" class="w-5 h-5"></i></button>
            </div>
            
            <button onclick="syncToCloud(true)" class="card w-full flex items-center justify-between p-5 font-bold text-blue-600 border-blue-100 bg-blue-50/20">
                <div class="flex items-center gap-4"><i data-lucide="cloud-upload"></i> Forcer la Synchro Cloud</div>
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            </button>

            <button onclick="openSetup(true)" class="card w-full flex items-center justify-between p-5 font-bold text-slate-700">
                <div class="flex items-center gap-4"><i data-lucide="settings-2" class="text-blue-600"></i> Modifier Profil & Cloud</div>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>

            <button onclick="logout()" class="w-full py-8 text-slate-300 font-bold text-xs uppercase flex items-center justify-center gap-2">
                <i data-lucide="log-out" class="w-4"></i> Effacer toutes les données
            </button>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user"></i>Admin</button>
    </nav>

    <script>
        // --- CONFIGURATION FIREBASE ---
        // REMPLACEZ CES VALEURS PAR LES VÔTRES DEPUIS LA CONSOLE FIREBASE
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_PROJET.firebaseapp.com",
            databaseURL: "https://VOTRE_PROJET.firebaseio.com",
            projectId: "VOTRE_PROJET",
            storageBucket: "VOTRE_PROJET.appspot.com",
            messagingSenderId: "ID",
            appId: "APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const rdb = firebase.database();

        // --- VARIABLES GLOBALES ---
        let db = JSON.parse(localStorage.getItem('CP_V13_CLOUD')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            expiryDate: null, installDate: Date.now() 
        };
        let cart = [];

        function save() { 
            localStorage.setItem('CP_V13_CLOUD', JSON.stringify(db)); 
            syncToCloud(); // Synchro auto à chaque sauvegarde locale
        }

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        // --- SYNCHRONISATION CLOUD ---
        async function syncToCloud(manual = false) {
            if (!db.biz.email || !db.biz.pass) return;
            const statusEl = document.getElementById('sync-status');
            statusEl.style.display = 'block';
            statusEl.innerText = "Synchronisation...";

            try {
                // On s'assure d'être connecté
                let user;
                try {
                    const res = await auth.signInWithEmailAndPassword(db.biz.email, db.biz.pass);
                    user = res.user;
                } catch(e) {
                    const res = await auth.createUserWithEmailAndPassword(db.biz.email, db.biz.pass);
                    user = res.user;
                }
                
                await rdb.ref('users/' + user.uid).set(db);
                statusEl.innerText = "Cloud à jour ✅";
                if(manual) alert("Données sauvegardées avec succès !");
            } catch (error) {
                statusEl.innerText = "Erreur Synchro ❌";
                console.error(error);
            }
            setTimeout(() => statusEl.style.display = 'none', 3000);
        }

        async function loadFromCloud() {
            const email = document.getElementById('setup-email').value;
            const pass = document.getElementById('setup-pass').value;
            if(!email || !pass) return alert("Veuillez saisir Email et Password Cloud");

            try {
                const res = await auth.signInWithEmailAndPassword(email, pass);
                const snapshot = await rdb.ref('users/' + res.user.uid).once('value');
                if (snapshot.exists()) {
                    db = snapshot.val();
                    save();
                    alert("Données restaurées !");
                    location.reload();
                } else {
                    alert("Aucune sauvegarde trouvée pour ce compte.");
                }
            } catch (error) {
                alert("Erreur de connexion : " + error.message);
            }
        }

        // --- FONCTIONS EXISTANTES (Intactes) ---
        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-title').innerText = "Modifier Profil";
                document.getElementById('setup-user').value = db.biz.user || "";
                document.getElementById('setup-biz').value = db.biz.name || "";
                document.getElementById('setup-email').value = db.biz.email || "";
                document.getElementById('setup-pass').value = db.biz.pass || "";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

        function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return alert("Nom requis");
            db.biz = {
                user: document.getElementById('setup-user').value,
                name: bizName,
                cur: document.getElementById('setup-cur').value,
                email: document.getElementById('setup-email').value,
                pass: document.getElementById('setup-pass').value,
                addr: db.biz.addr || "", phone: db.biz.phone || ""
            };
            save(); 
            location.reload();
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            // Historique
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card flex justify-between items-center p-4 border-l-4 ${i.isExp?'border-red-500':'border-blue-500'}">
                    <div><b>${i.cli || i.n}</b><br><small class="text-[9px] text-slate-400 font-bold">${i.d}</small></div>
                    <b class="${i.isExp?'text-red-500':'text-blue-600'}">${(i.tot || -i.a).toLocaleString()}</b>
                </div>
            `).join('');

            // Stock
            document.getElementById('stkList').innerHTML = db.stk.map((i, index) => `
                <div class="card flex justify-between items-center p-4">
                    <div class="flex-1"><b class="text-sm">${i.n}</b><br><span class="text-blue-600 font-bold text-xs">${i.s} ${db.biz.cur}</span></div>
                    <div class="flex items-center gap-3 bg-slate-100 p-2 rounded-2xl">
                        <button onclick="updateQty(${index}, -1)" class="w-8 h-8 rounded-xl bg-white text-red-500 font-bold">-</button>
                        <span class="font-bold text-sm w-6 text-center">${i.q}</span>
                        <button onclick="updateQty(${index}, 1)" class="w-8 h-8 rounded-xl bg-white text-green-600 font-bold">+</button>
                    </div>
                </div>`).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            checkLicense(); lucide.createIcons();
        }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            db.sales.push({id:Date.now(), ven:document.getElementById('vendeur').value || "Gérant", cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()});
            cart=[]; save(); render(); nav('home');
        }

        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a; db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now(), isExp:true});
            save(); render(); nav('home');
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n) return;
            db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        function updateQty(idx, v) { if(db.stk[idx].q + v >= 0) { db.stk[idx].q += v; save(); render(); } }
        
        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(it && q <= it.q) { cart.push({...it, sq:q, st:it.s*q}); renderCart(); }
        }

        function renderCart() {
            let t = cart.reduce((a,b)=>a+b.st, 0);
            document.getElementById('cart').innerHTML = cart.map(i => `<div class="flex justify-between text-sm"><span>${i.n} x${i.sq}</span><b>${i.st}</b></div>`).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }

        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const left = Math.ceil(((db.installDate + 7 * 86400000) - Date.now())/86400000);
            badge.innerText = left > 0 ? left + " Jours d'essai" : "Expire";
            badge.className = "badge-status " + (left > 0 ? "bg-green-100 text-green-600" : "bg-red-100 text-red-600");
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié !"); }
        function logout() { if(confirm("Effacer ?")) { localStorage.clear(); location.reload(); } }

    </script>
</body>
</html>
