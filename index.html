<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { --primary: #2563eb; --accent: #f97316; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        
        .page { display: none; transition: all 0.4s ease; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-premium { background: white; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 24px; transition: transform 0.2s; }
        
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .btn-secondary { background: #f1f5f9; color: #475569; border-radius: 18px; padding: 14px; font-weight: 600; width: 100%; border: 1px solid #e2e8f0; }
        
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; font-size: 15px; transition: all 0.3s; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; transition: 0.3s; }
        .nav-pro button.active { color: white; transform: translateY(-5px); }
        .nav-pro button.active i { color: var(--primary); }

        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="mb-8">
            <div class="w-16 h-1 w-full bg-blue-100 rounded-full mb-8"></div>
            <h2 id="setup-title" class="text-4xl font-extrabold tracking-tight text-slate-900">Bienvenue.</h2>
            <p class="text-slate-500 mt-2">Créez votre profil professionnel en quelques secondes.</p>
        </div>
        
        <div class="space-y-4">
            <div class="bg-slate-50 p-6 rounded-3xl border-2 border-dashed border-slate-200 text-center">
                <label class="text-xs font-bold text-slate-400 uppercase mb-2 block">Logo de l'entreprise</label>
                <input type="file" id="setup-logo" accept="image/*" class="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            <input type="text" id="setup-user" placeholder="Votre Nom complet" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone / WhatsApp" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA (Franc CFA)</option>
                <option value="GNF">GNF (Franc Guinéen)</option>
                <option value="$">USD (Dollar $)</option>
                <option value="€">EUR (Euro €)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main text-lg mt-6">COMMENCER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="glass-header p-5 sticky top-0 z-[1100] flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="header-logo-img" src="" class="w-10 h-10 rounded-xl hidden object-cover border border-slate-100">
            <div>
                <h1 id="header-biz" class="font-extrabold text-lg text-slate-900 tracking-tight uppercase leading-none">ComptaPro</h1>
                <p id="licence-status" class="text-[8px] font-bold text-slate-400 uppercase tracking-widest mt-1">Chargement...</p>
            </div>
        </div>
        <div id="days-badge" class="px-3 py-1 rounded-full text-[9px] font-extrabold tracking-wider"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <div class="relative z-10">
                    <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net Global</p>
                    <h2 class="text-4xl font-extrabold mt-2 tracking-tighter"><span id="valP">0</span> <small class="text-lg cur font-normal opacity-80"></small></h2>
                    <div class="grid grid-cols-3 gap-3 mt-8">
                        <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/10 text-center">
                            <span class="text-[9px] font-black opacity-60 block mb-1 uppercase">Jour</span>
                            <span id="repJ" class="text-xs font-extrabold">0</span>
                        </div>
                        <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/10 text-center">
                            <span class="text-[9px] font-black opacity-60 block mb-1 uppercase">Semaine</span>
                            <span id="repS" class="text-xs font-extrabold">0</span>
                        </div>
                        <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl border border-white/10 text-center">
                            <span class="text-[9px] font-black opacity-60 block mb-1 uppercase">Mois</span>
                            <span id="repM" class="text-xs font-extrabold">0</span>
                        </div>
                    </div>
                </div>
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-white/10 rounded-full blur-3xl"></div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i data-lucide="shopping-cart"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 uppercase">Nouvelle Vente</span>
                </button>
                <button onclick="nav('expense')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center"><i data-lucide="trending-down"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 uppercase">Nouvelle Charge</span>
                </button>
            </div>

            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Activités récentes</h3>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="nav('home')" class="p-2 bg-slate-100 rounded-full text-slate-400"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-2xl font-black">Caisse</h2>
                </div>
                <div class="card-premium">
                    <input type="text" id="vendeur" placeholder="Nom du Vendeur" class="input-pro">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-pro">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-24 text-center m-0">
                    </div>
                    <button onclick="addCart()" class="btn-secondary flex items-center justify-center gap-2 mb-6">
                        <i data-lucide="plus-circle" class="w-5"></i> Ajouter l'article
                    </button>

                    <div id="cart" class="space-y-3 mb-6 border-t border-slate-100 pt-4"></div>
                    
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total à payer</p>
                            <h3 class="text-2xl font-black text-slate-900"><span id="cartT">0</span> <small class="cur text-sm"></small></h3>
                        </div>
                        <button onclick="doSale()" class="btn-main !w-auto px-10">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-expense" class="page">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="nav('home')" class="p-2 bg-slate-100 rounded-full text-slate-400"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-2xl font-black text-red-600">Dépenses</h2>
                </div>
                <div class="card-premium">
                    <input type="text" id="exp_name" placeholder="Motif (ex: Loyer, Electricité)" class="input-pro">
                    <input type="number" id="exp_amt" placeholder="Montant décaissé" class="input-pro">
                    <button onclick="addExpense()" class="btn-main !bg-red-600 shadow-red-200 mt-4">ENREGISTRER</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center shadow-lg"><i data-lucide="plus"></i></button>
                </div>

                <div id="stk-form" class="hidden card-premium border-2 border-blue-100 mb-6">
                    <input type="text" id="p_name" placeholder="Nom de l'article" class="input-pro">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-pro">
                    <button onclick="addStock()" class="btn-main">ENREGISTRER</button>
                </div>

                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Paramètres</h2>
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1">ID Licence</p>
                <div class="flex justify-between items-center">
                    <h3 id="displayID" class="text-2xl font-extrabold text-blue-400 tracking-wider"></h3>
                    <button onclick="copyID()" class="w-10 h-10 bg-white/10 rounded-xl flex items-center justify-center"><i data-lucide="copy" class="w-4"></i></button>
                </div>
            </div>

            <button onclick="openSetup(true)" class="card-premium w-full flex items-center justify-between mb-4">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i data-lucide="settings" class="w-5"></i></div>
                    <span class="font-bold text-slate-700">Modifier le Profil/Logo</span>
                </div>
                <i data-lucide="chevron-right" class="text-slate-300"></i>
            </button>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="exportAudit()" class="btn-secondary !text-xs !py-4 flex flex-col items-center gap-2"><i data-lucide="save" class="w-4"></i> Sauvegarder</button>
                <label for="restore-file" class="btn-secondary !text-xs !py-4 flex flex-col items-center gap-2 cursor-pointer"><i data-lucide="refresh-ccw" class="w-4"></i> Restaurer</label>
                <input type="file" id="restore-file" class="hidden" accept=".json" onchange="restoreData(this)">
            </div>
            <button onclick="resetProfitAudit()" class="w-full text-[10px] font-black text-red-400 uppercase tracking-widest mb-8">Clôturer la caisse</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Dashboard</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user-cog"></i>Compte</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_ELITE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function save() { localStorage.setItem('CP_V14_ELITE', JSON.stringify(db)); }

        function openSetup(isEdit) {
            document.getElementById('setup-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-title').innerText = "Profil";
                const b = db.biz;
                document.getElementById('setup-user').value = b.user || "";
                document.getElementById('setup-biz').value = b.name || "";
                document.getElementById('setup-addr').value = b.addr || "";
                document.getElementById('setup-phone').value = b.phone || "";
                document.getElementById('setup-cur').value = b.cur || "FCFA";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }
        function closeSetup() { document.getElementById('setup-screen').style.display = 'none'; }
        
        async function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return alert("Veuillez remplir le nom de l'entreprise");
            const logoFile = document.getElementById('setup-logo').files[0];
            const finalize = (logoData) => {
                db.biz = {
                    user: document.getElementById('setup-user').value,
                    name: bizName, addr: document.getElementById('setup-addr').value,
                    phone: document.getElementById('setup-phone').value,
                    cur: document.getElementById('setup-cur').value,
                    logo: logoData || db.biz.logo || ""
                };
                save(); location.reload();
            };
            if(logoFile) {
                const reader = new FileReader();
                reader.onloadend = () => finalize(reader.result);
                reader.readAsDataURL(logoFile);
            } else finalize();
        }

        // --- GESTION DU STOCK ---
        function updateStockQty(id) {
            let item = db.stk.find(x => x.id == id);
            let newQty = prompt(`Nouvelle quantité pour ${item.n} :`, item.q);
            if(newQty !== null && !isNaN(newQty)) {
                item.q = parseInt(newQty);
                save(); render();
            }
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || !s) return; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        // --- GESTION DE LA CAISSE (PANIER) ---
        function addCart() {
            let id = document.getElementById('sel_p').value, q = parseInt(document.getElementById('sel_q').value);
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Quantité insuffisante en stock !");
            
            let existing = cart.find(x => x.id == id);
            if(existing) {
                if(existing.sq + q > it.q) return alert("Plus de stock disponible !");
                existing.sq += q;
                existing.st = existing.s * existing.sq;
            } else {
                cart.push({...it, sq:q, st:it.s*q});
            }
            renderCart();
        }

        function changeCartQty(index, delta) {
            let item = cart[index];
            let stockItem = db.stk.find(x => x.id == item.id);
            let newQty = item.sq + delta;
            
            if(newQty <= 0) return removeFromCart(index);
            if(newQty > stockItem.q) return alert("Stock maximum atteint !");
            
            item.sq = newQty;
            item.st = item.s * item.sq;
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map((i, index) => { 
                t += i.st; 
                return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <div class="flex-1">
                        <b class="text-xs text-slate-800">${i.n}</b><br>
                        <span class="text-[10px] text-slate-500">${i.s.toLocaleString()} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center bg-white rounded-lg border px-2 py-1 gap-3">
                            <button onclick="changeCartQty(${index}, -1)" class="text-red-500 font-bold">-</button>
                            <span class="text-xs font-black">${i.sq}</span>
                            <button onclick="changeCartQty(${index}, 1)" class="text-blue-600 font-bold">+</button>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; 
            });
            db.prof += tP;
            const sale = {id:Date.now(), ven:document.getElementById('vendeur').value || "Gérant", cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()};
            db.sales.push(sale); save(); genPDF(sale);
            cart=[]; render(); nav('home');
        }

        function render() {
            // Logo
            const logoEl = document.getElementById('header-logo-img');
            if(db.biz.logo) { logoEl.src = db.biz.logo; logoEl.classList.remove('hidden'); }
            
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            // Historique
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center py-4 px-5 border-l-4 ${i.isExp ? 'border-red-500' : 'border-blue-500'}">
                    <div><b class="text-sm font-bold text-slate-800">${i.cli || i.n}</b><br><small class="text-[9px] text-slate-400 uppercase">${i.d}</small></div>
                    <b class="${i.isExp || i.montant ? 'text-red-500' : 'text-blue-600'} text-sm">${i.isExp || i.montant ? '-' : '+'}${ (i.tot || i.a || i.montant).toLocaleString() }</b>
                </div>
            `).join('');
            
            // Stock
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center py-4">
                    <div><b class="text-slate-800 text-sm">${i.n}</b><br><small class="text-slate-400 font-bold text-[10px] uppercase">En Stock: ${i.q}</small></div>
                    <div class="flex items-center gap-4">
                        <div class="text-right font-black text-slate-900 text-sm">${i.s.toLocaleString()}</div>
                        <button onclick="updateStockQty(${i.id})" class="p-2 bg-slate-50 rounded-lg text-blue-600"><i data-lucide="edit-3" class="w-4"></i></button>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.t) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            checkLicense(); lucide.createIcons();
        }

        // PDF et autres fonctions techniques
        function genPDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            if(db.biz.logo) try { doc.addImage(db.biz.logo, 'PNG', 15, 10, 20, 20); } catch(e){}
            doc.setFont(undefined, 'bold').setFontSize(20).text(db.biz.name.toUpperCase(), 40, 20);
            doc.setFontSize(9).setFont(undefined, 'normal').text(`${db.biz.addr} | ${db.biz.phone}`, 40, 26);
            doc.autoTable({ startY: 40, head: [['ARTICLE', 'QTÉ', 'PRIX UNIT.', 'TOTAL']], body: sale.items.map(i => [i.n, i.sq, i.s.toLocaleString(), i.st.toLocaleString()]), headStyles:{fillColor:[30, 41, 59]} });
            doc.setFontSize(14).text(`TOTAL: ${sale.tot.toLocaleString()} ${db.biz.cur}`, 15, doc.lastAutoTable.finalY + 15);
            doc.save(`Facture_${sale.cli}.pdf`);
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
        }

        function addExpense() {
            let n = document.getElementById('exp_name').value;
            let a = +document.getElementById('exp_amt').value;
            if(!n || !a) return alert("Remplissez les champs");
            db.prof -= a;
            db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now(), isExp:true});
            save(); render(); nav('home');
        }

        function checkLicense() {
            const isOk = db.expiryDate ? Date.now() < db.expiryDate : false;
            const badge = document.getElementById('days-badge');
            const status = document.getElementById('licence-status');
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if(!isOk) {
                badge.innerText = "EXPIRÉ"; badge.className = "px-3 py-1 rounded-full text-[9px] font-extrabold tracking-wider bg-red-100 text-red-500";
                status.innerText = "MODE CONSULTATION";
            } else {
                const days = Math.ceil((db.expiryDate-Date.now())/86400000);
                badge.innerText = days + " JOURS"; badge.className = "px-3 py-1 rounded-full text-[9px] font-extrabold tracking-wider bg-green-100 text-green-500";
                status.innerText = "LICENCE ACTIVE";
            }
            // Temporairement, forcer l'accès pour tester si pas de date
            if(!db.expiryDate) { db.expiryDate = Date.now() + 86400000 * 3; save(); }
            return true;
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié"); }
        function exportAudit() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Backup.json`; a.click();
        }
        function restoreData(input) {
            const r = new FileReader(); r.onload = (e) => { db = JSON.parse(e.target.result); save(); location.reload(); };
            r.readAsText(input.files[0]);
        }
        function resetProfitAudit() { if(confirm("Clôturer la caisse ?")) { db.resets.push({id:Date.now(), n:"Clôture", montant:db.prof, d:new Date().toLocaleString()}); db.prof = 0; save(); render(); } }
    </script>
</body>
</html>
