<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro | Business Manager</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 20px; border-radius: 24px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px -10px rgba(0,0,0,0.03); margin-bottom: 16px; }
        .input-f { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #E2E8F0; margin-bottom: 10px; outline: none; transition: 0.2s; background: #FDFDFD; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 16px; border-radius: 18px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.5; }
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-radius: 22px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 15px 35px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        nav button.active { color: #2563EB; }
        nav button.active i { background: rgba(37, 99, 235, 0.1); padding: 6px; border-radius: 12px; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 5px 12px; border-radius: 10px; text-transform: uppercase; }
        .low-stock { color: #ef4444; font-weight: 800; animation: pulse 1.5s infinite; }
        @keyframes pulse { 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <h2 id="setup-title" class="text-3xl font-extrabold text-slate-900 mb-2">Configuration</h2>
        <p class="text-slate-500 mb-8 font-medium">Paramétrez votre profil d'entreprise.</p>
        <div class="space-y-3">
            <div class="bg-blue-50 p-5 rounded-2xl border border-dashed border-blue-200 text-center mb-4">
                <label class="text-[10px] font-bold uppercase text-blue-600 mb-2 block">Logo Boutique</label>
                <input type="file" id="setup-logo" accept="image/*" class="text-xs text-slate-500">
            </div>
            <input type="text" id="setup-user" placeholder="Votre Nom" class="input-f">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-f">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-f">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-f">
            <select id="setup-cur" class="input-f">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">Dollar ($)</option>
                <option value="€">Euro (€)</option>
            </select>
            <button onclick="saveSetup()" class="btn-blue mt-4">SAUVEGARDER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-xs mt-4 hidden">ANNULER</button>
        </div>
    </div>

    <header class="p-5 bg-white/80 backdrop-blur-md border-b flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-lg tracking-tight uppercase">ComptaPro</h1>
            <div id="days-badge" class="badge-status inline-block mt-1"></div>
        </div>
        <button onclick="nav('pro')" class="text-slate-400"><i data-lucide="settings"></i></button>
    </header>

    <main class="p-4 max-w-xl mx-auto">
        
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[35px] text-white shadow-xl mb-6 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600 rounded-full blur-[60px] opacity-40"></div>
                <p class="text-[10px] opacity-60 uppercase font-bold tracking-widest mb-1">Bénéfice Net Actuel</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-6"><span id="valP">0</span> <small class="cur text-blue-400 text-sm font-normal"></small></h2>
                
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/10 p-2 rounded-xl text-center">
                        <span class="text-[8px] opacity-50 block">JOUR</span>
                        <span id="repJ" class="font-bold text-xs">0</span>
                    </div>
                    <div class="bg-white/10 p-2 rounded-xl text-center">
                        <span class="text-[8px] opacity-50 block">SEMAINE</span>
                        <span id="repS" class="font-bold text-xs">0</span>
                    </div>
                    <div class="bg-white/10 p-2 rounded-xl text-center">
                        <span class="text-[8px] opacity-50 block">MOIS</span>
                        <span id="repM" class="font-bold text-xs">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-2 p-5 text-blue-600">
                    <i data-lucide="shopping-cart"></i>
                    <span class="text-xs font-bold text-slate-700">VENDRE</span>
                </button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-2 p-5 text-red-500">
                    <i data-lucide="arrow-down-circle"></i>
                    <span class="text-xs font-bold text-slate-700">DÉPENSE</span>
                </button>
            </div>

            <h3 class="text-[10px] font-bold text-slate-400 mb-3 uppercase tracking-widest">Flux récents</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-4">Nouvelle Vente</h2>
                <div class="card border-t-4 border-blue-600">
                    <input type="text" id="cl_name" placeholder="Nom du Client (optionnel)" class="input-f">
                    
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0">
                        <button onclick="addCart()" class="bg-blue-600 text-white px-4 rounded-xl"><i data-lucide="plus"></i></button>
                    </div>

                    <div id="cart" class="space-y-2 border-t pt-4"></div>
                    
                    <div id="money-calc" class="mt-4 p-4 bg-slate-50 rounded-xl hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-400">REÇU</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-24 p-1 rounded border text-right font-bold">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400">MONNAIE</span>
                            <span id="change-due" class="font-bold text-green-600">0</span>
                        </div>
                    </div>

                    <div class="mt-6 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total</p>
                            <span class="text-2xl font-black"><span id="cartT">0</span> <small class="cur text-xs"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-extrabold">Stock</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Ajouter</button>
                </div>

                <div id="stk-form" class="hidden card bg-blue-50 border-blue-100">
                    <input type="text" id="p_name" placeholder="Nom du produit" class="input-f">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-f">
                    <button onclick="addStock()" class="btn-blue">AJOUTER</button>
                </div>

                <input type="text" id="search-stock" oninput="render()" placeholder="Rechercher un article..." class="input-f mb-4">
                <div id="stkList" class="space-y-3"></div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-extrabold mb-4">Dépense</h2>
                <div class="card border-t-4 border-red-500">
                    <input type="text" id="exp_name" placeholder="Motif" class="input-f">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-f">
                    <button onclick="addExpense()" class="w-full bg-red-500 text-white p-4 rounded-xl font-bold">ENREGISTRER</button>
                </div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-4">Administration</h2>
            
            <div class="card bg-slate-900 text-white flex justify-between items-center">
                <div>
                    <p class="text-[10px] opacity-50">ID LICENCE</p>
                    <code id="displayID" class="text-blue-400 font-bold"></code>
                </div>
                <button onclick="copyID()" class="bg-white/10 p-2 rounded-lg"><i data-lucide="copy" class="w-4 h-4"></i></button>
            </div>

            <div class="card space-y-3">
                <button onclick="openSetup(true)" class="w-full flex items-center justify-between p-3 bg-slate-50 rounded-xl font-bold text-sm">
                    Modifier Profil <i data-lucide="chevron-right" class="w-4"></i>
                </button>
                <button onclick="exportAudit()" class="w-full flex items-center justify-between p-3 bg-slate-50 rounded-xl font-bold text-sm text-blue-600">
                    Télécharger Sauvegarde <i data-lucide="download" class="w-4"></i>
                </button>
                <button onclick="resetProfitAudit()" class="w-full p-3 text-red-500 font-bold text-[10px] border border-red-100 rounded-xl uppercase">
                    Clôture de Caisse (Reset Bénéfice)
                </button>
                <button onclick="logout()" class="w-full p-3 text-slate-300 font-bold text-[10px] uppercase">Effacer tout</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_ULTIMATE_V14')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            expiryDate: null, installDate: Date.now() 
        };
        let cart = [];

        const save = () => localStorage.setItem('CP_ULTIMATE_V14', JSON.stringify(db));

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
            checkLicense();
        }

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-biz').value = db.biz.name;
                document.getElementById('setup-addr').value = db.biz.addr;
                document.getElementById('setup-phone').value = db.biz.phone;
                document.getElementById('setup-cur').value = db.biz.cur;
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

        function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return alert("Nom requis");
            const logoFile = document.getElementById('setup-logo').files[0];
            
            const done = (logoData) => {
                db.biz = {
                    name: bizName, addr: document.getElementById('setup-addr').value,
                    phone: document.getElementById('setup-phone').value,
                    cur: document.getElementById('setup-cur').value,
                    logo: logoData || db.biz.logo || ""
                };
                save(); location.reload();
            };

            if (logoFile) {
                const reader = new FileReader();
                reader.onloadend = () => done(reader.result);
                reader.readAsDataURL(logoFile);
            } else done();
        }

        function render() {
            const query = document.getElementById('search-stock').value.toLowerCase();
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;

            // Historique
            const combined = [...db.sales.map(s => ({...s, type:'sale'})), 
                              ...db.expenses.map(e => ({...e, type:'exp', tot:e.a}))]
                              .sort((a,b) => b.id - a.id).slice(0, 10);

            document.getElementById('hist').innerHTML = combined.map(i => `
                <div class="card flex justify-between items-center p-4 border-l-4 ${i.type=='exp'?'border-red-500':'border-blue-500'}">
                    <div>
                        <b class="text-sm">${i.cli || i.n || 'Client Passager'}</b>
                        <br><small class="text-[9px] text-slate-400 uppercase">${new Date(i.id).toLocaleDateString()}</small>
                    </div>
                    <div class="flex items-center gap-3">
                        <b class="${i.type=='exp'?'text-red-500':'text-blue-600'}">${i.type=='exp'?'-':''}${i.tot.toLocaleString()}</b>
                        <button onclick="deleteItem('${i.type}', ${i.id})" class="text-slate-200"><i data-lucide="trash-2" class="w-3"></i></button>
                    </div>
                </div>
            `).join('');

            // Liste Stock
            document.getElementById('stkList').innerHTML = db.stk
                .filter(i => i.n.toLowerCase().includes(query))
                .map((i, idx) => `
                <div class="card flex justify-between items-center p-4">
                    <div>
                        <b class="text-sm block">${i.n}</b>
                        <span class="text-blue-600 font-bold text-[10px]">${i.s} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-1 rounded-xl border">
                        <button onclick="updateQty(${idx}, -1)" class="w-7 h-7 bg-white rounded-lg shadow-sm font-bold">-</button>
                        <span class="text-xs font-bold w-6 text-center ${i.q <= 3 ? 'low-stock' : ''}">${i.q}</span>
                        <button onclick="updateQty(${idx}, 1)" class="w-7 h-7 bg-white rounded-lg shadow-sm font-bold">+</button>
                    </div>
                </div>`).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.id) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            
            lucide.createIcons();
        }

        function updateQty(idx, val) {
            if(db.stk[idx].q + val >= 0) { db.stk[idx].q += val; save(); render(); }
        }

        function addStock() {
            let n = document.getElementById('p_name').value, 
                c = +document.getElementById('p_cost').value, 
                s = +document.getElementById('p_sell').value, 
                q = +document.getElementById('p_qty').value;
            if(!n || q < 0) return;
            db.stk.push({id:Date.now(), n, c, s, q});
            save(); render(); toggleF('stk-form');
            document.getElementById('p_name').value = "";
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant");
            cart.push({...it, sq:q, st:it.s*q});
            renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('money-calc').classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart').innerHTML = cart.map((i, idx) => {
                t += i.st;
                return `<div class="flex justify-between text-xs bg-slate-50 p-2 rounded-lg">
                    <span>${i.n} (x${i.sq})</span>
                    <b class="text-blue-600">${i.st.toLocaleString()}</b>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
        }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => {
                let s = db.stk.find(x => x.id == c.id);
                s.q -= c.sq; tV += c.st; tP += (c.s - c.c) * c.sq;
            });
            db.prof += tP;
            const sale = {id:Date.now(), cli:document.getElementById('cl_name').value, tot:tV, items:[...cart], profit:tP};
            db.sales.push(sale);
            save(); genPDF(sale);
            cart = []; document.getElementById('cl_name').value = "";
            render(); nav('home');
        }

        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a;
            db.expenses.push({id:Date.now(), n, a, isExp:true});
            save(); render(); nav('home');
            document.getElementById('exp_name').value = "";
            document.getElementById('exp_amt').value = "";
        }

        function deleteItem(type, id) {
            if(!confirm("Supprimer cette transaction ?")) return;
            if(type === 'sale') {
                const i = db.sales.findIndex(s => s.id === id);
                db.prof -= db.sales[i].profit;
                db.sales.splice(i, 1);
            } else {
                const i = db.expenses.findIndex(e => e.id === id);
                db.prof += db.expenses[i].a;
                db.expenses.splice(i, 1);
            }
            save(); render();
        }

        function genPDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            if (db.biz.logo) doc.addImage(db.biz.logo, 'PNG', 15, 10, 20, 20);
            doc.setFontSize(18).text(db.biz.name, 40, 20);
            doc.setFontSize(8).text(`${db.biz.addr} | ${db.biz.phone}`, 40, 25);
            doc.autoTable({
                startY: 40,
                head: [['Article', 'Qté', 'Prix', 'Total']],
                body: sale.items.map(i => [i.n, i.sq, i.s, i.st]),
            });
            doc.text(`Total: ${sale.tot} ${db.biz.cur}`, 15, doc.lastAutoTable.finalY + 10);
            doc.save(`Facture_${sale.id}.pdf`);
        }

        function updateChange() {
            const rec = +document.getElementById('cash-in').value || 0;
            const tot = parseInt(document.getElementById('cartT').innerText.replace(/\s/g, ''));
            document.getElementById('change-due').innerText = (rec - tot > 0 ? rec - tot : 0).toLocaleString() + " " + db.biz.cur;
        }

        function checkLicense() {
            const trial = db.installDate + (7 * 86400000);
            const exp = db.expiryDate || trial;
            const ok = exp > Date.now();
            document.getElementById('lock-zone').classList.toggle('locked', !ok);
            const badge = document.getElementById('days-badge');
            badge.innerText = ok ? "Mode Actif" : "Licence Expirée";
            badge.className = `badge-status ${ok ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`;
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié !"); }
        function exportAudit() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `ComptaPro_Backup.json`; a.click();
        }
        function resetProfitAudit() { if(confirm("Remettre le bénéfice à zéro ?")) { db.prof = 0; save(); render(); } }
        function logout() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
