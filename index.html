<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14 - Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { --primary: #2563eb; --accent: #f97316; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        
        .page { display: none; transition: all 0.4s ease; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-premium { background: white; border-radius: 25px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 20px; transition: transform 0.2s; position: relative; }
        
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .btn-secondary { background: #f1f5f9; color: #475569; border-radius: 18px; padding: 14px; font-weight: 600; width: 100%; border: 1px solid #e2e8f0; }
        
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; font-size: 15px; transition: all 0.3s; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; }

        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; transition: 0.3s; }
        .nav-pro button.active { color: white; }
        .nav-pro button.active i { color: var(--primary); }

        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
        .btn-del-mini { color: #ef4444; padding: 8px; background: #fef2f2; border-radius: 10px; }
        .qty-badge { background: #eff6ff; color: #2563eb; padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 14px; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="mb-8">
            <h2 id="setup-title" class="text-4xl font-extrabold tracking-tight text-slate-900">Bienvenue.</h2>
            <p class="text-slate-500 mt-2">Créez votre profil professionnel.</p>
        </div>
        <div class="space-y-4">
            <input type="text" id="setup-user" placeholder="Votre Nom complet" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">USD ($)</option>
                <option value="€">EUR (€)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main text-lg mt-6">COMMENCER</button>
        </div>
    </div>

    <header class="glass-header p-5 sticky top-0 z-[1100] flex justify-between items-center">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">V14 ELITE</p>
        </div>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8">
                <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold mt-2 tracking-tighter"><span id="valP">0</span> <small class="text-lg cur font-normal opacity-80"></small></h2>
                <div class="grid grid-cols-3 gap-3 mt-8">
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-black opacity-60 block mb-1">JOUR</span>
                        <span id="repJ" class="text-xs font-extrabold">0</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-black opacity-60 block mb-1">SEMAINE</span>
                        <span id="repS" class="text-xs font-extrabold">0</span>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-black opacity-60 block mb-1">MOIS</span>
                        <span id="repM" class="text-xs font-extrabold">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center"><i data-lucide="shopping-cart"></i></div>
                    <span class="text-xs font-bold text-slate-600 uppercase">Vente</span>
                </button>
                <button onclick="nav('expense')" class="card-premium flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center"><i data-lucide="trending-down"></i></div>
                    <span class="text-xs font-bold text-slate-600 uppercase">Charge</span>
                </button>
            </div>

            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 px-2">Activités récentes</h3>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-pro">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center m-0">
                    </div>
                    <button onclick="addCart()" class="btn-secondary flex items-center justify-center gap-2 mb-6">
                        <i data-lucide="plus-circle" class="w-5"></i> Ajouter
                    </button>

                    <div id="cart" class="space-y-3 mb-6 border-t border-slate-100 pt-4">
                        </div>
                    
                    <div class="flex justify-between items-end border-t pt-4">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total</p>
                            <h3 class="text-2xl font-black text-slate-900"><span id="cartT">0</span> <small class="cur text-sm"></small></h3>
                        </div>
                        <button onclick="doSale()" class="btn-main !w-auto px-10">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>

                <div id="stk-form" class="hidden card-premium border-2 border-blue-100 mb-6">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Stock Initial" class="input-pro">
                    <button onclick="addStock()" class="btn-main">AJOUTER AU STOCK</button>
                </div>

                <div id="stkList" class="space-y-3"></div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-black text-red-600 mb-6">Dépenses</h2>
                <div class="card-premium">
                    <input type="text" id="exp_name" placeholder="Motif" class="input-pro">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-pro">
                    <button onclick="addExpense()" class="btn-main !bg-red-600 shadow-red-200 mt-4">ENREGISTRER</button>
                </div>
            </div>

            <div id="page-pro" class="page">
                <h2 class="text-2xl font-black mb-6">Compte</h2>
                <div id="displayID" class="p-4 bg-slate-100 rounded-2xl mb-4 font-mono text-center"></div>
                <button onclick="exportAudit()" class="btn-secondary mb-4">Sauvegarder les données</button>
                <button onclick="logout()" class="w-full text-red-500 text-xs font-bold underline">Réinitialiser l'application</button>
            </div>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid" class="w-6 h-6"></i>Dashboard</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag" class="w-6 h-6"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package" class="w-6 h-6"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user-cog" class="w-6 h-6"></i>Compte</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_ELITE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: Date.now() + (100*86400000) 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function save() { localStorage.setItem('CP_V14_ELITE', JSON.stringify(db)); }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = "LICENCE : " + db.licenseID;
            
            // Historique
            const hist = [...db.sales, ...db.expenses].sort((a,b) => b.id - a.id).slice(0, 8);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center ${i.isExp ? 'bg-red-50/50' : ''}">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 ${i.isExp ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'} rounded-full flex items-center justify-center">
                            <i data-lucide="${i.isExp ? 'arrow-down' : 'arrow-up'}" class="w-4"></i>
                        </div>
                        <div><b class="text-sm">${i.cli || i.n}</b><br><small class="text-[10px] text-slate-400">${i.d}</small></div>
                    </div>
                    <b class="${i.isExp ? 'text-red-500' : 'text-blue-600'} text-sm">${i.isExp ? '-' : '+'}${ (i.tot || i.a).toLocaleString() }</b>
                </div>
            `).join('');
            
            // Liste Stock avec Modification Quantité
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <b class="text-slate-800 text-lg">${i.n}</b>
                            <p class="text-xs text-slate-400">Vente: ${i.s.toLocaleString()} ${db.biz.cur}</p>
                        </div>
                        <button onclick="deleteStock(${i.id})" class="btn-del-mini"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                    <div class="flex items-center justify-between bg-slate-50 p-2 rounded-xl">
                        <span class="text-[10px] font-bold text-slate-400 uppercase ml-2">Stock Actuel</span>
                        <div class="flex items-center gap-3">
                            <button onclick="adjStk(${i.id}, -1)" class="w-8 h-8 bg-white border rounded-lg shadow-sm font-bold">-</button>
                            <span onclick="editStkManual(${i.id})" class="qty-badge cursor-pointer">${i.q}</span>
                            <button onclick="adjStk(${i.id}, 1)" class="w-8 h-8 bg-white border rounded-lg shadow-sm font-bold">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (Dispo: ${i.q})</option>`).join('');
            
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.id) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            lucide.createIcons();
        }

        // --- Fonctions Stock ---
        function adjStk(id, delta) {
            let item = db.stk.find(x => x.id === id);
            if(item) {
                item.q = Math.max(0, item.q + delta);
                save(); render();
            }
        }

        function editStkManual(id) {
            let item = db.stk.find(x => x.id === id);
            let val = prompt(`Nouvelle quantité pour ${item.n} :`, item.q);
            if(val !== null && !isNaN(val)) {
                item.q = parseInt(val);
                save(); render();
            }
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || !s) return; 
            db.stk.push({id:Date.now(), n, c, s, q}); 
            save(); render(); toggleF('stk-form');
        }

        function deleteStock(id) {
            if(confirm("Supprimer définitivement cet article ?")) {
                db.stk = db.stk.filter(x => x.id !== id);
                save(); render();
            }
        }

        // --- Fonctions Caisse ---
        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it) return;
            if(q > it.q) return alert("Stock insuffisant !");
            
            // On ajoute au panier (on peut ajouter plusieurs fois le même article)
            cart.push({
                cartId: Date.now(), // ID unique pour la suppression dans le panier
                id: it.id, 
                n: it.n, 
                sq: q, 
                s: it.s, 
                c: it.c, 
                st: it.s * q
            });
            renderCart();
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            renderCart();
        }

        function renderCart() {
            let t = 0;
            const container = document.getElementById('cart');
            if(cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 text-xs py-4">Panier vide</p>`;
            } else {
                container.innerHTML = cart.map(i => { 
                    t += i.st; 
                    return `
                    <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100">
                        <div>
                            <b class="text-xs block">${i.n}</b>
                            <small class="text-blue-600">Qté: ${i.sq} × ${i.s.toLocaleString()}</small>
                        </div>
                        <div class="flex items-center gap-3">
                            <b class="text-xs">${i.st.toLocaleString()}</b>
                            <button onclick="removeFromCart(${i.cartId})" class="text-red-400 p-1"><i data-lucide="x-circle" class="w-4"></i></button>
                        </div>
                    </div>`;
                }).join('');
            }
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!cart.length) return alert("Le panier est vide");
            let tP=0, tV=0;
            
            // Déduction du stock et calcul profit
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                if(s) s.q -= c.sq; 
                tV += c.st; 
                tP += (c.s - c.c) * c.sq; 
            });

            db.prof += tP;
            db.sales.push({
                id: Date.now(), 
                cli: document.getElementById('cl_name').value || "Client", 
                tot: tV, 
                d: new Date().toLocaleString(),
                items: [...cart]
            });
            
            cart = []; 
            save(); render(); renderCart(); nav('home');
            alert("Vente enregistrée !");
        }

        // --- Navigation & Utilitaires ---
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        
        function openSetup() { document.getElementById('setup-screen').style.display = 'block'; }
        
        function saveSetup() {
            db.biz = {
                user: document.getElementById('setup-user').value,
                name: document.getElementById('setup-biz').value,
                cur: document.getElementById('setup-cur').value
            };
            save(); location.reload();
        }

        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a;
            db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), isExp:true});
            save(); render(); nav('home');
        }

        function exportAudit() {
            const data = JSON.stringify(db, null, 2);
            const blob = new Blob([data], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ComptaPro_Backup.json`;
            a.click();
        }

        function logout() {
            if(confirm("Effacer toutes les données ?")) { localStorage.clear(); location.reload(); }
        }
    </script>
</body>
</html>
