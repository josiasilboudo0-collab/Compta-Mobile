<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; padding-bottom: 100px; }
        .page { display: none; } .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card-premium { background: white; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 24px; }
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; }
        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; }
        .nav-pro button.active { color: white; }
        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2 id="setup-title" class="text-4xl font-extrabold text-slate-900">Bienvenue.</h2>
        <p class="text-slate-500 mb-8">Configurez votre entreprise.</p>
        <div class="space-y-4">
            <input type="file" id="setup-logo" accept="image/*" class="input-pro">
            <input type="text" id="setup-user" placeholder="Propriétaire" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA</option>
                <option value="$">Dollar ($)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main text-lg mt-6">COMMENCER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="p-5 bg-white/80 backdrop-blur-md sticky top-0 z-[1100] flex justify-between items-center border-b">
        <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 uppercase">ComptaPro</h1>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8">
                <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net</p>
                <h2 class="text-4xl font-extrabold mt-2"><span id="valP">0</span> <small class="text-lg cur"></small></h2>
                <div class="grid grid-cols-3 gap-3 mt-6">
                    <div class="bg-white/10 p-2 rounded-xl text-center text-[10px]">JOUR<br><span id="repJ" class="font-black">0</span></div>
                    <div class="bg-white/10 p-2 rounded-xl text-center text-[10px]">SEM.<br><span id="repS" class="font-black">0</span></div>
                    <div class="bg-white/10 p-2 rounded-xl text-center text-[10px]">MOIS<br><span id="repM" class="font-black">0</span></div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card-premium flex flex-col items-center gap-3"><i data-lucide="shopping-cart" class="text-blue-600"></i><span class="text-xs font-bold">VENTE</span></button>
                <button onclick="nav('expense')" class="card-premium flex flex-col items-center gap-3"><i data-lucide="trending-down" class="text-red-600"></i><span class="text-xs font-bold">CHARGE</span></button>
            </div>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium">
                    <input type="text" id="vendeur" placeholder="Vendeur" class="input-pro">
                    <input type="text" id="cl_name" placeholder="Client" class="input-pro">
                    <div class="flex gap-2">
                        <select id="sel_p" class="input-pro flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center m-0">
                        <button onclick="addCart()" class="bg-blue-600 text-white px-4 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="my-4 space-y-2"></div>
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-black"><span id="cartT">0</span> <small class="cur"></small></h3>
                        <button onclick="doSale()" class="btn-main !w-auto px-8">VENDRE</button>
                    </div>
                </div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-black mb-6">Nouvelle Charge</h2>
                <div class="card-premium border-t-4 border-red-500">
                    <p class="text-xs text-slate-400 mb-4 font-bold uppercase">Enregistrez vos dépenses (Loyer, Transport, etc.)</p>
                    <input type="text" id="exp_name" placeholder="Motif de la dépense" class="input-pro">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-pro">
                    <button onclick="addExpense()" class="btn-main !bg-red-500 shadow-red-200 mt-2">ENREGISTRER LA CHARGE</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Stock</h2>
                    <button onclick="toggleF('stk-form')" class="bg-slate-900 text-white p-3 rounded-2xl"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card-premium mb-6 border-2 border-blue-50">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-pro">
                    <button onclick="addStock()" class="btn-main">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Compte</h2>
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[10px] font-black opacity-40 uppercase">ID LICENCE</p>
                <div class="flex justify-between items-center">
                    <h3 id="displayID" class="text-2xl font-extrabold text-blue-400 tracking-wider"></h3>
                    <button onclick="copyID()"><i data-lucide="copy" class="w-4"></i></button>
                </div>
            </div>
            <div class="space-y-3">
                <button onclick="contactWA()" class="btn-main !bg-green-600">PAYER PAR WHATSAPP</button>
                <div class="flex gap-2">
                    <input type="text" id="activation-key" placeholder="Code PRO-XXXX" class="input-pro m-0 text-center">
                    <button onclick="checkKey()" class="bg-slate-900 text-white px-6 rounded-2xl">ACTIVER</button>
                </div>
                <button onclick="openSetup(true)" class="btn-secondary mt-4">Modifier mon Entreprise</button>
                <button onclick="exportAudit()" class="btn-secondary">Exporter Sauvegarde</button>
                <button onclick="resetProfitAudit()" class="w-full text-red-500 font-black text-[10px] mt-6">REMISE À ZÉRO CAISSE</button>
            </div>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Vente</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user-cog"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_CORRECT')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };
        function save() { localStorage.setItem('CP_V14_CORRECT', JSON.stringify(db)); }

        // --- CORRECTION LOGO & FACTURE ---
        function genPDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // On vérifie le logo avant d'ajouter
            if(db.biz.logo) {
                try { doc.addImage(db.biz.logo, 'JPEG', 15, 10, 25, 25); } catch(e){ console.log("Erreur logo"); }
            }

            doc.setFont(undefined, 'bold').setFontSize(22).setTextColor(30, 41, 59).text(db.biz.name.toUpperCase(), 45, 20);
            doc.setFontSize(9).setFont(undefined, 'normal').setTextColor(100).text(`${db.biz.addr} | Tel: ${db.biz.phone}`, 45, 27);
            doc.setDrawColor(240).line(15, 40, 195, 40);
            doc.setFontSize(10).setTextColor(0).text(`FACTURE N°${sale.id.toString().slice(-6)}`, 15, 52);
            doc.text(`DATE: ${sale.d}`, 15, 57);
            doc.text(`VENDEUR: ${sale.ven}`, 140, 57);
            doc.autoTable({ startY: 65, head: [['ARTICLE', 'QTÉ', 'PRIX UNIT.', 'TOTAL']], body: sale.items.map(i => [i.n, i.sq, i.s.toLocaleString(), i.st.toLocaleString()]), headStyles:{fillColor:[30, 41, 59]} });
            doc.setFontSize(16).text(`TOTAL: ${sale.tot.toLocaleString()} ${db.biz.cur}`, 120, doc.lastAutoTable.finalY + 15);
            doc.setFontSize(10).setFont(undefined, 'italic').text("Merci de votre confiance ! Votre fidélité est notre plus grande satisfaction.", 105, doc.lastAutoTable.finalY + 30, {align:'center'});
            doc.save(`Facture_${sale.cli}.pdf`);
        }

        // --- LOGIQUE METIER ---
        function addExpense() {
            let n = document.getElementById('exp_name').value;
            let a = +document.getElementById('exp_amt').value;
            if(!n || !a) return alert("Remplissez les champs");
            db.prof -= a;
            db.expenses.push({id:Date.now(), n:n, a:a, d:new Date().toLocaleString(), t:Date.now(), isExp:true});
            save(); render(); nav('home');
            document.getElementById('exp_name').value = ""; document.getElementById('exp_amt').value = "";
        }

        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            const sale = {id:Date.now(), ven:document.getElementById('vendeur').value || "Gérant", cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()};
            db.sales.push(sale); save(); genPDF(sale);
            cart=[]; render(); nav('home');
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center ${i.isExp ? 'bg-red-50/50' : ''}">
                    <div><b class="text-sm">${i.cli || i.n}</b><br><small class="text-[10px] text-slate-400">${i.d}</small></div>
                    <b class="${i.isExp || i.montant ? 'text-red-500' : 'text-blue-600'}">${ (i.tot || i.a || i.montant).toLocaleString() }</b>
                </div>
            `).join('');
            document.getElementById('stkList').innerHTML = db.stk.map(i => `<div class="card-premium flex justify-between py-4 text-sm"><span><b>${i.n}</b> (x${i.q})</span><b>${i.s.toLocaleString()}</b></div>`).join('');
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            checkLicense(); lucide.createIcons();
        }

        // --- RESTE DES FONCTIONS (SETUP, NAV, ETC.) ---
        function openSetup(isEdit) { document.getElementById('setup-screen').style.display = 'block'; }
        function saveSetup() {
            const logoFile = document.getElementById('setup-logo').files[0];
            const finalize = (logoData) => {
                db.biz = { user:document.getElementById('setup-user').value, name:document.getElementById('setup-biz').value, addr:document.getElementById('setup-addr').value, phone:document.getElementById('setup-phone').value, cur:document.getElementById('setup-cur').value, logo:logoData || db.biz.logo || "" };
                save(); location.reload();
            };
            if(logoFile) { const r = new FileReader(); r.onloadend = () => finalize(r.result); r.readAsDataURL(logoFile); } else finalize();
        }
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
        }
        function checkLicense() {
            const isOk = db.expiryDate && Date.now() < db.expiryDate;
            document.getElementById('days-badge').innerText = isOk ? "ACTIF" : "EXPIRÉ";
            document.getElementById('days-badge').className = isOk ? "px-4 py-1.5 rounded-full text-[10px] font-extrabold bg-green-100 text-green-600" : "px-4 py-1.5 rounded-full text-[10px] font-extrabold bg-red-100 text-red-600";
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            return isOk;
        }
        function checkKey() {
            const key = document.getElementById('activation-key').value.trim().toUpperCase();
            const d = new Date();
            const formula = (parseInt(db.licenseID.replace(/\D/g, '')) * 7) + d.getDate() + (d.getMonth() + 1);
            if(key === "PRO-"+formula) { db.expiryDate = Date.now() + (30*86400000); save(); location.reload(); } else alert("Code erroné.");
        }
        function addStock() { let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form'); }
        function addCart() { let id=document.getElementById('sel_p').value, q=+document.getElementById('sel_q').value; let it=db.stk.find(x=>x.id==id); if(!it||q>it.q) return alert("Stock bas"); cart.push({...it, sq:q, st:it.s*q}); renderCart(); }
        function renderCart() { let t=0; document.getElementById('cart').innerHTML = cart.map(i=>{t+=i.st; return `<div class='flex justify-between text-xs font-bold bg-slate-50 p-3 rounded-xl'><span>${i.n} x${i.sq}</span><span>${i.st}</span></div>`}).join(''); document.getElementById('cartT').innerText = t.toLocaleString(); }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function contactWA() { window.open(`https://wa.me/22666566140?text=Licence%20ID:${db.licenseID}`, '_blank'); }
    </script>
</body>
</html>
