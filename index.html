<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Ultimate</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; transition: transform 0.2s; }
        .card:active { transform: scale(0.99); }
        
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; transition: all 0.2s; background: #FDFDFD; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); background: white; }
        
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 18px; border-radius: 20px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); transition: all 0.2s; }
        
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
        nav button.active { color: #2563EB; transform: translateY(-5px); }
        nav button.active i { background: rgba(37, 99, 235, 0.1); padding: 8px; border-radius: 14px; }

        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 40px 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

        .low-stock-alert { color: #ef4444 !important; animation: pulse-red 1s infinite; font-weight: 800; }
        @keyframes pulse-red { 50% { opacity: 0.5; } }
        
        .logo-preview-container { width: 100px; height: 100px; margin: 0 auto 20px; border-radius: 30px; border: 2px dashed #CBD5E1; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; background: #F1F5F9; }
        #logo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <div class="max-w-md mx-auto">
            <h2 id="setup-title" class="text-3xl font-extrabold text-slate-900 mb-2 tracking-tight">Configuration</h2>
            <p class="text-slate-500 mb-8 text-sm font-medium">Personnalisez votre boutique.</p>
            <div class="space-y-4">
                <div class="logo-preview-container" onclick="document.getElementById('setup-logo').click()">
                    <img id="logo-preview" src="" alt="Aperçu">
                    <div id="logo-icon" class="text-slate-400 flex flex-col items-center text-[10px] font-bold">
                        <i data-lucide="camera" class="mb-1"></i><span>LOGO</span>
                    </div>
                </div>
                <input type="file" id="setup-logo" accept="image/*" class="hidden" onchange="previewImage(this)">
                <input type="text" id="setup-user" placeholder="Nom du Gérant" class="input-f">
                <input type="text" id="setup-biz" placeholder="Nom de la Boutique" class="input-f">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="setup-phone" placeholder="Téléphone" class="input-f">
                    <select id="setup-cur" class="input-f">
                        <option value="FCFA">FCFA</option>
                        <option value="GNF">GNF</option>
                        <option value="$">Dollar ($)</option>
                        <option value="€">Euro (€)</option>
                    </select>
                </div>
                <input type="text" id="setup-addr" placeholder="Adresse" class="input-f">
                <button onclick="saveSetup()" class="btn-blue">ENREGISTRER</button>
            </div>
        </div>
    </div>

    <header class="p-6 bg-white/80 backdrop-blur-md border-b border-slate-100 flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 tracking-tighter uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-extrabold text-blue-500 uppercase tracking-widest"></p>
        </div>
        <div id="days-badge" class="badge-status"></div>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600 rounded-full blur-[60px] opacity-40"></div>
                <p class="text-xs opacity-60 uppercase font-extrabold tracking-widest mb-1">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block opacity-50">JOUR</span><span id="repJ" class="font-extrabold text-sm">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block opacity-50">SEM.</span><span id="repS" class="font-extrabold text-sm">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block opacity-50">MOIS</span><span id="repM" class="font-extrabold text-sm">0</span></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-3 p-6 text-blue-600">
                    <i data-lucide="shopping-cart"></i><span class="text-xs font-extrabold uppercase text-slate-700">Vendre</span>
                </button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-3 p-6 text-red-500">
                    <i data-lucide="arrow-down-circle"></i><span class="text-xs font-extrabold uppercase text-slate-700">Dépense</span>
                </button>
            </div>

            <h3 class="text-xs font-extrabold text-slate-400 mb-4 uppercase tracking-widest px-1">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-6 tracking-tight">Nouvelle Vente</h2>
                <div class="card border-t-8 border-blue-600">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold text-slate-700"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-slate-900 text-white px-5 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="mt-4 space-y-2 border-t border-dashed border-slate-200 pt-5"></div>
                    
                    <div class="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Argent Reçu</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-32 p-2 rounded-lg border border-slate-200 text-right font-bold">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Monnaie / Reste</span>
                            <span id="change-due" class="font-extrabold text-green-600">0</span>
                        </div>
                        <div class="flex items-center gap-2 mt-3">
                            <input type="checkbox" id="is-credit" class="w-4 h-4">
                            <label for="is-credit" class="text-xs font-bold text-orange-600 uppercase">Vente à crédit (Dette)</label>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase mb-1">Total Net</p>
                            <span class="font-extrabold text-3xl tracking-tighter"><span id="cartT">0</span> <small class="cur text-slate-400 text-lg"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-extrabold uppercase text-sm">Valider</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold tracking-tight">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold text-sm"><i data-lucide="plus"></i></button>
                </div>
                
                <input type="text" id="search-stock" oninput="render()" placeholder="Rechercher un produit..." class="input-f mb-4">

                <div id="stk-form" class="hidden card bg-blue-50/50 border-blue-100">
                    <input type="text" id="p_name" placeholder="Nom de l'article" class="input-f">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité Initiale" class="input-f">
                    <button onclick="addStock()" class="btn-blue mt-2">AJOUTER</button>
                </div>

                <div class="bg-white p-4 rounded-2xl mb-4 border border-slate-100">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Valeur du stock (Achat)</p>
                    <span id="stock-val" class="text-xl font-extrabold">0</span> <small class="cur text-slate-400"></small>
                </div>

                <div id="stkList" class="space-y-3"></div>
            </div>

            <div id="page-debts" class="page">
                <h2 class="text-2xl font-extrabold mb-6 tracking-tight">Gestion des Dettes</h2>
                <div id="debt-list" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6 tracking-tight">Administration</h2>
            <div class="card space-y-3">
                <button onclick="nav('debts')" class="w-full flex items-center justify-between p-4 bg-orange-50 text-orange-700 rounded-2xl font-bold text-sm">Voir les Dettes Clients <i data-lucide="users" class="w-4 h-4"></i></button>
                <button onclick="exportAudit()" class="w-full flex items-center justify-between p-4 bg-slate-50 rounded-2xl font-bold text-sm text-slate-600">Exporter Backup <i data-lucide="download" class="w-4 h-4"></i></button>
                <label for="restore-file" class="w-full flex items-center justify-between p-4 bg-slate-50 rounded-2xl font-bold text-sm text-slate-600 cursor-pointer">Restaurer Backup <i data-lucide="upload" class="w-4 h-4"></i></label>
                <input type="file" id="restore-file" class="hidden" onchange="restoreData(this)">
                <button onclick="logout()" class="w-full p-4 text-red-500 font-bold text-xs uppercase">Effacer tout</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="settings"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_PRO')) || { 
            biz:{}, stk:[], sales:[], expenses:[], debts:{}, prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            installDate: Date.now() 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V14_PRO', JSON.stringify(db)); }
        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function nav(p) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.getElementById('page-' + p).classList.add('active');
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('n-' + p)?.classList.add('active');
            render();
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('logo-preview').src = e.target.result;
                    document.getElementById('logo-preview').style.display = 'block';
                    document.getElementById('logo-icon').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openSetup() { document.getElementById('overlay-screen').style.display = 'block'; }
        
        function saveSetup() {
            db.biz = {
                name: document.getElementById('setup-biz').value,
                user: document.getElementById('setup-user').value,
                phone: document.getElementById('setup-phone').value,
                cur: document.getElementById('setup-cur').value,
                addr: document.getElementById('setup-addr').value,
                logo: document.getElementById('logo-preview').src
            };
            save(); location.reload();
        }

        function addStock() {
            let n = document.getElementById('p_name').value, c = +document.getElementById('p_cost').value, s = +document.getElementById('p_sell').value, q = +document.getElementById('p_qty').value;
            if(!n) return;
            db.stk.push({id:Date.now(), n, c, s, q});
            save(); render(); toggleF('stk-form');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant");
            cart.push({...it, sq:q, st:it.s*q});
            renderCart();
        }

        function renderCart() {
            let t = cart.reduce((a,b) => a + b.st, 0);
            document.getElementById('cartT').innerText = t.toLocaleString();
            document.getElementById('cart').innerHTML = cart.map((c,i) => `
                <div class="flex justify-between text-xs font-bold">
                    <span>${c.n} x${c.sq}</span>
                    <span class="text-red-500" onclick="cart.splice(${i},1);renderCart()">Retirer</span>
                </div>
            `).join('');
        }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0, client = document.getElementById('cl_name').value || "Passager";
            let isCredit = document.getElementById('is-credit').checked;

            cart.forEach(c => {
                let s = db.stk.find(x => x.id == c.id);
                s.q -= c.sq;
                tV += c.st;
                tP += (c.s - c.c) * c.sq;
            });

            if(isCredit) {
                db.debts[client] = (db.debts[client] || 0) + tV;
            } else {
                db.prof += tP;
            }

            db.sales.push({id:Date.now(), cli:client, tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now(), credit:isCredit});
            save(); cart=[]; nav('home');
        }

        function payDebt(client) {
            let amt = +prompt(`Combien paye ${client} ? (Solde: ${db.debts[client]})`);
            if(amt > 0) {
                db.debts[client] -= amt;
                if(db.debts[client] <= 0) delete db.debts[client];
                db.prof += amt; // On considère le remboursement comme du profit encaissé
                save(); render();
            }
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            
            // Stock
            let search = document.getElementById('search-stock').value.toLowerCase();
            let filteredStk = db.stk.filter(i => i.n.toLowerCase().includes(search));
            let totalStockVal = db.stk.reduce((a,b) => a + (b.c * b.q), 0);
            document.getElementById('stock-val').innerText = totalStockVal.toLocaleString();

            document.getElementById('stkList').innerHTML = filteredStk.map((i, idx) => `
                <div class="card flex justify-between items-center p-4">
                    <div><b>${i.n}</b><br><small>${i.s} ${db.biz.cur}</small></div>
                    <div class="flex items-center gap-3">
                        <span class="font-black ${i.q <= 5 ? 'text-red-500' : ''}">${i.q}</span>
                    </div>
                </div>
            `).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');

            // Dettes
            document.getElementById('debt-list').innerHTML = Object.keys(db.debts).map(name => `
                <div class="card flex justify-between items-center border-l-4 border-orange-500">
                    <div><b>${name}</b><br><small class="text-orange-600 font-bold">${db.debts[name]} ${db.biz.cur}</small></div>
                    <button onclick="payDebt('${name}')" class="bg-orange-500 text-white px-3 py-1 rounded-lg text-xs font-bold">Régler</button>
                </div>
            `).join('') || '<p class="text-center text-slate-400 py-10">Aucune dette en cours</p>';

            // Historique
            const hist = [...db.sales, ...db.expenses].sort((a,b) => b.t - a.t).slice(0,10);
            document.getElementById('hist').innerHTML = hist.map(h => `
                <div class="card p-4 flex justify-between items-center ${h.credit ? 'border-l-4 border-orange-400' : ''}">
                    <div><b>${h.cli || h.n}</b><br><small class="text-[9px] uppercase">${h.d}</small></div>
                    <b class="${h.tot ? 'text-blue-600' : 'text-red-500'}">${(h.tot || -h.a).toLocaleString()}</b>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function exportAudit() {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:"application/json"}));
            a.download = `ComptaPro_Backup.json`; a.click();
        }

        function restoreData(input) {
            const r = new FileReader();
            r.onload = e => { db = JSON.parse(e.target.result); save(); location.reload(); };
            r.readAsDataURL(input.files[0]);
        }

        function logout() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
