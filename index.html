<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #2563eb; --accent: #f97316; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        .page { display: none; transition: all 0.4s ease; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card-premium { background: white; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 24px; }
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; font-size: 15px; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; }
        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; }
        .nav-pro button.active { color: white; }
        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
        .low-stock { color: #ef4444 !important; font-weight: 900; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2 id="setup-title" class="text-4xl font-extrabold tracking-tight text-slate-900 mb-8">Profil</h2>
        <div class="space-y-4">
            <input type="file" id="setup-logo" accept="image/*" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">USD</option>
            </select>
            <button onclick="saveSetup()" class="btn-main mt-6">VALIDER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="p-5 sticky top-0 bg-white/80 backdrop-blur-md z-[1100] flex justify-between items-center border-b">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-bold text-slate-400 uppercase">Chargement...</p>
        </div>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8">
                <p class="text-xs font-bold opacity-80 uppercase">Bénéfice Global</p>
                <h2 class="text-4xl font-extrabold mt-2"><span id="valP">0</span> <small class="text-lg cur"></small></h2>
                <div class="grid grid-cols-3 gap-3 mt-8">
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">JOUR</span><span id="repJ" class="text-xs font-bold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">SEMAINE</span><span id="repS" class="text-xs font-bold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">MOIS</span><span id="repM" class="text-xs font-bold">0</span></div>
                </div>
            </div>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium mb-6">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-pro">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center">
                    </div>
                    <button onclick="addCart()" class="w-full py-4 bg-slate-100 rounded-2xl font-bold text-slate-600 mb-6">Ajouter au panier</button>
                    <div id="cart" class="space-y-3 mb-6"></div>
                    <div class="flex justify-between items-center border-t pt-4">
                        <h3 class="text-xl font-black"><span id="cartT">0</span> <small class="cur"></small></h3>
                        <button onclick="doSale()" class="btn-main !w-auto px-8">FACTURER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Stock</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card-premium mb-6">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="P. Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="P. Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-pro">
                    <button onclick="addStock()" class="btn-main">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Compte</h2>
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[9px] font-black text-slate-400 uppercase">ID Licence</p>
                <h3 id="displayID" class="text-2xl font-extrabold text-blue-400"></h3>
            </div>
            <button onclick="openSetup(true)" class="card-premium w-full flex justify-between items-center mb-4 font-bold">Modifier Profil <i data-lucide="chevron-right"></i></button>
            <div class="flex gap-2 mb-6">
                <input type="text" id="activation-key" placeholder="Code PRO" class="input-pro m-0 text-center">
                <button onclick="checkKey()" class="bg-slate-900 text-white px-6 rounded-2xl font-bold">ACTIVER</button>
            </div>
            <button onclick="exportAudit()" class="w-full py-4 border rounded-2xl font-bold mb-2">Sauvegarder Données</button>
            <button onclick="logout()" class="w-full text-red-400 text-xs font-bold underline mt-4">Effacer l'appareil</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user-cog"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_PRO')) || { 
            biz:{}, stk:[], sales:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };
        function save() { localStorage.setItem('CP_V14_PRO', JSON.stringify(db)); }

        function openSetup(edit) {
            document.getElementById('setup-screen').style.display = 'block';
            if(edit) {
                document.getElementById('setup-biz').value = db.biz.name;
                document.getElementById('setup-addr').value = db.biz.addr;
                document.getElementById('setup-phone').value = db.biz.phone;
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }
        function closeSetup() { document.getElementById('setup-screen').style.display = 'none'; }

        function saveSetup() {
            db.biz = {
                name: document.getElementById('setup-biz').value,
                addr: document.getElementById('setup-addr').value,
                phone: document.getElementById('setup-phone').value,
                cur: document.getElementById('setup-cur').value
            };
            save(); location.reload();
        }

        // --- STOCK LOGIC ---
        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            // Render Stock with Edit/Delete and Low Stock Alert
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center py-4 border-l-4 ${i.q <= 1 ? 'border-red-500' : 'border-transparent'}">
                    <div class="flex-1">
                        <b class="text-slate-800">${i.n}</b><br>
                        <small class="font-bold text-[10px] ${i.q <= 1 ? 'low-stock' : 'text-slate-400'} uppercase">
                            Stock: ${i.q} unités
                        </small>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right font-black mr-2">${i.s.toLocaleString()}</div>
                        <button onclick="editStockQty(${i.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                        <button onclick="deleteStockItem(${i.id})" class="p-2 bg-red-50 text-red-500 rounded-lg"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            checkLicense(); lucide.createIcons();
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || !s) return; db.stk.push({id:Date.now(), n, c, s, q}); 
            save(); render(); toggleF('stk-form');
        }

        function editStockQty(id) {
            let item = db.stk.find(x => x.id === id);
            let newQty = prompt(`Nouvelle quantité pour ${item.n}:`, item.q);
            if (newQty !== null && !isNaN(newQty)) {
                item.q = parseInt(newQty);
                save(); render();
            }
        }

        function deleteStockItem(id) {
            if(confirm("Supprimer définitivement cet article du stock ?")) {
                db.stk = db.stk.filter(x => x.id !== id);
                save(); render();
            }
        }

        // --- CART LOGIC ---
        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            
            // Vérifier si déjà dans le panier
            let existing = cart.find(x => x.id == id);
            if(existing) {
                if(existing.sq + q > it.q) return alert("Stock insuffisant !");
                existing.sq += q;
                existing.st = existing.sq * existing.s;
            } else {
                cart.push({...it, sq:q, st:it.s*q});
            }
            renderCart();
        }

        function updateCartQty(id, delta) {
            let item = cart.find(x => x.id === id);
            let stockItem = db.stk.find(x => x.id === id);
            
            if (delta > 0 && item.sq + delta > stockItem.q) return alert("Stock épuisé !");
            
            item.sq += delta;
            if (item.sq <= 0) return removeFromCart(id);
            
            item.st = item.sq * item.s;
            renderCart();
        }

        function removeFromCart(id) {
            cart = cart.filter(x => x.id !== id);
            renderCart();
        }

        function renderCart() {
            let total = 0;
            document.getElementById('cart').innerHTML = cart.map(i => {
                total += i.st;
                return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div class="flex-1">
                        <p class="text-xs font-bold">${i.n}</p>
                        <p class="text-[10px] text-slate-400">${i.s.toLocaleString()} x ${i.sq}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center bg-white rounded-xl border p-1">
                            <button onclick="updateCartQty(${i.id}, -1)" class="w-6 h-6 flex items-center justify-center text-blue-600 font-bold">-</button>
                            <span class="mx-2 text-xs font-black">${i.sq}</span>
                            <button onclick="updateCartQty(${i.id}, 1)" class="w-6 h-6 flex items-center justify-center text-blue-600 font-bold">+</button>
                        </div>
                        <button onclick="removeFromCart(${i.id})" class="text-red-400 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = total.toLocaleString();
            lucide.createIcons();
        }

        // --- SYSTEM ---
        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                s.q -= c.sq; 
                tV += c.st; 
                tP += (c.s-c.c)*c.sq; 
            });
            db.prof += tP;
            db.sales.push({id:Date.now(), cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()});
            save(); cart=[]; render(); nav('home');
        }

        function checkLicense() {
            const now = Date.now(), isOk = db.expiryDate && now < db.expiryDate;
            const badge = document.getElementById('days-badge');
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if(!isOk) {
                badge.innerText = "EXPIRÉ"; badge.className = "px-4 py-1.5 rounded-full text-[10px] font-extrabold bg-red-100 text-red-600";
                document.getElementById('licence-status').innerText = "Mode Consultation";
            } else {
                badge.innerText = "ACTIVE"; badge.className = "px-4 py-1.5 rounded-full text-[10px] font-extrabold bg-green-100 text-green-600";
                document.getElementById('licence-status').innerText = "Licence Pro";
            }
            return isOk;
        }

        function checkKey() {
            const key = document.getElementById('activation-key').value.trim().toUpperCase();
            if(key.includes("PRO")) { 
                db.expiryDate = Date.now() + (30*86400000); 
                save(); location.reload(); 
            }
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            document.getElementById('n-' + id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { if(confirm("Effacer tout ?")) { localStorage.clear(); location.reload(); } }
        function exportAudit() {
            const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Backup.json`; a.click();
        }
    </script>
</body>
</html>
