<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        :root { --primary: #2563eb; --accent: #f97316; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        
        .page { display: none; transition: all 0.4s ease; }
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .glass-header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .card-premium { background: white; border-radius: 30px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 24px; transition: transform 0.2s; }
        
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); border: none; }
        .btn-secondary { background: #f1f5f9; color: #475569; border-radius: 18px; padding: 14px; font-weight: 600; width: 100%; border: 1px solid #e2e8f0; }
        
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; font-size: 15px; transition: all 0.3s; outline: none; margin-bottom: 12px; }
        .input-pro:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }

        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; transition: 0.3s; }
        .nav-pro button.active { color: white; transform: translateY(-5px); }
        .nav-pro button.active i { color: var(--primary); }

        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 40px 25px; display: none; overflow-y: auto; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
        .qty-ctrl { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="mb-8">
            <h2 id="setup-title" class="text-4xl font-extrabold tracking-tight text-slate-900">Bienvenue.</h2>
            <p class="text-slate-500 mt-2">Créez votre profil professionnel.</p>
        </div>
        <div class="space-y-4">
            <input type="text" id="setup-user" placeholder="Votre Nom complet" class="input-pro">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Téléphone / WhatsApp" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA (Franc CFA)</option>
                <option value="GNF">GNF (Franc Guinéen)</option>
                <option value="$">USD (Dollar $)</option>
                <option value="€">EUR (Euro €)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main text-lg mt-6">COMMENCER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="glass-header p-5 sticky top-0 z-[1100] flex justify-between items-center">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 tracking-tight uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">V14 ELITE</p>
        </div>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold tracking-wider"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative">
                <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net</p>
                <h2 class="text-4xl font-extrabold mt-2 tracking-tighter"><span id="valP">0</span> <small class="text-lg cur font-normal opacity-80"></small></h2>
                <div class="grid grid-cols-3 gap-3 mt-8">
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">JOUR</span><span id="repJ" class="text-xs font-extrabold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">SEM.</span><span id="repS" class="text-xs font-extrabold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] block">MOIS</span><span id="repM" class="text-xs font-extrabold">0</span></div>
                </div>
            </div>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-pro">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center m-0">
                    </div>
                    <button onclick="addCart()" class="btn-secondary mb-6">+ Ajouter</button>
                    <div id="cart" class="space-y-3 mb-6"></div>
                    <div class="flex justify-between items-end border-t pt-4">
                        <h3 class="text-2xl font-black"><span id="cartT">0</span> <small class="cur text-sm"></small></h3>
                        <button onclick="doSale()" class="btn-main !w-auto px-10">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Stock</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card-premium mb-6">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-pro">
                    <button onclick="addStock()" class="btn-main">ENREGISTRER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-black text-red-600 mb-6">Dépenses</h2>
                <div class="card-premium">
                    <input type="text" id="exp_name" placeholder="Motif" class="input-pro">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-pro">
                    <button onclick="addExpense()" class="btn-main !bg-red-600">ENREGISTRER</button>
                </div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Compte</h2>
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[9px] text-slate-400 font-black uppercase mb-1">ID Licence</p>
                <h3 id="displayID" class="text-xl font-bold text-blue-400"></h3>
            </div>
            <button onclick="exportAudit()" class="btn-secondary mb-4 flex items-center justify-center gap-2"><i data-lucide="download"></i> Sauvegarder</button>
            <button onclick="logout()" class="w-full text-red-500 font-bold mt-10">Déconnexion</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="settings"></i>Compte</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_ELITE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: Date.now() + (30*86400000) 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };
        function save() { localStorage.setItem('CP_V14_ELITE', JSON.stringify(db)); }

        // --- GESTION STOCK ---
        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n) return; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }
        function updateStkQty(id, delta) {
            let it = db.stk.find(x => x.id == id);
            it.q = Math.max(0, it.q + delta);
            save(); render();
        }
        function deleteStk(id) {
            if(confirm("Supprimer cet article définitivement ?")) {
                db.stk = db.stk.filter(x => x.id != id);
                save(); render();
            }
        }

        // --- GESTION PANIER ---
        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Quantité insuffisante en stock !");
            
            let existing = cart.find(x => x.id == id);
            if(existing) existing.sq += q; else cart.push({...it, sq:q});
            renderCart();
        }
        function updateCartQty(index, delta) {
            cart[index].sq += delta;
            if(cart[index].sq <= 0) cart.splice(index, 1);
            renderCart();
        }
        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }
        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map((i, index) => { 
                let itemTotal = i.s * i.sq;
                t += itemTotal;
                return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div class="flex-1">
                        <b class="text-xs text-slate-800">${i.n}</b><br>
                        <span class="text-[10px] font-bold text-blue-600">${itemTotal.toLocaleString()} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateCartQty(${index}, -1)" class="qty-ctrl bg-white border text-slate-400">-</button>
                        <span class="text-xs font-bold w-4 text-center">${i.sq}</span>
                        <button onclick="updateCartQty(${index}, 1)" class="qty-ctrl bg-white border text-slate-400">+</button>
                        <button onclick="removeFromCart(${index})" class="qty-ctrl bg-red-50 text-red-500 ml-2"><i data-lucide="trash-2" class="w-3"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        // --- RENDER GLOBAL ---
        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;

            // Stock avec modifications
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center py-4">
                    <div>
                        <b class="text-slate-800">${i.n}</b><br>
                        <small class="font-bold text-[10px] uppercase ${i.q <= 1 ? 'text-red-600 font-black' : 'text-slate-400'}">
                            STOCK: ${i.q}
                        </small>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateStkQty(${i.id}, -1)" class="qty-ctrl bg-slate-100">-</button>
                        <button onclick="updateStkQty(${i.id}, 1)" class="qty-ctrl bg-slate-100">+</button>
                        <button onclick="deleteStk(${i.id})" class="qty-ctrl bg-red-50 text-red-500"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                </div>`).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            // Historique
            const hist = [...db.sales, ...db.expenses].sort((a,b) => b.id - a.id).slice(0, 5);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center">
                    <div><b>${i.cli || i.n}</b><br><small class="text-slate-400">${i.d}</small></div>
                    <b class="${i.tot ? 'text-blue-600' : 'text-red-500'}">${i.tot ? '+' : '-'}${(i.tot || i.a).toLocaleString()}</b>
                </div>`).join('');

            checkLicense();
            lucide.createIcons();
        }

        // --- AUTRES ---
        function doSale() {
            if(!cart.length) return;
            let tV=0, tP=0;
            cart.forEach(c => { 
                let s = db.stk.find(x => x.id == c.id); 
                s.q -= c.sq; 
                tV += (c.s * c.sq); 
                tP += (c.s - c.c) * c.sq; 
            });
            db.prof += tP;
            db.sales.push({id:Date.now(), cli:document.getElementById('cl_name').value || "Client", tot:tV, d:new Date().toLocaleDateString()});
            save(); cart=[]; render(); nav('home');
        }
        function addExpense() {
            let n=document.getElementById('exp_name').value, a=+document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.prof -= a; db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleDateString()});
            save(); render(); nav('home');
        }
        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const days = Math.ceil((db.expiryDate - Date.now())/86400000);
            badge.innerText = days + " JOURS";
            badge.className = `px-4 py-1.5 rounded-full text-[10px] font-extrabold ${days < 5 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`;
        }
        function nav(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function openSetup(isEdit) { document.getElementById('setup-screen').style.display='block'; }
        function saveSetup() {
            db.biz = { name: document.getElementById('setup-biz').value, cur: document.getElementById('setup-cur').value };
            save(); location.reload();
        }
        function exportAudit() {
            const blob = new Blob([JSON.stringify(db)], {type:"application/json"});
            const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download="compta_backup.json"; a.click();
        }
        function logout() { if(confirm("Effacer tout ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
