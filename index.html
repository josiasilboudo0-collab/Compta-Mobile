<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-premium { background: white; border-radius: 25px; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); padding: 20px; }
        .btn-main { background: var(--primary); color: white; border-radius: 20px; padding: 18px; font-weight: 700; width: 100%; border: none; }
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 16px; padding: 16px; outline: none; margin-bottom: 12px; }
        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 25px; height: 75px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; }
        .nav-pro button.active { color: white; }
        .locked { filter: blur(8px); pointer-events: none; opacity: 0.5; }
        .ctrl-btn { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="p-5 sticky top-0 bg-white/80 backdrop-blur-md z-[1100] flex justify-between items-center border-b">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">V14 ELITE</p>
        </div>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold tracking-wider"></div>
    </header>

    <main class="p-6">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[40px] text-white shadow-2xl mb-6">
                <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Bénéfice Net</p>
                <h2 class="text-4xl font-extrabold mt-2 tracking-tighter"><span id="valP">0</span> <small class="text-lg cur font-normal opacity-80"></small></h2>
                <div class="grid grid-cols-3 gap-3 mt-8">
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] font-black block">JOUR</span><span id="repJ" class="text-xs font-extrabold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] font-black block">SEM.</span><span id="repS" class="text-xs font-extrabold">0</span></div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center"><span class="text-[9px] font-black block">MOIS</span><span id="repM" class="text-xs font-extrabold">0</span></div>
                </div>
            </div>

            <button onclick="nav('expense')" class="w-full mb-6 p-4 bg-red-50 border border-red-100 rounded-3xl flex items-center justify-between text-red-600 font-bold">
                <div class="flex items-center gap-3"><i data-lucide="trending-down"></i> Enregistrer une Charge</div>
                <i data-lucide="plus" class="w-5"></i>
            </button>

            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Activités Récentes</h3>
            <div id="hist" class="space-y-4"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Caisse</h2>
                <div class="card-premium">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-pro">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-pro flex-1"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center">
                    </div>
                    <button onclick="addCart()" class="w-full p-4 bg-slate-100 rounded-2xl font-bold mb-4">+ Ajouter</button>
                    <div id="cart" class="space-y-2 mb-4"></div>
                    <div class="flex justify-between items-center border-t pt-4">
                        <h3 class="text-xl font-black"><span id="cartT">0</span> <small class="cur"></small></h3>
                        <button onclick="doSale()" class="btn-main !w-auto px-8">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card-premium mb-6">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-3"><input type="number" id="p_cost" placeholder="Prix Achat" class="input-pro"><input type="number" id="p_sell" placeholder="Prix Vente" class="input-pro"></div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-pro">
                    <button onclick="addStock()" class="btn-main">AJOUTER AU STOCK</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-black text-red-600 mb-6">Nouvelle Charge</h2>
                <div class="card-premium">
                    <input type="text" id="exp_name" placeholder="Motif" class="input-pro">
                    <input type="number" id="exp_amt" placeholder="Montant" class="input-pro">
                    <button onclick="addExpense()" class="btn-main !bg-red-600">ENREGISTRER</button>
                </div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Admin</h2>
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[9px] text-slate-400 font-bold uppercase mb-1">ID Licence Unique</p>
                <div class="flex justify-between items-center">
                    <h3 id="displayID" class="text-2xl font-bold text-blue-400 tracking-wider"></h3>
                    <button onclick="copyID()" class="p-2 bg-white/10 rounded-lg"><i data-lucide="copy" class="w-4"></i></button>
                </div>
            </div>

            <div class="card-premium space-y-3 mb-6">
                <button onclick="window.open('https://qaasxtqf.mychariow.shop/abonnement-pro-compta-mobile/checkout')" class="w-full p-4 bg-orange-50 text-orange-600 border border-orange-100 rounded-2xl font-bold flex items-center justify-center gap-2">
                    <i data-lucide="credit-card"></i> Payer sur Chariow
                </button>
                <button onclick="payWhatsApp()" class="w-full p-4 bg-green-50 text-green-600 border border-green-100 rounded-2xl font-bold flex items-center justify-center gap-2">
                    <i data-lucide="message-circle"></i> WhatsApp (+226 66566140)
                </button>
                <div class="relative">
                    <input type="text" id="lic-code" placeholder="Code PRO-XXXX" class="input-pro !mb-0 text-center font-black">
                    <button onclick="activateLic()" class="absolute right-2 top-2 bottom-2 bg-blue-600 text-white px-4 rounded-xl text-xs font-bold">Activer</button>
                </div>
            </div>

            <button onclick="genMonthlyReport()" class="card-premium w-full flex items-center justify-between mb-4">
                <span class="font-bold">Bilan Mensuel Global</span>
                <i data-lucide="download" class="text-indigo-400"></i>
            </button>

            <button onclick="logout()" class="w-full p-5 text-red-400 font-bold text-xs uppercase tracking-widest mt-4">Déconnexion</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="box"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="shield"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_ELITE')) || { 
            biz:{name:"Ma Boutique"}, stk:[], sales:[], expenses:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        window.onload = () => { render(); };
        function save() { localStorage.setItem('CP_V14_ELITE', JSON.stringify(db)); }

        // --- FACTURE PDF CLIENT ---
        function genInvoice(saleId) {
            const sale = db.sales.find(s => s.id === saleId);
            if (!sale) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            doc.setFont(undefined, 'bold').setFontSize(22).text(db.biz.name.toUpperCase(), 105, 20, {align:'center'});
            doc.setFontSize(10).text("REÇU DE VENTE", 105, 28, {align:'center'});
            doc.line(20, 32, 190, 32);

            // Infos
            doc.setFontSize(11).text(`Client : ${sale.cli}`, 20, 45);
            doc.text(`Date : ${sale.d}`, 20, 52);
            doc.text(`N° Facture : ${sale.id}`, 190, 45, {align:'right'});

            // Table
            doc.autoTable({
                startY: 60,
                head: [['Article', 'Prix Uté', 'Qté', 'Total']],
                body: sale.items.map(i => [i.n, i.s, i.sq, i.st]),
                foot: [['', '', 'NET À PAYER', `${sale.tot} ${db.biz.cur || 'FCFA'}`]],
                theme: 'striped',
                headStyles: {fillColor: [37, 99, 235]}
            });

            doc.text("Merci pour votre confiance !", 105, doc.lastAutoTable.finalY + 20, {align:'center'});
            doc.save(`Facture_${sale.cli}_${sale.id}.pdf`);
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            document.getElementById('displayID').innerText = db.licenseID;
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur || "FCFA");
            document.getElementById('valP').innerText = Math.round(db.prof).toLocaleString();

            // Historique avec Bouton Facture
            const combined = [
                ...db.sales.map(s => ({...s, type:'sale'})), 
                ...db.expenses.map(e => ({...e, type:'exp', tot:e.a, cli:e.n}))
            ];
            const hist = combined.sort((a,b) => b.id - a.id).slice(0, 15);
            
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card-premium flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        ${i.type === 'sale' ? 
                            `<button onclick="genInvoice(${i.id})" class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="download" class="w-4"></i></button>` :
                            `<div class="p-2 bg-red-50 text-red-500 rounded-lg"><i data-lucide="trending-down" class="w-4"></i></div>`
                        }
                        <div><b class="text-xs">${i.cli}</b><br><small class="text-[9px] text-slate-400 uppercase">${i.d}</small></div>
                    </div>
                    <b class="text-sm ${i.type=='exp'?'text-red-500':'text-blue-600'}">${i.type=='exp'?'-':'+'}${i.tot.toLocaleString()}</b>
                </div>
            `).join('');

            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center">
                    <div><b>${i.n}</b><br><small class="text-slate-400">Restant: ${i.q}</small></div>
                    <div class="flex gap-2">
                        <button onclick="adjStk(${i.id}, 1)" class="ctrl-btn bg-slate-100"><i data-lucide="plus" class="w-4"></i></button>
                        <button onclick="delStk(${i.id})" class="ctrl-btn bg-red-50 text-red-500"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            checkLicense(); updateStats(); lucide.createIcons();
        }

        // --- AUTRES FONCTIONS ---
        function addCart() { 
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            cart.push({...it, sq:q, st:it.s*q}); 
            renderCart(); 
        }
        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map(i => { t+=i.st; return `<div class="text-xs flex justify-between"><span>${i.n} x${i.sq}</span><span>${i.st}</span></div>`}).join('');
            document.getElementById('cartT').innerText = t;
        }
        function doSale() {
            if(!cart.length) return;
            let tV=0, tP=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            const newSale = {id:Date.now(), cli:document.getElementById('cl_name').value || "Client Passager", tot:tV, d:new Date().toLocaleString(), t:Date.now(), tp:tP, items:[...cart]};
            db.sales.push(newSale);
            save(); cart=[]; render(); nav('home');
        }
        function addExpense() {
            let n = document.getElementById('exp_name').value, a = +document.getElementById('exp_amt').value;
            if(!n || !a) return;
            db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now()});
            db.prof -= a; save(); render(); nav('home');
        }
        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n) return; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }
        function activateLic() {
            const code = document.getElementById('lic-code').value.toUpperCase();
            if(code.startsWith("PRO-")) {
                db.expiryDate = (db.expiryDate > Date.now() ? db.expiryDate : Date.now()) + (30 * 24 * 60 * 60 * 1000);
                save(); alert("Activé !"); render();
            }
        }
        function checkLicense() {
            const badge = document.getElementById('days-badge');
            if(!db.expiryDate) { badge.innerText="DEMO"; badge.className="px-4 py-1.5 rounded-full text-[10px] bg-red-100 text-red-500 font-bold"; document.getElementById('lock-zone').classList.add('locked'); return; }
            const days = Math.ceil((db.expiryDate - Date.now()) / 86400000);
            badge.innerText = days + " JOURS";
            badge.className = "px-4 py-1.5 rounded-full text-[10px] bg-green-100 text-green-600 font-bold";
            document.getElementById('lock-zone').classList.toggle('locked', days <= 0);
        }
        function updateStats() {
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.t) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
        }
        function nav(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active')); document.getElementById('page-'+id).classList.add('active'); document.getElementById('n-'+id)?.classList.add('active'); lucide.createIcons(); }
        function toggleF(id){ document.getElementById(id).classList.toggle('hidden'); }
        function adjStk(id, d){ let i=db.stk.find(x=>x.id==id); i.q+=d; save(); render(); }
        function delStk(id){ db.stk=db.stk.filter(x=>x.id!=id); save(); render(); }
        function payWhatsApp() { window.open(`https://wa.me/22666566140?text=Activez%20ma%20licence%20:%20${db.licenseID}`); }
        function copyID(){ navigator.clipboard.writeText(db.licenseID); alert("Copié"); }
        function logout(){ if(confirm("Supprimer tout ?")){ localStorage.clear(); location.reload(); }}
        function genMonthlyReport() { const { jsPDF } = window.jspdf; const doc = new jsPDF(); doc.text("Rapport Mensuel", 20, 20); doc.autoTable({head:[['Date','Client','Total']], body:db.sales.map(s=>[s.d, s.cli, s.tot])}); doc.save("Rapport.pdf"); }
    </script>
</body>
</html>
