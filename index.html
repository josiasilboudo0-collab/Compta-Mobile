<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V13</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .card { background: white; border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.03); margin-bottom: 16px; transition: all 0.3s ease; }
        .card:active { transform: scale(0.98); }
        
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; transition: all 0.2s; background: #FDFDFD; font-size: 15px; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); background: white; }
        
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 18px; border-radius: 18px; font-weight: 700; width: 100%; border: none; shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; transition: 0.5s; }
        
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 75px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
        nav button.active { color: #2563EB; transform: translateY(-5px); }
        nav button.active i { background: rgba(37, 99, 235, 0.1); padding: 8px; border-radius: 12px; }

        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 30px; }
        .badge-pro { background: linear-gradient(90deg, #F59E0B, #D97706); color: white; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 900; }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <div class="max-w-md mx-auto">
            <h2 id="setup-title" class="text-4xl font-extrabold text-slate-900 mb-2">ComptaPro <span class="text-blue-600 italic text-2xl">Elite</span></h2>
            <p class="text-slate-500 mb-8 font-medium">Configurez votre identité commerciale.</p>
            <div class="space-y-4">
                <div class="bg-blue-50 p-6 rounded-3xl border border-blue-100 text-center border-dashed">
                    <label class="text-xs font-bold uppercase text-blue-600 mb-2 block">Logo de l'entreprise</label>
                    <input type="file" id="setup-logo" accept="image/*" class="hidden">
                    <button onclick="document.getElementById('setup-logo').click()" class="bg-white px-4 py-2 rounded-xl shadow-sm border text-sm font-semibold text-slate-600">Choisir une image</button>
                </div>
                <input type="text" id="setup-user" placeholder="Votre Nom (Propriétaire)" class="input-f">
                <input type="text" id="setup-biz" placeholder="Nom de la Boutique" class="input-f">
                <input type="text" id="setup-addr" placeholder="Adresse Physique" class="input-f">
                <input type="text" id="setup-phone" placeholder="Contact Téléphone" class="input-f">
                <select id="setup-cur" class="input-f">
                    <option value="FCFA">Devise : FCFA</option>
                    <option value="GNF">Devise : GNF</option>
                    <option value="$">Devise : Dollar ($)</option>
                    <option value="€">Devise : Euro (€)</option>
                </select>
                <button onclick="saveSetup()" class="btn-blue text-lg shadow-xl mt-4">COMMENCER</button>
                <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm mt-4 hidden">ANNULER</button>
            </div>
        </div>
    </div>

    <header class="p-6 bg-white/80 backdrop-blur-md sticky top-0 z-[1100] border-b border-slate-100 flex justify-between items-center">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl tracking-tight text-slate-800 uppercase">ComptaPro</h1>
            <div class="flex items-center gap-2">
                <span class="badge-pro">ULTIMATE V13</span>
                <p id="licence-status" class="text-[9px] font-bold text-slate-400 uppercase tracking-widest"></p>
            </div>
        </div>
        <div id="days-badge" class="px-4 py-1.5 rounded-full text-[10px] font-extrabold shadow-sm border"></div>
    </header>

    <main class="p-5 max-w-lg mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-blue-600 rounded-full blur-[80px] opacity-30"></div>
                <p class="text-xs font-bold opacity-60 uppercase tracking-widest mb-1">Caisse Actuelle</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-8"><span id="valP">0</span> <small class="text-blue-400 text-lg cur"></small></h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/5 backdrop-blur-lg p-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] font-bold opacity-50 uppercase mb-1">Jour</p>
                        <span id="repJ" class="text-sm font-extrabold">0</span>
                    </div>
                    <div class="bg-white/5 backdrop-blur-lg p-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] font-bold opacity-50 uppercase mb-1">Sem.</p>
                        <span id="repS" class="text-sm font-extrabold">0</span>
                    </div>
                    <div class="bg-white/5 backdrop-blur-lg p-3 rounded-2xl border border-white/10">
                        <p class="text-[9px] font-bold opacity-50 uppercase mb-1">Mois</p>
                        <span id="repM" class="text-sm font-extrabold">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="bg-white border border-slate-100 p-5 rounded-[30px] flex flex-col items-center gap-3 shadow-sm active:bg-blue-50 transition-all">
                    <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600"><i data-lucide="shopping-bag"></i></div>
                    <span class="text-xs font-extrabold uppercase text-slate-600">Vendre</span>
                </button>
                <button onclick="nav('expense')" class="bg-white border border-slate-100 p-5 rounded-[30px] flex flex-col items-center gap-3 shadow-sm active:bg-red-50 transition-all">
                    <div class="w-12 h-12 bg-red-100 rounded-2xl flex items-center justify-center text-red-600"><i data-lucide="arrow-down-right"></i></div>
                    <span class="text-xs font-extrabold uppercase text-slate-600">Dépense</span>
                </button>
            </div>

            <h3 class="text-xs font-extrabold text-slate-400 mb-4 uppercase tracking-widest px-1">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <div class="flex items-center gap-3 mb-6">
                    <button onclick="nav('home')" class="p-2 bg-white rounded-xl border"><i data-lucide="chevron-left"></i></button>
                    <h2 class="text-2xl font-extrabold">Caisse</h2>
                </div>
                <div class="card p-6 border-t-8 border-blue-600">
                    <input type="text" id="vendeur" placeholder="Vendeur par défaut" class="input-f">
                    <input type="text" id="cl_name" placeholder="Client (Optionnel)" class="input-f">
                    
                    <div class="flex gap-2 items-end mb-4 bg-slate-50 p-4 rounded-2xl border border-dashed border-slate-300">
                        <div class="flex-1">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Article</label>
                            <select id="sel_p" class="w-full bg-transparent font-bold text-slate-700 outline-none"></select>
                        </div>
                        <div class="w-20">
                            <label class="text-[10px] font-black uppercase text-slate-400 ml-1">Qté</label>
                            <input type="number" id="sel_q" value="1" class="w-full bg-transparent font-bold text-center outline-none">
                        </div>
                        <button onclick="addCart()" class="bg-slate-900 text-white p-3 rounded-xl shadow-lg active:scale-90"><i data-lucide="plus" class="w-5 h-5"></i></button>
                    </div>

                    <div id="cart" class="space-y-2 mb-6"></div>

                    <div class="pt-6 border-t border-slate-100 flex justify-between items-center">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total à payer</p>
                            <span class="text-2xl font-extrabold text-slate-900"><span id="cartT">0</span> <small class="cur text-sm"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-blue-600 text-white px-8 py-4 rounded-2xl font-extrabold shadow-lg shadow-blue-200 active:scale-95 transition-all">VALIDER</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold text-slate-800">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-slate-900 text-white px-5 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-2 shadow-lg"><i data-lucide="plus" class="w-4 h-4"></i> Ajouter</button>
                </div>

                <div id="stk-form" class="hidden card p-6 bg-blue-50 border-blue-100">
                    <input type="text" id="p_name" placeholder="Désignation du produit" class="input-f">
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <div>
                            <label class="text-[10px] font-bold uppercase text-slate-400 ml-1">Prix Achat</label>
                            <input type="number" id="p_cost" class="input-f">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold uppercase text-slate-400 ml-1">Prix Vente</label>
                            <input type="number" id="p_sell" class="input-f">
                        </div>
                    </div>
                    <label class="text-[10px] font-bold uppercase text-slate-400 ml-1">Quantité Initiale</label>
                    <input type="number" id="p_qty" class="input-f">
                    <button onclick="addStock()" class="btn-blue shadow-lg">ENREGISTRER LE PRODUIT</button>
                </div>

                <div id="stkList" class="space-y-3 mt-4"></div>
            </div>

            <div id="page-expense" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Sortie de Caisse</h2>
                <div class="card p-6 border-t-8 border-red-500">
                    <input type="text" id="exp_name" placeholder="Motif (Loyer, Salaire, Divers...)" class="input-f">
                    <input type="number" id="exp_amt" placeholder="Montant retiré" class="input-f">
                    <button onclick="addExpense()" class="w-full bg-red-600 text-white p-4 rounded-2xl font-extrabold shadow-lg shadow-red-100">ENREGISTRER LA DÉPENSE</button>
                </div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6">Paramètres</h2>
            
            <div class="bg-slate-900 rounded-[30px] p-6 text-white mb-6">
                <p class="text-[10px] font-bold opacity-50 uppercase mb-2">ID Appareil (Licence)</p>
                <div class="flex justify-between items-center">
                    <h3 id="displayID" class="text-2xl font-mono font-bold text-blue-400"></h3>
                    <button onclick="copyID()" class="bg-white/10 p-2 rounded-xl"><i data-lucide="copy" class="w-5 h-5"></i></button>
                </div>
            </div>

            <div class="card p-6 border-2 border-orange-100 bg-orange-50/30 text-center">
                <h3 class="font-extrabold text-sm mb-4 text-orange-700 uppercase tracking-tighter">Abonnement Professionnel</h3>
                <div class="flex flex-col gap-2">
                    <button onclick="contactWA()" class="bg-[#25D366] text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-2"><i data-lucide="phone"></i> WhatsApp Pay</button>
                    <button onclick="openChariow()" class="bg-orange-500 text-white p-4 rounded-2xl font-bold flex items-center justify-center gap-2"><i data-lucide="credit-card"></i> Paiement en Ligne</button>
                </div>
                <div class="mt-4 pt-4 border-t border-orange-100">
                    <input type="text" id="activation-key" placeholder="Code Activation" class="input-f text-center font-mono uppercase bg-white">
                    <button onclick="checkKey()" class="w-full bg-slate-800 text-white p-3 rounded-xl font-bold text-xs uppercase">Activer la Licence</button>
                </div>
            </div>

            <button onclick="openSetup(true)" class="card w-full flex items-center justify-between p-5 font-bold text-slate-700">
                <div class="flex items-center gap-4"><i data-lucide="building" class="text-blue-600"></i> Profil Entreprise</div>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
            </button>

            <div class="card p-6 space-y-4">
                <h3 class="font-extrabold text-xs text-slate-400 uppercase">Base de données</h3>
                <button onclick="exportAudit()" class="w-full flex items-center gap-3 p-3 bg-slate-50 rounded-2xl font-bold text-sm text-slate-600"><i data-lucide="download" class="w-4 h-4"></i> Exporter Backup</button>
                <button onclick="resetProfitAudit()" class="w-full p-3 text-red-500 font-extrabold text-[10px] uppercase border border-red-50 rounded-2xl">Clôturer la Caisse</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-grid"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="settings-2"></i>Admin</button>
    </nav>

    <script>
        // Logique de données conservée et améliorée
        let db = JSON.parse(localStorage.getItem('CP_V13_ELITE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V13_ELITE', JSON.stringify(db)); }

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-title').innerText = "Modifier Profil";
                document.getElementById('setup-user').value = db.biz.user;
                document.getElementById('setup-biz').value = db.biz.name;
                document.getElementById('setup-addr').value = db.biz.addr;
                document.getElementById('setup-phone').value = db.biz.phone;
                document.getElementById('setup-cur').value = db.biz.cur;
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

        async function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return;
            const logoFile = document.getElementById('setup-logo').files[0];
            const finalize = (logoData) => {
                db.biz = { user: document.getElementById('setup-user').value, name: bizName, addr: document.getElementById('setup-addr').value, phone: document.getElementById('setup-phone').value, cur: document.getElementById('setup-cur').value, logo: logoData || db.biz.logo || "" };
                save(); location.reload();
            };
            if (logoFile) { let r = new FileReader(); r.onloadend = () => finalize(r.result); r.readAsDataURL(logoFile); } else finalize();
        }

        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const now = Date.now();
            const isOk = db.expiryDate && now < db.expiryDate;
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if(!isOk) { badge.innerText = "LICENCE EXPIRÉE"; badge.className = "px-4 py-1.5 rounded-full text-[10px] font-black bg-red-50 text-red-600 border-red-100"; }
            else { const d = Math.ceil((db.expiryDate-now)/86400000); badge.innerText = d + " JOURS RESTANTS"; badge.className = "px-4 py-1.5 rounded-full text-[10px] font-black bg-blue-50 text-blue-600 border-blue-100"; }
            return isOk;
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            // Historique Design
            const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = hist.map(i => `
                <div class="card p-4 flex justify-between items-center bg-white border-slate-100">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${i.isExp?'bg-red-50 text-red-500':'bg-green-50 text-green-500'}">
                            <i data-lucide="${i.isExp?'arrow-down-right':'arrow-up-right'}" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="font-extrabold text-slate-800 text-sm">${i.cli || i.n}</p>
                            <p class="text-[10px] text-slate-400 font-bold">${i.d}</p>
                        </div>
                    </div>
                    <b class="text-sm ${i.isExp?'text-red-500':'text-blue-600'}">${(i.tot || -i.a || -i.montant).toLocaleString()}</b>
                </div>
            `).join('');
            
            // Inventaire Design
            document.getElementById('stkList').innerHTML = db.stk.map((i, index) => `
                <div class="card p-5 flex justify-between items-center bg-white">
                    <div class="flex-1">
                        <b class="text-sm font-extrabold block text-slate-800 mb-1">${i.n}</b>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-black bg-blue-50 text-blue-600 px-2 py-0.5 rounded-md">${i.s} ${db.biz.cur}</span>
                            ${i.q < 5 ? '<span class="text-[10px] font-black bg-red-50 text-red-500 px-2 py-0.5 rounded-md">STOCK BAS</span>' : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border">
                        <button onclick="updateQty(${index}, -1)" class="w-8 h-8 bg-white shadow-sm border rounded-xl flex items-center justify-center text-slate-400 font-black hover:text-red-500">-</button>
                        <span class="font-extrabold text-sm w-6 text-center text-slate-700">${i.q}</span>
                        <button onclick="updateQty(${index}, 1)" class="w-8 h-8 bg-white shadow-sm border rounded-xl flex items-center justify-center text-slate-400 font-black hover:text-blue-500">+</button>
                    </div>
                    <button onclick="removeStock(${index})" class="ml-4 text-slate-200 hover:text-red-400 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                </div>`).join('');
            
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q} dispo)</option>`).join('');
            
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.t) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            
            checkLicense(); lucide.createIcons();
        }

        // --- Fonctions d'Action ---
        function updateQty(idx, v) { if(db.stk[idx].q + v >= 0) { db.stk[idx].q += v; save(); render(); } }
        function removeStock(idx) { if(confirm("Supprimer l'article ?")) { db.stk.splice(idx, 1); save(); render(); } }
        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n) return; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            cart.push({...it, sq:q, st:it.s*q}); renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map((i, idx) => { t += i.st; return `
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-2xl border-l-4 border-blue-500">
                    <div><b class="text-xs text-slate-700">${i.n}</b><p class="text-[10px] text-slate-400 font-bold">Qté: ${i.sq} × ${i.s}</p></div>
                    <div class="flex items-center gap-3">
                        <b class="text-xs">${i.st.toLocaleString()}</b>
                        <button onclick="cart.splice(${idx},1);renderCart()" class="text-slate-300"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                    </div>
                </div>`; }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            db.sales.push({id:Date.now(), ven:document.getElementById('vendeur').value || "Gérant", cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()});
            save(); cart=[]; render(); nav('home');
        }

        function addExpense() {
            let n=document.getElementById('exp_name').value, a=+document.getElementById('exp_amt').value;
            if(!n || !a) return; db.prof -= a; db.expenses.push({id:Date.now(), n, a, d:new Date().toLocaleString(), t:Date.now(), isExp:true});
            save(); render(); nav('home');
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié !"); }
        function contactWA() { window.open(`https://wa.me/22666566140?text=Paiement%20Elite%20ID:${db.licenseID}`, '_blank'); }
        function exportAudit() {
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Compta_Elite_Backup.json`; a.click();
        }
        function resetProfitAudit() { if(confirm("Voulez-vous clôturer la caisse et remettre le solde à zéro ?")) { db.resets.push({id:Date.now(), n:"CLÔTURE DE CAISSE", montant:db.prof, d:new Date().toLocaleString()}); db.prof = 0; save(); render(); } }

        function checkKey() {
            const input = document.getElementById('activation-key').value.trim().toUpperCase();
            const date = new Date();
            const formula = (parseInt(db.licenseID.replace(/\D/g, '')) * 7) + date.getDate() + (date.getMonth() + 1);
            if (input === "PRO-" + formula) {
                db.expiryDate = (db.expiryDate > Date.now() ? db.expiryDate : Date.now()) + (30*86400000);
                save(); alert("Version ELITE activée pour 30 jours !"); location.reload();
            } else { alert("Code incorrect."); }
        }
    </script>
</body>
</html>
