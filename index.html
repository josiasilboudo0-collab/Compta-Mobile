<script>
    // INITIALISATION DE LA BASE DE DONNÉES AVEC LES NOUVEAUX PARAMÈTRES
    let db = JSON.parse(localStorage.getItem('CP_V13_ULTIMATE')) || { 
        biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
        licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
        expiryDate: null,
        installDate: Date.now() // Enregistre la date de première installation
    };
    let cart = [];

    function save() { localStorage.setItem('CP_V13_ULTIMATE', JSON.stringify(db)); }

    window.onload = () => { 
        if (!db.biz.name) openSetup(false); 
        
        // Système de décompte de 2 jours (172800000 ms = 48h)
        if (!db.expiryDate) {
            db.expiryDate = db.installDate + 172800000; 
            save();
        }
        
        render(); 
        // Lancer la boucle de clignotement pour le stock bas
        setInterval(blinkStock, 800);
    };

    // --- 1. & 2. GESTION LICENCE ET BLOCAGE ---
    function checkLicense() {
        const now = Date.now();
        const badge = document.getElementById('days-badge');
        const isOk = db.expiryDate && now < db.expiryDate;
        
        // Bloque les zones sensibles si la licence est expirée
        document.getElementById('lock-zone').classList.toggle('locked', !isOk);
        
        if(!isOk) {
            badge.innerText = "ACCÈS BLOQUÉ"; 
            badge.className = "badge-status bg-red-600 text-white animate-pulse";
            // Si on est sur une page autre que l'admin, on redirige vers l'admin pour payer
            if (document.querySelector('.page.active').id !== 'page-pro') {
                nav('pro');
                alert("Votre essai de 2 jours est terminé. Veuillez activer la version Pro.");
            }
        } else {
            const days = Math.ceil((db.expiryDate - now) / 86400000);
            const hours = Math.ceil((db.expiryDate - now) / 3600000);
            
            if (days > 1) {
                badge.innerText = days + " JOURS RESTANTS";
                badge.className = "badge-status bg-green-100 text-green-600 border border-green-200";
            } else {
                badge.innerText = hours + "H RESTANTES";
                badge.className = "badge-status bg-orange-100 text-orange-600 border border-orange-200 animate-bounce";
            }
        }
        return isOk;
    }

    // --- 3. ALERTE STOCK BAS CLIGNOTANTE ---
    function blinkStock() {
        const stocks = document.querySelectorAll('.low-stock-alert');
        stocks.forEach(el => {
            el.style.visibility = (el.style.visibility === 'hidden' ? 'visible' : 'hidden');
        });
    }

    // --- 4. CALCUL DE LA MONNAIE ---
    // Ajout d'une fonction pour mettre à jour la monnaie en temps réel
    function updateMonnaie() {
        const total = parseFloat(document.getElementById('cartT').innerText.replace(/\s/g, '')) || 0;
        const recu = parseFloat(document.getElementById('client_cash').value) || 0;
        const monnaieElt = document.getElementById('monnaie_result');
        
        if (recu > 0) {
            const reste = recu - total;
            if (reste >= 0) {
                monnaieElt.innerHTML = `À rendre : <b class="text-green-600">${reste.toLocaleString()} ${db.biz.cur}</b>`;
            } else {
                monnaieElt.innerHTML = `<b class="text-red-500">Il manque ${(total - recu).toLocaleString()}</b>`;
            }
        } else {
            monnaieElt.innerText = "En attente du montant...";
        }
    }

    // --- MODIFICATION DU RENDU DU STOCK (Pour inclure le clignotement) ---
    function render() {
        document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
        document.getElementById('valP').innerText = db.prof.toLocaleString();
        document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
        document.getElementById('displayID').innerText = db.licenseID;

        // Inventaire avec alerte visuelle si stock < 5
        document.getElementById('stkList').innerHTML = db.stk.map((i, index) => {
            const isLow = i.q <= 5;
            return `
                <div class="card flex justify-between items-center p-4 ${isLow ? 'border-2 border-red-200' : ''}">
                    <div class="flex-1">
                        <b class="text-sm block text-slate-800">${i.n} ${isLow ? '<span class="low-stock-alert text-red-600 text-[10px] font-black">⚠️ BAS !</span>' : ''}</b>
                        <span class="text-blue-600 font-extrabold text-[10px] bg-blue-50 px-2 py-1 rounded-lg mt-1 inline-block">${i.s} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-100 p-2 rounded-2xl border border-slate-200">
                        <button onclick="updateQty(${index}, -1)" class="bg-white shadow-sm w-8 h-8 rounded-xl flex items-center justify-center text-red-500 font-black">-</button>
                        <span class="font-black text-sm w-6 text-center ${isLow ? 'text-red-600' : 'text-slate-700'}">${i.q}</span>
                        <button onclick="updateQty(${index}, 1)" class="bg-white shadow-sm w-8 h-8 rounded-xl flex items-center justify-center text-green-600 font-black">+</button>
                    </div>
                </div>`;
        }).join('');

        // Mise à jour des autres éléments (historique, etc.)
        const hist = [...db.sales, ...db.expenses, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 12);
        document.getElementById('hist').innerHTML = hist.map(i => `
            <div class="card flex justify-between items-center p-4 border-l-4 ${i.montant?'border-red-800 bg-red-50':i.isExp?'border-red-500':'border-blue-500'}">
                <div><b class="text-slate-800">${i.cli || i.n}</b><br><small class="text-[9px] text-slate-400 font-bold uppercase">${i.d}</small></div>
                <b class="text-sm ${i.isExp || i.montant?'text-red-500':'text-blue-600'}">${(i.tot || -i.a || -i.montant).toLocaleString()}</b>
            </div>
        `).join('');
        
        document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
        checkLicense(); 
        lucide.createIcons();
    }

    // --- AJOUT DE L'INTERFACE DE CALCUL DANS LA VENTE ---
    // (A ajouter manuellement dans ton HTML à l'endroit du panier)
    function renderCart() {
        let t = 0;
        document.getElementById('cart').innerHTML = cart.map((i, index) => { 
            t+=i.st; 
            return `
            <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100">
                <div><b class="text-sm text-slate-700">${i.n}</b><br><small class="text-slate-400 font-bold">Qté: ${i.sq} × ${i.s}</small></div>
                <div class="flex items-center gap-4">
                    <b class="text-blue-600 text-sm">${i.st.toLocaleString()}</b>
                    <button onclick="removeFromCart(${index})" class="text-red-300 hover:text-red-500"><i data-lucide="x-circle" class="w-5 h-5"></i></button>
                </div>
            </div>`}).join('');
        
        // Ajout dynamique de la zone de calcul de monnaie si le panier n'est pas vide
        if (cart.length > 0) {
            document.getElementById('cart').innerHTML += `
                <div class="mt-4 p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <label class="text-[10px] font-bold text-blue-600 uppercase">Argent reçu du client :</label>
                    <input type="number" id="client_cash" oninput="updateMonnaie()" placeholder="0" class="input-f m-0 mt-1">
                    <p id="monnaie_result" class="mt-2 text-sm font-bold text-slate-600">En attente du montant...</p>
                </div>
            `;
        }

        document.getElementById('cartT').innerText = t.toLocaleString();
        lucide.createIcons();
    }

    // ... (Le reste de tes fonctions existantes : saveSetup, addStock, nav, etc. ne changent pas)
</script>
