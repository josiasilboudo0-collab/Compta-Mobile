<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro - Gestion simplifiée</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; transition: transform 0.2s; }
        .input-f { width: 100%; padding: 16px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 12px; outline: none; transition: all 0.2s; background: #FDFDFD; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); background: white; }
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 18px; border-radius: 20px; font-weight: 700; width: 100%; border: none; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); transition: all 0.2s; }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: 0.3s; }
        nav button.active { color: #2563EB; transform: translateY(-5px); }
        nav button.active i { background: rgba(37, 99, 235, 0.1); padding: 8px; border-radius: 14px; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 40px 30px; }
        .badge-status { font-size: 10px; font-weight: 800; padding: 6px 12px; border-radius: 12px; text-transform: uppercase; }
        .low-stock-alert { color: #ef4444 !important; animation: pulse-red 1s infinite; font-weight: 800; }
        @keyframes pulse-red { 50% { opacity: 0.5; } }
        .logo-preview-container { width: 100px; height: 100px; margin: 0 auto 20px; border-radius: 30px; border: 2px dashed #CBD5E1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #F1F5F9; cursor: pointer; }
        #logo-preview { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <div class="max-w-md mx-auto">
            <h2 id="setup-title" class="text-3xl font-extrabold text-slate-900 mb-2">Configuration</h2>
            <p class="text-slate-500 mb-8 text-sm">Personnalisez votre boutique.</p>
            
            <div class="space-y-4">
                <div class="logo-preview-container" onclick="document.getElementById('setup-logo').click()">
                    <img id="logo-preview" src="" alt="Aperçu">
                    <div id="logo-icon" class="text-center text-[10px] text-slate-400 font-bold">
                        <i data-lucide="camera" class="mx-auto mb-1"></i><span>LOGO</span>
                    </div>
                </div>
                <input type="file" id="setup-logo" accept="image/*" class="hidden" onchange="previewImage(this)">

                <input type="text" id="setup-user" placeholder="Nom du Gérant" class="input-f">
                <input type="text" id="setup-biz" placeholder="Nom de la Boutique" class="input-f">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="setup-phone" placeholder="Téléphone" class="input-f">
                    <select id="setup-cur" class="input-f">
                        <option value="FCFA">FCFA</option>
                        <option value="GNF">GNF</option>
                        <option value="$">$ Dollar</option>
                        <option value="€">€ Euro</option>
                    </select>
                </div>
                <input type="text" id="setup-addr" placeholder="Adresse physique" class="input-f">

                <button onclick="saveSetup()" class="btn-blue text-lg">VALIDER</button>
                <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm hidden py-2">IGNORER</button>
            </div>
        </div>
    </div>

    <header class="p-6 bg-white/80 backdrop-blur-md border-b border-slate-100 flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 tracking-tighter uppercase">ComptaPro</h1>
            <p id="licence-status" class="text-[9px] font-extrabold text-blue-500 tracking-widest uppercase">Version Standard</p>
        </div>
        <div id="days-badge" class="badge-status"></div>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <p class="text-xs opacity-60 uppercase font-extrabold tracking-widest mb-1">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold tracking-tighter mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                <div class="grid grid-cols-3 gap-3">
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">JOUR</span>
                        <span id="repJ" class="font-extrabold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">SEM.</span>
                        <span id="repS" class="font-extrabold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[9px] font-bold opacity-50 block mb-1">MOIS</span>
                        <span id="repM" class="font-extrabold text-sm">0</span>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="nav('sale')" class="card m-0 flex flex-col items-center gap-3 p-6">
                    <i data-lucide="shopping-cart" class="text-blue-600"></i>
                    <span class="text-xs font-extrabold uppercase">Vendre</span>
                </button>
                <button onclick="nav('expense')" class="card m-0 flex flex-col items-center gap-3 p-6">
                    <i data-lucide="arrow-down-circle" class="text-red-500"></i>
                    <span class="text-xs font-extrabold uppercase">Dépense</span>
                </button>
            </div>

            <h3 class="text-xs font-extrabold text-slate-400 mb-4 uppercase tracking-widest">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Nouvelle Vente</h2>
                <div class="card border-t-8 border-blue-600">
                    <input type="text" id="vendeur" placeholder="Vendeur" class="input-f">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-slate-900 text-white px-5 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>

                    <div id="cart" class="mt-4 space-y-2 border-t border-dashed border-slate-200 pt-5"></div>
                    
                    <div id="money-calc" class="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-100 hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Reçu</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-32 p-2 rounded-lg border text-right font-bold" placeholder="0">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Monnaie</span>
                            <span id="change-due" class="font-extrabold text-green-600">0</span>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total</p>
                            <span class="font-extrabold text-3xl"><span id="cartT">0</span> <small class="cur text-lg text-slate-400"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-10 py-4 rounded-2xl font-extrabold uppercase text-sm">Valider</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold">+ Produit</button>
                </div>
                
                <div id="stk-form" class="hidden card bg-blue-50/50">
                    <input type="text" id="p_name" placeholder="Nom de l'article" class="input-f">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité" class="input-f">
                    <button onclick="addStock()" class="btn-blue mt-2">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6">Administration</h2>
            <div class="card bg-slate-900 text-white">
                <p class="text-[10px] font-bold opacity-50 uppercase mb-1">ID Licence</p>
                <h3 id="displayID" class="text-xl font-mono font-bold text-blue-400"></h3>
            </div>
            
            <button onclick="openSetup(true)" class="card w-full flex justify-between p-5 font-bold">
                <span>Modifier Profil Boutique</span> <i data-lucide="chevron-right"></i>
            </button>

            <button onclick="exportAudit()" class="card w-full text-left p-5 font-bold text-slate-600">Exporter les données</button>
            <button onclick="resetData()" class="w-full py-8 text-red-400 font-bold text-xs uppercase tracking-widest">Réinitialiser l'application</button>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="user"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V13_DATABASE')) || { 
            biz:{}, stk:[], sales:[], expenses:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            installDate: Date.now() 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V13_DATABASE', JSON.stringify(db)); }

        window.onload = () => { 
            if (!db.biz.name) openSetup(false); 
            render(); 
            lucide.createIcons();
        };

        function nav(p) {
            document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('n-'+p).classList.add('active');
            window.scrollTo(0,0);
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = document.getElementById('logo-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                    document.getElementById('logo-icon').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-user').value = db.biz.user || "";
                document.getElementById('setup-biz').value = db.biz.name || "";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function saveSetup() {
            const name = document.getElementById('setup-biz').value;
            if(!name) return alert("Nom requis");
            db.biz = {
                name,
                user: document.getElementById('setup-user').value,
                phone: document.getElementById('setup-phone').value,
                cur: document.getElementById('setup-cur').value,
                addr: document.getElementById('setup-addr').value,
                logo: document.getElementById('logo-preview').src
            };
            save();
            location.reload();
        }

        function addStock() {
            let n = document.getElementById('p_name').value;
            let c = +document.getElementById('p_cost').value;
            let s = +document.getElementById('p_sell').value;
            let q = +document.getElementById('p_qty').value;
            if(!n || q < 0) return;
            db.stk.push({id: Date.now(), n, c, s, q});
            save(); render();
            document.getElementById('stk-form').classList.add('hidden');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value;
            let q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q || q <= 0) return alert("Stock insuffisant ou quantité invalide");
            
            cart.push({id: it.id, n: it.n, sq: q, s: it.s, c: it.c, st: (it.s * q)});
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart');
            const total = cart.reduce((a, b) => a + b.st, 0);
            container.innerHTML = cart.map((c, i) => `
                <div class="flex justify-between text-sm font-bold">
                    <span>${c.n} x${c.sq}</span>
                    <span>${c.st.toLocaleString()}</span>
                </div>
            `).join('');
            document.getElementById('cartT').innerText = total.toLocaleString();
            document.getElementById('money-calc').classList.remove('hidden');
        }

        function doSale() {
            if(!cart.length) return;
            let profit = 0;
            let total = 0;
            cart.forEach(c => {
                let s = db.stk.find(x => x.id == c.id);
                s.q -= c.sq;
                profit += (c.s - c.c) * c.sq;
                total += c.st;
            });
            db.prof += profit;
            db.sales.push({id: Date.now(), d: new Date().toLocaleString(), cli: document.getElementById('cl_name').value || "Client", tot: total, items: [...cart]});
            cart = [];
            save(); render(); nav('home');
            alert("Vente enregistrée !");
        }

        function render() {
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.getElementById('header-biz').innerText = db.biz.name || "ComptaPro";
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur || "FCFA");
            document.getElementById('displayID').innerText = db.licenseID;
            
            // Liste stock
            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card flex justify-between items-center p-4">
                    <div><b>${i.n}</b><br><small class="${i.q < 5 ? 'text-red-500 font-bold':''}">${i.q} en stock</small></div>
                    <b class="text-blue-600">${i.s.toLocaleString()}</b>
                </div>
            `).join('');

            // Select vente
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');

            // Historique
            document.getElementById('hist').innerHTML = db.sales.slice(-5).reverse().map(s => `
                <div class="card p-4 border-l-4 border-blue-500 flex justify-between">
                    <div><b>${s.cli}</b><br><small>${s.d}</small></div>
                    <b class="text-blue-600">+${s.tot.toLocaleString()}</b>
                </div>
            `).join('');
        }

        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }
        function resetData() { if(confirm("Tout effacer ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
