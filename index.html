<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro - Officiel</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#2563EB">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #F3F4F6; padding-bottom: 90px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .page { display: none; } .page.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 18px; border-radius: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 12px; border: 1px solid rgba(0,0,0,0.02); }
        .input-f { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #D1D5DB; margin-bottom: 10px; outline: none; font-size: 16px; transition: 0.2s; }
        .input-f:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-blue { background: #2563EB; color: white; padding: 16px; border-radius: 14px; font-weight: 800; width: 100%; border: none; active:scale-95; transition: 0.1s; }
        .locked { filter: blur(10px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #E5E7EB; z-index: 100; }
        nav button { color: #9CA3AF; font-size: 10px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; }
        nav button.active { color: #2563EB; }
    </style>
</head>
<body>

    <header class="p-5 bg-white border-b flex justify-between items-center sticky top-0 z-[110]">
        <div>
            <h1 id="bizT" class="font-black text-xl text-blue-600 italic">ComptaPro</h1>
            <p id="licence-text" class="text-[9px] font-black text-gray-400 uppercase tracking-widest"></p>
        </div>
        <div id="days-badge" class="px-3 py-1 rounded-full text-[10px] font-black shadow-sm"></div>
    </header>

    <main class="p-4">
        
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-[30px] text-white shadow-xl mb-6 relative overflow-hidden">
                <p class="text-xs opacity-80 uppercase font-black">Bénéfice Net Actuel</p>
                <h2 class="text-4xl font-black mt-2"><span id="valP">0</span> <span class="cur text-lg"></span></h2>
                <i data-lucide="trending-up" class="absolute -right-4 -bottom-4 w-24 h-24 opacity-10"></i>
            </div>
            <h3 class="text-xs font-black text-gray-400 mb-3 uppercase flex items-center gap-2"><i data-lucide="list"></i> Journal d'activité</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-6">Nouvelle Vente</h2>
                <div class="card border-t-4 border-blue-600">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    <div class="flex gap-2">
                        <select id="sel_p" class="input-f flex-1 m-0"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0">
                        <button onclick="addCart()" class="bg-blue-600 text-white px-4 rounded-xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="mt-4 space-y-2 border-t border-dashed pt-4"></div>
                    <div class="mt-6 flex justify-between items-center font-black">
                        <span>Total: <span id="cartT">0</span> <span class="cur"></span></span>
                        <button onclick="doSale()" class="bg-green-600 text-white px-8 py-3 rounded-2xl shadow-lg">VENDRE</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white p-3 rounded-full shadow-lg"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card bg-blue-50 border-2 border-blue-100">
                    <input type="text" id="p_name" placeholder="Article" class="input-f">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité Initiale" class="input-f">
                    <button onclick="addStock()" class="btn-blue shadow-lg">ENREGISTRER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6 text-gray-800">Compte & Licence</h2>
            
            <div class="card bg-blue-600 text-white shadow-xl">
                <p class="text-[10px] font-black opacity-60 uppercase">Identifiant de Licence Unique</p>
                <h3 id="displayID" class="text-2xl font-mono font-black tracking-tighter mt-1">GÉNÉRATION...</h3>
            </div>

            <div id="activation-card" class="card border-2 border-green-200 mt-4">
                <h3 class="font-black text-sm text-green-700 mb-2 uppercase">Activer 30 Jours</h3>
                <input type="text" id="activation-key" placeholder="Entrez la clé PRO-XXXX" class="input-f border-2 border-green-100 font-mono text-center text-lg uppercase">
                <button onclick="checkKey()" class="btn-blue bg-green-600 mb-4">ACTIVER</button>
                <button onclick="contactWA()" class="w-full text-[10px] text-green-600 font-black uppercase tracking-tighter">Acheter une clé (+226 66566140)</button>
            </div>

            <div class="card mt-6">
                <h3 class="font-black text-sm mb-4">Audit & Sécurité</h3>
                <button onclick="exportAudit()" class="btn-blue bg-black mb-4 flex items-center justify-center gap-3">
                    <i data-lucide="download"></i> EXPORTER TOUT (.JSON)
                </button>
                <div class="border-t pt-4">
                    <button onclick="resetProfitAudit()" class="bg-red-50 text-red-600 border border-red-200 p-4 rounded-2xl w-full font-black text-xs uppercase">
                        Réinitialiser le bénéfice actuel
                    </button>
                </div>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="shield-check"></i>Licence</button>
    </nav>

    <script>
        // --- BASE DE DONNÉES ---
        let db = JSON.parse(localStorage.getItem('CP_V9_CORE')) || { 
            p:{name:"Mon Commerce", cur:"FCFA"}, 
            stk:[], sales:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000),
            expiryDate: null 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V9_CORE', JSON.stringify(db)); }

        // --- FORMULE SECRÈTE : (ID * 7) + 42 + Mois ---
        function checkLicense() {
            const now = new Date().getTime();
            const badge = document.getElementById('days-badge');
            const lockZone = document.getElementById('lock-zone');
            const statusText = document.getElementById('licence-text');

            if (!db.expiryDate || now > db.expiryDate) {
                badge.innerText = "EXPIRÉ";
                badge.className = "px-3 py-1 rounded-full text-[10px] font-black bg-red-100 text-red-600";
                statusText.innerText = "Mode Gratuit Limité";
                lockZone.classList.add('locked');
                return false;
            } else {
                const diff = db.expiryDate - now;
                const days = Math.ceil(diff / (1000 * 60 * 60 * 24));
                badge.innerText = days + " JOURS RESTANTS";
                badge.className = "px-3 py-1 rounded-full text-[10px] font-black bg-green-100 text-green-600";
                statusText.innerText = "Version Professionnelle";
                lockZone.classList.remove('locked');
                return true;
            }
        }

        function checkKey() {
            const input = document.getElementById('activation-key').value.trim().toUpperCase();
            const idDigits = parseInt(db.licenseID.replace(/\D/g, ''));
            const currentMonth = new Date().getMonth() + 1;
            const formula = (idDigits * 7) + 42 + currentMonth;
            const validKey = "PRO-" + formula;

            if (input === validKey) {
                const thirtyDays = 30 * 24 * 60 * 60 * 1000;
                const base = (db.expiryDate && db.expiryDate > new Date().getTime()) ? db.expiryDate : new Date().getTime();
                db.expiryDate = base + thirtyDays;
                save();
                alert("✅ ACCÈS PRO ACTIVÉ POUR 30 JOURS !");
                location.reload();
            } else {
                alert("❌ CLÉ INVALIDE POUR CE MOIS.");
            }
        }

        function contactWA() {
            const msg = encodeURIComponent(`Bonjour, je souhaite activer ma licence ComptaPro.\n🆔 ID : ${db.licenseID}\n🏢 Entreprise : ${db.p.name}`);
            window.open(`https://wa.me/22666566140?text=${msg}`, '_blank');
        }

        // --- GESTION DES VENTES ---
        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || !s) return;
            db.stk.push({id:Date.now(), n, c, s, q});
            save(); render(); toggleF('stk-form');
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            cart.push({...it, sq:q, st:it.s*q});
            renderCart();
        }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map((i,idx) => { 
                t += i.st;
                return `<div class="flex justify-between items-center text-sm font-bold bg-gray-50 p-3 rounded-xl">
                    <span>${i.n} x${i.sq}</span>
                    <div class="flex items-center gap-3">
                        <span>${i.st.toLocaleString()}</span>
                        <button onclick="cart.splice(${idx},1);renderCart()" class="text-red-400"><i data-lucide="x-circle" class="w-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!checkLicense()) return alert("Veuillez activer la version PRO !");
            if(!cart.length) return;
            let cli = document.getElementById('cl_name').value || "CLIENT PASSAGER";
            let tP=0, tV=0;
            cart.forEach(c => {
                let s = db.stk.find(x => x.id == c.id);
                s.q -= c.sq; tV += c.st; tP += (c.s - c.c) * c.sq;
            });
            db.prof += tP;
            const saleData = {id:Date.now(), cli, tot:tV, items:[...cart], d:new Date().toLocaleString()};
            db.sales.push(saleData);
            save(); 
            genPDF(saleData);
            cart=[]; render(); nav('home');
            alert("Vente validée !");
        }

        function genPDF(s) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(22).text(db.p.name, 20, 20);
            doc.setFontSize(10).text("REÇU : " + s.cli.toUpperCase(), 20, 30);
            doc.text("Date : " + s.d, 20, 35);
            doc.autoTable({ startY: 40, head: [['Article', 'Qté', 'Prix', 'Total']], body: s.items.map(i => [i.n, i.sq, i.s, i.st]) });
            doc.setFontSize(16).text("TOTAL PAYÉ : " + s.tot.toLocaleString() + " " + db.p.cur, 20, doc.lastAutoTable.finalY + 15);
            doc.save(`Reçu_${s.cli}.pdf`);
        }

        // --- AUDIT & EXPORT ---
        function resetProfitAudit() {
            let confirmVal = prompt("Pour réinitialiser, tapez le bénéfice actuel (" + db.prof + ") :");
            if (parseInt(confirmVal) === db.prof) {
                db.resets.push({ date: new Date().toLocaleString(), montant: db.prof });
                db.sales.push({ id:Date.now(), cli:"🛠 RÉINITIALISATION", tot:-db.prof, d:new Date().toLocaleString(), isAudit:true });
                db.prof = 0;
                save(); render();
                alert("Audit : Le bénéfice a été remis à zéro et tracé.");
            } else { alert("Montant incorrect."); }
        }

        function exportAudit() {
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ComptaPro_Audit_${db.licenseID}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // --- NAVIGATION & AFFICHAGE ---
        function render() {
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.p.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            document.getElementById('hist').innerHTML = db.sales.slice(-15).reverse().map(s => `
                <div class="card flex justify-between items-center ${s.isAudit ? 'bg-red-50 border-l-4 border-red-500' : ''}">
                    <div><b class="${s.isAudit ? 'text-red-600' : 'text-gray-800'}">${s.cli}</b><br><small class="text-gray-400 text-[10px]">${s.d}</small></div>
                    <b class="${s.isAudit ? 'text-red-600' : 'text-blue-600'}">${s.tot.toLocaleString()}</b>
                </div>
            `).join('');
            document.getElementById('stkList').innerHTML = db.stk.map(i => `<div class="card flex justify-between"><span><b>${i.n}</b> (Stock: ${i.q})</span><b>${i.s}</b></div>`).join('');
            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            checkLicense();
            lucide.createIcons();
        }

        function nav(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        window.onload = () => { render(); };
    </script>
</body>
</html>
