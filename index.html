<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite V14 - Final</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #1e293b; padding-bottom: 100px; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-premium { background: white; border-radius: 24px; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 4px 15px rgba(0,0,0,0.02); padding: 20px; }
        .btn-main { background: var(--primary); color: white; border-radius: 16px; padding: 16px; font-weight: 700; width: 100%; transition: all 0.2s; border: none; }
        .input-pro { width: 100%; background: #f1f5f9; border: 2px solid transparent; border-radius: 14px; padding: 14px; outline: none; }
        .nav-pro { position: fixed; bottom: 20px; left: 20px; right: 20px; background: #1e293b; border-radius: 22px; height: 70px; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-pro button { color: #94a3b8; display: flex; flex-direction: column; align-items: center; font-size: 10px; font-weight: 600; }
        .nav-pro button.active { color: white; }
        #setup-screen { position: fixed; inset: 0; background: white; z-index: 5000; padding: 30px; display: none; overflow-y: auto; }
        .locked { filter: blur(8px); pointer-events: none; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <h2 class="text-3xl font-extrabold mb-6">Profil Entreprise</h2>
        <div class="space-y-4">
            <div class="bg-slate-50 p-4 rounded-2xl border-2 border-dashed border-slate-200 text-center">
                <input type="file" id="setup-logo" accept="image/*" class="text-xs">
            </div>
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-pro">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-pro">
            <input type="text" id="setup-phone" placeholder="Contact" class="input-pro">
            <select id="setup-cur" class="input-pro">
                <option value="FCFA">FCFA</option>
                <option value="GNF">GNF</option>
                <option value="$">USD ($)</option>
            </select>
            <button onclick="saveSetup()" class="btn-main mt-4 uppercase">Valider</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold mt-4 hidden">Annuler</button>
        </div>
    </div>

    <header class="bg-white/90 backdrop-blur-md p-5 sticky top-0 z-[1100] border-b border-slate-100 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <img id="header-logo-img" src="" class="w-10 h-10 rounded-xl hidden object-cover border border-slate-100">
            <div>
                <h1 id="header-biz" class="font-extrabold text-lg uppercase tracking-tight">ComptaPro</h1>
                <p id="licence-status" class="text-[8px] font-black text-slate-400 uppercase">Chargement...</p>
            </div>
        </div>
        <div id="days-badge" class="px-3 py-1.5 rounded-full text-[9px] font-black"></div>
    </header>

    <main class="p-5">
        <div id="page-home" class="page active">
            <div class="bg-gradient-to-br from-blue-600 to-blue-800 p-8 rounded-[35px] text-white shadow-xl mb-6">
                <p class="text-[10px] font-bold opacity-70 uppercase tracking-widest">Bénéfice Global</p>
                <h2 class="text-4xl font-black mt-1"><span id="valP">0</span> <small class="text-sm cur opacity-80"></small></h2>
                <div class="grid grid-cols-3 gap-2 mt-8">
                    <div class="bg-white/10 p-2.5 rounded-2xl text-center"><span class="text-[8px] block opacity-60 font-bold">JOUR</span><span id="repJ" class="text-xs font-black">0</span></div>
                    <div class="bg-white/10 p-2.5 rounded-2xl text-center"><span class="text-[8px] block opacity-60 font-bold">SEMAINE</span><span id="repS" class="text-xs font-black">0</span></div>
                    <div class="bg-white/10 p-2.5 rounded-2xl text-center"><span class="text-[8px] block opacity-60 font-bold">MOIS</span><span id="repM" class="text-xs font-black">0</span></div>
                </div>
            </div>
            <h3 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Historique</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-black mb-4">Caisse</h2>
                <div class="card-premium space-y-3 mb-6">
                    <input type="text" id="cl_name" placeholder="Client (Optionnel)" class="input-pro">
                    <div class="flex gap-2">
                        <select id="sel_p" class="input-pro flex-1 font-bold"></select>
                        <input type="number" id="sel_q" value="1" class="input-pro w-20 text-center font-bold">
                    </div>
                    <button onclick="addCart()" class="w-full py-4 bg-slate-100 rounded-2xl font-bold text-slate-600">Ajouter au Panier</button>
                </div>
                <div id="cart" class="space-y-3 mb-6"></div>
                <div class="card-premium flex justify-between items-center border-2 border-blue-50">
                    <div><p class="text-[10px] font-bold text-slate-400 uppercase">Total Net</p><h3 class="text-2xl font-black text-blue-600"><span id="cartT">0</span> <small class="cur text-sm"></small></h3></div>
                    <button onclick="doSale()" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-black shadow-lg">FACTURER</button>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-black">Stock</h2>
                    <button onclick="toggleF('stk-form')" class="w-12 h-12 bg-slate-900 text-white rounded-2xl flex items-center justify-center"><i data-lucide="plus"></i></button>
                </div>
                <div id="stk-form" class="hidden card-premium mb-6 space-y-3">
                    <input type="text" id="p_name" placeholder="Article" class="input-pro">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="P. Achat" class="input-pro">
                        <input type="number" id="p_sell" placeholder="P. Vente" class="input-pro">
                    </div>
                    <input type="number" id="p_qty" placeholder="Quantité Initiale" class="input-pro">
                    <button onclick="addStock()" class="btn-main">Enregistrer</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-black mb-6">Administration</h2>
            
            <div class="card-premium bg-slate-900 text-white mb-6">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">ID Licence (A communiquer)</p>
                <div class="flex justify-between items-center">
                    <h3 id="displayID" class="text-2xl font-black text-blue-400"></h3>
                    <button onclick="copyID()" class="text-[10px] bg-white/10 px-4 py-2 rounded-xl font-bold uppercase">Copier</button>
                </div>
            </div>

            <button onclick="openSetup(true)" class="card-premium w-full flex justify-between items-center mb-6 font-bold">
                <span>Modifier mon Entreprise</span> <i data-lucide="chevron-right" class="text-slate-300"></i>
            </button>

            <div class="card-premium border-2 border-emerald-50 mb-6">
                <h4 class="text-xs font-black text-slate-400 uppercase mb-4">Activation</h4>
                <div class="space-y-3">
                    <button onclick="contactWA()" class="btn-main !bg-emerald-600 flex items-center justify-center gap-3">
                        <i data-lucide="message-circle"></i> Payer via WhatsApp
                    </button>
                    <button onclick="window.open('https://qaasxtqf.mychariow.shop/abonnement-pro-compta-mobile/checkout')" class="btn-main !bg-orange-500">Payer en ligne (Chariow)</button>
                    <div class="flex gap-2 pt-2">
                        <input type="text" id="activation-key" placeholder="Code PRO-XXXX" class="input-pro text-center font-black">
                        <button onclick="checkKey()" class="bg-slate-900 text-white px-6 rounded-2xl font-black text-xs uppercase">Activer</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <button onclick="exportAudit()" class="p-4 bg-white rounded-2xl text-[10px] font-black border border-slate-100 uppercase flex flex-col items-center gap-2"><i data-lucide="download" class="w-4"></i> Sauvegarder</button>
                <label for="restore-file" class="p-4 bg-white rounded-2xl text-[10px] font-black border border-slate-100 uppercase flex flex-col items-center gap-2 cursor-pointer"><i data-lucide="upload" class="w-4"></i> Restaurer</label>
                <input type="file" id="restore-file" class="hidden" onchange="restoreData(this)">
            </div>

            <button onclick="resetProfitAudit()" class="w-full text-red-500 text-[10px] font-black uppercase py-4 bg-red-50 rounded-2xl mb-8">Remise à zéro de la caisse</button>
            <button onclick="logout()" class="w-full text-slate-400 text-[10px] font-bold underline">Déconnexion / Effacer l'appareil</button>
        </div>
    </main>

    <nav class="nav-pro">
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="layout-dashboard"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-bag"></i>Ventes</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="shield-check"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_FINAL')) || { 
            biz:{}, stk:[], sales:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), expiryDate: null 
        };
        let cart = [];

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };
        function save() { localStorage.setItem('CP_V14_FINAL', JSON.stringify(db)); }

        function openSetup(isEdit) {
            document.getElementById('setup-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-biz').value = db.biz.name || "";
                document.getElementById('setup-addr').value = db.biz.addr || "";
                document.getElementById('setup-phone').value = db.biz.phone || "";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }
        function closeSetup() { document.getElementById('setup-screen').style.display = 'none'; }

        function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return alert("Nom requis");
            const file = document.getElementById('setup-logo').files[0];
            const fin = (img) => {
                db.biz = { name: bizName, addr: document.getElementById('setup-addr').value, phone: document.getElementById('setup-phone').value, cur: document.getElementById('setup-cur').value, logo: img || db.biz.logo || "" };
                save(); location.reload();
            };
            if(file) { const r = new FileReader(); r.onloadend = () => fin(r.result); r.readAsDataURL(file); } else fin();
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            if(db.biz.logo) { let img = document.getElementById('header-logo-img'); img.src = db.biz.logo; img.classList.remove('hidden'); }
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            document.getElementById('displayID').innerText = db.licenseID;
            
            const logs = [...db.sales, ...db.resets].sort((a,b) => b.id - a.id).slice(0, 10);
            document.getElementById('hist').innerHTML = logs.map(i => `
                <div class="card-premium flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${i.montant ? 'bg-red-50 text-red-500' : 'bg-blue-50 text-blue-500'}">
                            <i data-lucide="${i.montant ? 'shield-alert' : 'arrow-up-right'}" class="w-4"></i>
                        </div>
                        <div><p class="text-xs font-bold">${i.cli || i.n}</p><p class="text-[8px] text-slate-400 font-bold uppercase">${i.d}</p></div>
                    </div>
                    <span class="font-black text-sm ${i.montant ? 'text-red-500' : 'text-blue-600'}">${i.montant ? '-' : '+'}${(i.tot || i.montant).toLocaleString()}</span>
                </div>
            `).join('');

            document.getElementById('stkList').innerHTML = db.stk.map(i => `
                <div class="card-premium flex justify-between items-center">
                    <div><p class="font-black text-slate-800">${i.n}</p><p class="text-[10px] text-slate-400 font-bold">STOCK: ${i.q}</p></div>
                    <div class="flex items-center gap-4">
                        <div class="text-right font-black text-blue-600">${i.s.toLocaleString()}</div>
                        <button onclick="editQty(${i.id})" class="w-8 h-8 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center"><i data-lucide="pencil" class="w-4"></i></button>
                    </div>
                </div>
            `).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            const now = Date.now();
            const calc = (t) => db.sales.filter(s => (now-s.t) < t).reduce((a,b) => a+b.tot, 0);
            document.getElementById('repJ').innerText = calc(86400000).toLocaleString();
            document.getElementById('repS').innerText = calc(604800000).toLocaleString();
            document.getElementById('repM').innerText = calc(2592000000).toLocaleString();
            checkLicense(); lucide.createIcons();
        }

        // --- Caisse ---
        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            let ex = cart.find(x => x.id == id);
            if(ex) { if(ex.sq + q > it.q) return alert("Stock insuffisant !"); ex.sq += q; ex.st = ex.sq * ex.s; } 
            else { cart.push({...it, sq:q, st:it.s*q}); }
            renderCart();
        }

        function updateCartQty(id, delta) {
            let ci = cart.find(x => x.id === id);
            let si = db.stk.find(x => x.id === id);
            if (delta > 0 && ci.sq + delta > si.q) return alert("Stock limité !");
            ci.sq += delta;
            if (ci.sq <= 0) return removeFromCart(id);
            ci.st = ci.sq * ci.s;
            renderCart();
        }

        function removeFromCart(id) { cart = cart.filter(x => x.id !== id); renderCart(); }

        function renderCart() {
            let t = 0;
            document.getElementById('cart').innerHTML = cart.map(i => { 
                t += i.st; 
                return `<div class="card-premium !p-3 flex justify-between items-center border-l-4 border-blue-500">
                    <div class="flex-1"><p class="text-xs font-black">${i.n}</p><p class="text-[10px] text-slate-400 font-bold">${i.s.toLocaleString()}</p></div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateCartQty(${i.id}, -1)" class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center font-bold">-</button>
                        <span class="font-black text-xs">${i.sq}</span>
                        <button onclick="updateCartQty(${i.id}, 1)" class="w-7 h-7 bg-slate-100 rounded-full flex items-center justify-center font-bold">+</button>
                        <button onclick="removeFromCart(${i.id})" class="ml-2 text-red-400"><i data-lucide="trash-2" class="w-4"></i></button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            lucide.createIcons();
        }

        function doSale() {
            if(!checkLicense() || !cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => { let s = db.stk.find(x => x.id == c.id); s.q -= c.sq; tV += c.st; tP += (c.s-c.c)*c.sq; });
            db.prof += tP;
            const sale = {id:Date.now(), cli:document.getElementById('cl_name').value || "Passager", tot:tV, items:[...cart], d:new Date().toLocaleString(), t:Date.now()};
            db.sales.push(sale); save(); genPDF(sale);
            cart=[]; render(); nav('home');
        }

        function genPDF(sale) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            if(db.biz.logo) try { doc.addImage(db.biz.logo, 'PNG', 15, 10, 25, 25); } catch(e){}
            doc.setFont(undefined, 'bold').setFontSize(20).text(db.biz.name.toUpperCase(), 45, 20);
            doc.setFontSize(9).setFont(undefined, 'normal').text(`${db.biz.addr} | ${db.biz.phone}`, 45, 27);
            doc.autoTable({ startY: 45, head: [['Désignation', 'Qté', 'Prix U.', 'Total']], body: sale.items.map(i => [i.n, i.sq, i.s.toLocaleString(), i.st.toLocaleString()]), headStyles:{fillColor:[30, 41, 59]} });
            doc.setFontSize(16).setFont(undefined, 'bold').text(`TOTAL: ${sale.tot.toLocaleString()} ${db.biz.cur}`, 120, doc.lastAutoTable.finalY + 15);
            doc.setFontSize(10).setFont(undefined, 'italic').text("Merci pour votre confiance ! À bientôt. Produit vendu ne peut être retourné.", 105, doc.lastAutoTable.finalY + 30, {align:'center'});
            doc.save(`Facture_${sale.id}.pdf`);
        }

        // --- Stock ---
        function editQty(id) {
            let s = db.stk.find(x => x.id === id);
            let nq = prompt(`Ajuster la quantité pour ${s.n} :`, s.q);
            if (nq !== null && !isNaN(nq)) { s.q = parseInt(nq); save(); render(); }
        }

        function addStock() {
            let n=document.getElementById('p_name').value, c=+document.getElementById('p_cost').value, s=+document.getElementById('p_sell').value, q=+document.getElementById('p_qty').value;
            if(!n || !s) return; db.stk.push({id:Date.now(), n, c, s, q}); save(); render(); toggleF('stk-form');
        }

        // --- Utils ---
        function checkLicense() {
            const now = Date.now(), isOk = db.expiryDate && now < db.expiryDate;
            const badge = document.getElementById('days-badge');
            document.getElementById('lock-zone').classList.toggle('locked', !isOk);
            if(!isOk) { badge.innerText = "EXPIRÉ"; badge.className = "px-3 py-1.5 rounded-full text-[9px] font-black bg-red-100 text-red-600"; document.getElementById('licence-status').innerText = "Mode Lecture"; } 
            else { const d = Math.ceil((db.expiryDate-now)/86400000); badge.innerText = d + " J PRO"; badge.className = "px-3 py-1.5 rounded-full text-[9px] font-black bg-emerald-100 text-emerald-600"; document.getElementById('licence-status').innerText = "Licence Active"; }
            return isOk;
        }

        function checkKey() {
            const k = document.getElementById('activation-key').value.trim().toUpperCase(), d = new Date();
            const f = (parseInt(db.licenseID.replace(/\D/g, '')) * 7) + d.getDate() + (d.getMonth() + 1);
            if(k === "PRO-"+f) { db.expiryDate = (db.expiryDate > Date.now() ? db.expiryDate : Date.now()) + (30*86400000); save(); location.reload(); } else alert("Code erroné.");
        }

        function nav(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.querySelectorAll('.nav-pro button').forEach(b => b.classList.remove('active')); document.getElementById('page-' + id).classList.add('active'); document.getElementById('n-' + id).classList.add('active'); lucide.createIcons(); }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function copyID() { navigator.clipboard.writeText(db.licenseID); alert("ID Copié"); }
        function contactWA() { window.open(`https://wa.me/22666566140?text=Activation%20Licence%20ID:${db.licenseID}`, '_blank'); }
        function exportAudit() { const b = new Blob([JSON.stringify(db)], {type: "application/json"}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `ComptaPro_Backup.json`; a.click(); }
        function restoreData(i) { const r = new FileReader(); r.onload = (e) => { db = JSON.parse(e.target.result); save(); location.reload(); }; r.readAsText(i.files[0]); }
        function resetProfitAudit() { if(confirm("Clôturer la caisse ?")) { db.resets.push({id:Date.now(), n:"Clôture", montant:db.prof, d:new Date().toLocaleString()}); db.prof = 0; save(); render(); } }
        function logout() { if(confirm("Effacer toutes les données ?")) { localStorage.clear(); location.reload(); } }
    </script>
</body>
</html>
