<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ComptaPro Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #F8FAFC; color: #1E293B; padding-bottom: 100px; }
        .page { display: none; } 
        .page.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: white; padding: 24px; border-radius: 28px; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .input-f { width: 100%; padding: 14px; border-radius: 16px; border: 1px solid #E2E8F0; margin-bottom: 10px; outline: none; background: #FDFDFD; }
        .btn-blue { background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%); color: white; padding: 16px; border-radius: 20px; font-weight: 700; width: 100%; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2); }
        .locked { filter: blur(15px); pointer-events: none; opacity: 0.6; }
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; height: 75px; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; border-radius: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); z-index: 1000; }
        nav button { color: #94A3B8; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        nav button.active { color: #2563EB; }
        #overlay-screen { position: fixed; inset: 0; background: #F8FAFC; z-index: 2000; display: none; overflow-y: auto; padding: 30px; }
        .low-stock { color: #ef4444 !important; animation: blink 1s infinite; font-weight: 800; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div id="overlay-screen">
        <h2 id="setup-title" class="text-3xl font-extrabold text-slate-900 mb-2">Configuration</h2>
        <p class="text-slate-500 mb-6 font-medium">Identifiants et infos boutique</p>
        <div class="space-y-2">
            <input type="text" id="setup-biz" placeholder="Nom de l'Entreprise" class="input-f">
            <input type="email" id="setup-email" placeholder="Email de connexion" class="input-f">
            <input type="password" id="setup-pass" placeholder="Mot de passe" class="input-f">
            <input type="text" id="setup-user" placeholder="Nom du Gérant" class="input-f">
            <input type="text" id="setup-addr" placeholder="Adresse" class="input-f">
            <input type="text" id="setup-phone" placeholder="Téléphone" class="input-f">
            <select id="setup-cur" class="input-f">
                <option value="FCFA">Devise : FCFA</option>
                <option value="GNF">Devise : GNF</option>
                <option value="$">Devise : Dollar ($)</option>
                <option value="€">Devise : Euro (€)</option>
            </select>
            <div class="p-4 bg-blue-50 rounded-2xl border border-dashed border-blue-200 text-center mb-4">
                <label class="text-[10px] font-bold uppercase text-blue-600 mb-2 block">Logo Boutique</label>
                <input type="file" id="setup-logo" accept="image/*" class="text-xs">
            </div>
            <button onclick="saveSetup()" class="btn-blue text-lg">ENREGISTRER</button>
            <button id="cancel-setup" onclick="closeSetup()" class="w-full text-slate-400 font-bold text-sm mt-4 hidden">ANNULER</button>
        </div>
    </div>

    <header class="p-6 bg-white border-b flex justify-between items-center sticky top-0 z-[1100]">
        <div>
            <h1 id="header-biz" class="font-extrabold text-xl text-slate-900 uppercase">ComptaPro</h1>
            <div id="days-badge" class="text-[9px] font-bold p-1 px-2 rounded-full mt-1"></div>
        </div>
        <div id="user-display" class="text-right">
            <p id="header-user" class="text-xs font-bold text-slate-600"></p>
            <p id="header-email" class="text-[9px] text-slate-400"></p>
        </div>
    </header>

    <main class="p-5 max-w-xl mx-auto">
        <div id="page-home" class="page active">
            <div class="bg-slate-900 p-8 rounded-[40px] text-white shadow-2xl mb-8 relative overflow-hidden">
                <p class="text-xs opacity-60 uppercase font-extrabold mb-1">Bénéfice Net Global</p>
                <h2 class="text-4xl font-extrabold mb-8"><span id="valP">0</span> <small class="cur text-blue-400 text-lg"></small></h2>
                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[8px] opacity-50 block">JOUR</span>
                        <span id="repJ" class="font-bold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[8px] opacity-50 block">SEM.</span>
                        <span id="repS" class="font-bold text-sm">0</span>
                    </div>
                    <div class="bg-white/10 p-3 rounded-2xl text-center">
                        <span class="text-[8px] opacity-50 block">MOIS</span>
                        <span id="repM" class="font-bold text-sm">0</span>
                    </div>
                </div>
            </div>
            <h3 class="text-xs font-extrabold text-slate-400 mb-4 uppercase tracking-widest">Activités Récentes</h3>
            <div id="hist" class="space-y-3"></div>
        </div>

        <div id="lock-zone">
            <div id="page-sale" class="page">
                <h2 class="text-2xl font-extrabold mb-6">Nouvelle Vente</h2>
                <div class="card border-t-8 border-blue-600">
                    <input type="text" id="cl_name" placeholder="Nom du Client" class="input-f">
                    <div class="flex gap-2 mb-4">
                        <select id="sel_p" class="input-f flex-1 m-0 font-bold"></select>
                        <input type="number" id="sel_q" value="1" class="input-f w-20 text-center m-0 font-bold">
                        <button onclick="addCart()" class="bg-slate-900 text-white px-5 rounded-2xl"><i data-lucide="plus"></i></button>
                    </div>
                    <div id="cart" class="space-y-2 border-t border-dashed pt-4"></div>
                    
                    <div id="money-box" class="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-200 hidden">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs font-bold text-slate-500">ENCAISSÉ</span>
                            <input type="number" id="cash-in" oninput="updateChange()" class="w-28 p-2 rounded-lg border text-right font-bold" placeholder="0">
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-500">MONNAIE À RENDRE</span>
                            <span id="change-due" class="font-black text-green-600 text-lg">0</span>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between items-end">
                        <div>
                            <p class="text-[10px] font-bold text-slate-400 uppercase">Total à payer</p>
                            <span class="font-extrabold text-3xl"><span id="cartT">0</span> <small class="cur text-slate-400"></small></span>
                        </div>
                        <button onclick="doSale()" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-bold uppercase text-xs">Valider</button>
                    </div>
                </div>
            </div>

            <div id="page-stock" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-extrabold">Inventaire</h2>
                    <button onclick="toggleF('stk-form')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold">+ Produit</button>
                </div>
                <div id="stk-form" class="hidden card bg-blue-50 border-blue-100">
                    <input type="text" id="p_name" placeholder="Nom l'article" class="input-f">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p_cost" placeholder="Prix Achat" class="input-f">
                        <input type="number" id="p_sell" placeholder="Prix Vente" class="input-f">
                    </div>
                    <input type="number" id="p_qty" placeholder="Stock Initial" class="input-f">
                    <button onclick="addStock()" class="btn-blue">AJOUTER</button>
                </div>
                <div id="stkList" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-pro" class="page">
            <h2 class="text-2xl font-extrabold mb-6 tracking-tight">Administration</h2>
            
            <div class="card border-2 border-orange-100 bg-orange-50/30">
                <h3 class="font-bold text-xs text-orange-700 mb-4 uppercase tracking-widest text-center">Licence & Activation</h3>
                <div class="grid gap-2 mb-4">
                    <button onclick="contactWA()" class="flex items-center justify-center gap-2 bg-green-600 text-white p-4 rounded-2xl font-bold text-xs">
                        <i data-lucide="message-circle" class="w-4"></i> WHATSAPP
                    </button>
                    <button onclick="openChariow()" class="flex items-center justify-center gap-2 bg-orange-500 text-white p-4 rounded-2xl font-bold text-xs">
                        <i data-lucide="credit-card" class="w-4"></i> CHARIOW PAY
                    </button>
                </div>
                <input type="text" id="activation-key" placeholder="Code d'activation" class="input-f text-center font-mono">
                <button onclick="checkKey()" class="w-full bg-slate-800 text-white p-4 rounded-2xl font-bold text-xs">ACTIVER</button>
            </div>

            <button onclick="openSetup(true)" class="card w-full flex items-center justify-between p-5 font-bold text-slate-700">
                <div class="flex items-center gap-4"><i data-lucide="user-cog" class="text-blue-600"></i> Modifier Profil & Sécurité</div>
                <i data-lucide="chevron-right" class="opacity-30"></i>
            </button>

            <div class="card space-y-3">
                <h3 class="font-extrabold text-[10px] text-slate-400 uppercase">Données & Sécurité</h3>
                <button onclick="exportAudit()" class="w-full flex justify-between p-4 bg-slate-50 rounded-2xl font-bold text-sm">Sauvegarder (Backup) <i data-lucide="download" class="w-4"></i></button>
                
                <label for="restore-file" class="w-full flex justify-between p-4 bg-slate-50 rounded-2xl font-bold text-sm cursor-pointer">
                    Restaurer une sauvegarde <i data-lucide="upload" class="w-4"></i>
                </label>
                <input type="file" id="restore-file" class="hidden" accept=".json" onchange="restoreData(this)">
                
                <button onclick="resetProfitAudit()" class="w-full p-4 text-red-500 font-extrabold text-[10px] uppercase border border-red-50 rounded-2xl">Clôture de caisse (Reset)</button>
                <button onclick="logout()" class="w-full p-4 text-slate-400 font-bold text-[10px] uppercase">Réinitialisation complète</button>
            </div>
        </div>
    </main>

    <nav>
        <button onclick="nav('home')" id="n-home" class="active"><i data-lucide="home"></i>Accueil</button>
        <button onclick="nav('sale')" id="n-sale"><i data-lucide="shopping-cart"></i>Vendre</button>
        <button onclick="nav('stock')" id="n-stock"><i data-lucide="package"></i>Stock</button>
        <button onclick="nav('pro')" id="n-pro"><i data-lucide="settings"></i>Admin</button>
    </nav>

    <script>
        let db = JSON.parse(localStorage.getItem('CP_V14_PRO')) || { 
            biz:{}, stk:[], sales:[], expenses:[], resets:[], prof:0,
            licenseID: "CP-" + Math.floor(1000 + Math.random() * 9000), 
            expiryDate: null, 
            installDate: Date.now() 
        };
        let cart = [];

        function save() { localStorage.setItem('CP_V14_PRO', JSON.stringify(db)); }

        window.onload = () => { if (!db.biz.name) openSetup(false); else render(); };

        function openSetup(isEdit) {
            document.getElementById('overlay-screen').style.display = 'block';
            if(isEdit) {
                document.getElementById('setup-title').innerText = "Profil & Sécurité";
                document.getElementById('setup-biz').value = db.biz.name || "";
                document.getElementById('setup-email').value = db.biz.email || "";
                document.getElementById('setup-pass').value = db.biz.pass || "";
                document.getElementById('setup-user').value = db.biz.user || "";
                document.getElementById('setup-addr').value = db.biz.addr || "";
                document.getElementById('setup-phone').value = db.biz.phone || "";
                document.getElementById('setup-cur').value = db.biz.cur || "FCFA";
                document.getElementById('cancel-setup').classList.remove('hidden');
            }
        }

        function closeSetup() { document.getElementById('overlay-screen').style.display = 'none'; }

        async function saveSetup() {
            const bizName = document.getElementById('setup-biz').value;
            if(!bizName) return alert("Nom boutique requis");
            
            const logoFile = document.getElementById('setup-logo').files[0];
            const finalize = (logoData) => {
                db.biz = {
                    name: bizName,
                    email: document.getElementById('setup-email').value,
                    pass: document.getElementById('setup-pass').value,
                    user: document.getElementById('setup-user').value,
                    addr: document.getElementById('setup-addr').value,
                    phone: document.getElementById('setup-phone').value,
                    cur: document.getElementById('setup-cur').value,
                    logo: logoData || db.biz.logo || ""
                };
                save(); location.reload();
            };

            if (logoFile) {
                const reader = new FileReader();
                reader.onloadend = () => finalize(reader.result);
                reader.readAsDataURL(logoFile);
            } else finalize();
        }

        // GESTION STOCK AVEC BOUTONS +/-
        function updateQty(index, val) {
            let item = db.stk[index];
            item.q = Math.max(0, item.q + val);
            save(); render();
        }

        function removeStock(index) {
            if(confirm("Supprimer cet article ?")) {
                db.stk.splice(index, 1);
                save(); render();
            }
        }

        function addStock() {
            let n=document.getElementById('p_name').value, 
                c=+document.getElementById('p_cost').value, 
                s=+document.getElementById('p_sell').value, 
                q=+document.getElementById('p_qty').value;
            if(!n) return;
            db.stk.push({id:Date.now(), n, c, s, q});
            save(); render(); toggleF('stk-form');
        }

        // CALCUL MONNAIE
        function updateChange() {
            const received = +document.getElementById('cash-in').value || 0;
            const total = cart.reduce((a,b) => a + b.st, 0);
            const change = received - total;
            const display = document.getElementById('change-due');
            display.innerText = (change > 0 ? change.toLocaleString() : 0) + " " + db.biz.cur;
        }

        function addCart() {
            let id = document.getElementById('sel_p').value, q = +document.getElementById('sel_q').value;
            let it = db.stk.find(x => x.id == id);
            if(!it || q > it.q) return alert("Stock insuffisant !");
            cart.push({...it, sq:q, st:it.s*q});
            renderCart();
        }

        function renderCart() {
            let t = 0;
            const box = document.getElementById('money-box');
            if(cart.length > 0) box.classList.remove('hidden');
            document.getElementById('cart').innerHTML = cart.map((i, idx) => {
                t += i.st;
                return `<div class="flex justify-between text-xs bg-slate-50 p-3 rounded-xl border">
                    <span><b>${i.n}</b> (x${i.sq})</span>
                    <div class="flex gap-3"><b>${i.st.toLocaleString()}</b> 
                    <button onclick="cart.splice(${idx},1);renderCart()" class="text-red-400">X</button></div>
                </div>`;
            }).join('');
            document.getElementById('cartT').innerText = t.toLocaleString();
            updateChange();
        }

        function doSale() {
            if(!cart.length) return;
            let tP=0, tV=0;
            cart.forEach(c => {
                let s = db.stk.find(x => x.id == c.id);
                s.q -= c.sq;
                tV += c.st;
                tP += (c.s - c.c) * c.sq;
            });
            db.prof += tP;
            db.sales.push({id:Date.now(), cli:document.getElementById('cl_name').value || "Client", tot:tV, t:Date.now(), d:new Date().toLocaleString()});
            cart=[]; save(); render(); nav('home');
            alert("Vente enregistrée !");
        }

        function render() {
            document.getElementById('header-biz').innerText = db.biz.name;
            document.getElementById('header-user').innerText = db.biz.user || "Gérant";
            document.getElementById('header-email').innerText = db.biz.email || "";
            document.getElementById('valP').innerText = db.prof.toLocaleString();
            document.querySelectorAll('.cur').forEach(e => e.innerText = db.biz.cur);
            
            // Liste Stock avec clignotement
            document.getElementById('stkList').innerHTML = db.stk.map((i, idx) => `
                <div class="card flex justify-between items-center p-4">
                    <div>
                        <b class="text-sm block">${i.n}</b>
                        <span class="text-[10px] font-bold text-blue-600">${i.s} ${db.biz.cur}</span>
                    </div>
                    <div class="flex items-center gap-3 bg-slate-50 p-1 rounded-xl border">
                        <button onclick="updateQty(${idx}, -1)" class="w-8 h-8 bg-white rounded-lg shadow-sm font-bold text-red-500">-</button>
                        <b class="text-sm w-8 text-center ${i.q <= 5 ? 'low-stock' : ''}">${i.q}</b>
                        <button onclick="updateQty(${idx}, 1)" class="w-8 h-8 bg-white rounded-lg shadow-sm font-bold text-green-500">+</button>
                    </div>
                    <button onclick="removeStock(${idx})" class="text-slate-300 ml-2"><i data-lucide="trash-2" class="w-4"></i></button>
                </div>
            `).join('');

            document.getElementById('sel_p').innerHTML = db.stk.map(i => `<option value="${i.id}">${i.n} (${i.q})</option>`).join('');
            
            const hist = [...db.sales].sort((a,b)=>b.id-a.id).slice(0,10);
            document.getElementById('hist').innerHTML = hist.map(h => `
                <div class="card flex justify-between p-4 border-l-4 border-blue-500 mb-2">
                    <div class="text-xs"><b>${h.cli}</b><br><small class="text-slate-400">${h.d}</small></div>
                    <b class="text-blue-600">${h.tot.toLocaleString()}</b>
                </div>
            `).join('');

            checkLicense();
            lucide.createIcons();
        }

        // BACKUP & RESTORE
        function exportAudit() {
            const data = JSON.stringify(db, null, 2);
            const blob = new Blob([data], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Backup_${db.biz.name}_${new Date().toLocaleDateString()}.json`;
            a.click();
        }

        function restoreData(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    db = JSON.parse(e.target.result);
                    save(); location.reload();
                } catch(err) { alert("Fichier invalide"); }
            };
            reader.readAsText(input.files[0]);
        }

        function checkLicense() {
            const badge = document.getElementById('days-badge');
            const now = Date.now();
            const trialEnd = db.installDate + (7 * 86400000);
            const expiry = db.expiryDate || trialEnd;
            const diff = Math.ceil((expiry - now) / 86400000);
            
            if(diff <= 0) {
                badge.innerText = "LICENCE EXPIRÉE";
                badge.className = "text-[9px] font-bold p-1 px-2 rounded-full mt-1 bg-red-100 text-red-600";
                document.getElementById('lock-zone').classList.add('locked');
            } else {
                badge.innerText = diff + " JOURS RESTANTS";
                badge.className = "text-[9px] font-bold p-1 px-2 rounded-full mt-1 bg-green-100 text-green-600";
            }
        }

        function contactWA() { window.open(`https://wa.me/22666566140?text=Activation%20Licence%20ID:${db.licenseID}`, '_blank'); }
        function openChariow() { window.open("https://qaasxtqf.mychariow.shop/abonnement-pro-compta-mobile/checkout", "_blank"); }
        function nav(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
            document.getElementById('page-'+id).classList.add('active');
            document.getElementById('n-'+id).classList.add('active');
            lucide.createIcons();
        }
        function toggleF(id) { document.getElementById(id).classList.toggle('hidden'); }
        function logout() { if(confirm("Supprimer TOUTES les données ?")) { localStorage.clear(); location.reload(); } }
        function resetProfitAudit() { if(confirm("Remettre la caisse à zéro ?")) { db.prof = 0; save(); render(); } }
    </script>
</body>
</html>
